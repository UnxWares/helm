        - kind: changed
          description: ExcaliDash 0.6.5 (from 0.4.27); the images drop from 7 critical / 134 high CVEs to 2 / 27.
        - kind: fixed
          description: The SQLite database had no volume and was lost at every restart; /app/prisma is now persisted by default.
        - kind: fixed
          description: The Ingress sent /api straight to the backend without stripping the prefix; everything now goes through the frontend proxy, like upstream.
        - kind: fixed
          description: Enabling httpRoute failed (undefined service port, non-existent service) and its default rule only matched /headers.
        - kind: security
          description: JWT/CSRF secrets and the API key pepper are generated once and kept in a Secret; the database URL and OIDC client secret are no longer plain environment values.
        - kind: security
          description: Non-root pods (frontend uid 101, backend uid 1001), no capabilities, seccomp RuntimeDefault, read-only root filesystem for the frontend, no service account token.
        - kind: added
          description: Auth mode and OIDC settings, PostgreSQL provider, startup probe, NetworkPolicy isolating the backend, helm test, values schema.
        - kind: removed
          description: "BREAKING: backend autoscaling (Socket.IO state is in memory, the backend runs a single replica)."
