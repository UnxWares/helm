  - annotations:
      artifacthub.io/category: database
      artifacthub.io/changes: |
        - kind: fixed
          description: The MongoDB job always failed (mongosh is not part of Alpine's mongodb-tools); it now runs mongosh from the official mongo image.
        - kind: security
          description: "BREAKING: no more `apk add` at runtime on the EOL alpine:3.19 image: pinned postgres, mysql and mongo client images, kubectl wait init containers. image.postgresql/mysql/mongodb are now {repository, tag, digest} objects; alpine overrides are rejected."
        - kind: security
          description: Jobs run under a dedicated ServiceAccount bound to the read-only DatabaseCluster Role instead of the namespace `default` ServiceAccount; the API token is only mounted in the wait init containers.
        - kind: security
          description: "Usernames and passwords from Secrets are no longer interpolated into SQL/JavaScript (psql \\getenv + %L, hex + QUOTE() for MySQL, process.env for mongosh); database, collection, role and privilege names are validated."
        - kind: security
          description: Hardened pods by default (non-root uid 65532, read-only root filesystem, every capability dropped, seccomp RuntimeDefault) and resource requests.
        - kind: changed
          description: "BREAKING: Job names get a `-<hash>` suffix computed from their values, so `helm upgrade` never hits the immutable Job spec and changed jobs run again. Scripts live in a ConfigMap of the same name."
        - kind: changed
          description: Existing users get their password re-synced from their Secret (global.updateUserPasswords, default true).
        - kind: deprecated
          description: securityContext (pod level) is replaced by podSecurityContext and containerSecurityContext; it is still merged into the pod security context.
        - kind: fixed
          description: MySQL jobs with users or initScripts rendered an invalid manifest (here-doc terminator outside the YAML block); labels, env, privileges and the documented credentialsSecret key were ignored by some jobs.
        - kind: fixed
          description: Artifact Hub category is now database.
        - kind: added
          description: extraEnv, podAnnotations, imagePullSecrets, activeDeadlineSeconds, priorityClassName, per-user Secret keys, literal host/adminUser, sslMode, MySQL privileges, MongoDB roles and uriOptions, initScriptsDatabase, values schema.
      artifacthub.io/containsSecurityUpdates: "true"
      artifacthub.io/displayName: OpenEverest Database Tools
