          links:
            - name: Issue #5
              url: https://github.com/UnxWares/helm/issues/5
        - kind: fixed
          description: The chart did not render at all (conf.ini template iterated over a string) and the database values were never used.
        - kind: fixed
          description: Data is now stored in /cloudreve/data (the only path Cloudreve v4 uses), persisted by default, instead of a memory-backed emptyDir.
        - kind: security
          description: The session secret is generated (or read from your Secret) instead of the hard-coded 23333; database and Redis passwords stay in Secrets and conf.ini is rendered into a memory-backed volume.
        - kind: security
          description: Runs as non-root (uid 1000) with a read-only root filesystem and no capabilities; the binary is started directly (no root supervisord/aria2).
        - kind: added
          description: PostgreSQL/MySQL/MariaDB/SQLite and optional Redis settings, Gateway API HTTPRoute, startup/liveness/readiness probes on /api/v4/site/ping, helm test, values schema.
        - kind: removed
          description: HorizontalPodAutoscaler (Cloudreve runs a single replica) and the busybox connection test.
