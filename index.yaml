apiVersion: v1
entries:
  bind9:
  - annotations:
      artifacthub.io/category: networking
      artifacthub.io/changes: |
        - kind: security
          description: "bind_exporter: v0.8.0 (November 2024, its latest release) was built with a Go toolchain carrying 114 known vulnerabilities. The default is now the master build of 2026-10-14, pinned by digest: the same exporter code rebuilt with a current Go toolchain and dependencies (7 known vulnerabilities). Set metrics.image.tag: v0.8.0 to keep the release."
      artifacthub.io/containsSecurityUpdates: "true"
      artifacthub.io/displayName: ISC Bind9
      artifacthub.io/images: |
        - name: bind9
          image: docker.io/internetsystemsconsortium/bind9:9.20
        - name: bind-exporter
          image: docker.io/prometheuscommunity/bind-exporter:master@sha256:a1f46e6abf8d284a158a1ba0e3275bc2e17f9119ec227f18bdb20019d24b3bcf
      artifacthub.io/license: MIT
      artifacthub.io/links: |
        - name: Chart source
          url: https://github.com/UnxWares/helm/tree/main/charts/bind9
        - name: Upstream
          url: https://www.isc.org/bind/
        - name: BIND 9 documentation
          url: https://bind9.readthedocs.io/
        - name: Support
          url: https://github.com/UnxWares/helm/issues
      artifacthub.io/signKey: |
        fingerprint: 7902E52EA435EF27C6432E5378D6B532C599DA9B
        url: https://helm.unxwares.studio/pgp-public-key.asc
    apiVersion: v2
    appVersion: "9.20"
    created: "2026-10-27T21:22:16.937973702Z"
    description: A flexible and production-ready Helm chart for running ISC Bind9
      DNS server on Kubernetes.
    digest: cb8fb578f54d13600ed0166c9c3db4af7fba0d1fcdf4af56505531278d13dbac
    home: https://github.com/UnxWares/helm/tree/main/charts/bind9
    icon: https://avatars.githubusercontent.com/u/3965132?v=4
    keywords:
    - dns
    - bind
    - bind9
    - authoritative-dns
    - kubernetes
    - helm
    - network
    kubeVersion: '>=1.27.0-0'
    maintainers:
    - email: david.gheghea@unxwares.com
      name: David Gheghea
      url: https://github.com/UnxWares
    - email: baptiste.gosselin@unxwares.com
      name: Baptiste Gosselin
      url: https://github.com/UnxWares
    name: bind9
    sources:
    - https://gitlab.isc.org/isc-projects/bind9
    - https://github.com/isc-projects/bind9-docker
    - https://hub.docker.com/r/internetsystemsconsortium/bind9
    - https://github.com/UnxWares/helm/tree/main/charts/bind9
    type: application
    urls:
    - https://github.com/UnxWares/helm/releases/download/bind9-2026.10.2/bind9-2026.10.2.tgz
    version: 2026.10.2
  - annotations:
      artifacthub.io/category: networking
      artifacthub.io/changes: |
        - kind: security
          description: named now drops root privileges (`-u bind`, uid 53) after binding port 53; the chart's command override used to keep it running as root.
        - kind: security
          description: Read-only root filesystem, every capability dropped except NET_BIND_SERVICE/SETUID/SETGID, seccomp RuntimeDefault, no service account token.
        - kind: changed
          description: "BREAKING: default image moves from 9.21 (ISC development branch) to 9.20 (current stable/ESV). Set image.tag: \"9.21\" to stay on the development branch."
        - kind: changed
          description: "BREAKING: the rndc port is no longer exposed by the Service unless service.exposeRndc is true."
        - kind: changed
          description: The default named.conf is now a working authoritative-only configuration (no recursion, no transfers, version hidden); named runs from /var/cache/bind.
        - kind: fixed
          description: The ServiceMonitor was rendered even with metrics disabled and broke installs on clusters without the Prometheus Operator CRDs.
        - kind: fixed
          description: The metrics port reused the rndc NodePort (service.ports.metricsNodePort added).
        - kind: added
          description: Volumes, volumeMounts and service annotations (PR #6), PodDisruptionBudget, NetworkPolicy, topology spread, priority class, image digests, helm test, values schema.
          links:
            - name: PR #6
              url: https://github.com/UnxWares/helm/pull/6
        - kind: changed
          description: bind_exporter collects the server and view groups by default (tasks is deprecated).
      artifacthub.io/containsSecurityUpdates: "true"
      artifacthub.io/displayName: ISC Bind9
      artifacthub.io/images: |
        - name: bind9
          image: docker.io/internetsystemsconsortium/bind9:9.20
        - name: bind-exporter
          image: docker.io/prometheuscommunity/bind-exporter:v0.8.0
      artifacthub.io/license: MIT
      artifacthub.io/links: |
        - name: Chart source
          url: https://github.com/UnxWares/helm/tree/main/charts/bind9
        - name: Upstream
          url: https://www.isc.org/bind/
        - name: BIND 9 documentation
          url: https://bind9.readthedocs.io/
        - name: Support
          url: https://github.com/UnxWares/helm/issues
      artifacthub.io/signKey: |
        fingerprint: 7902E52EA435EF27C6432E5378D6B532C599DA9B
        url: https://helm.unxwares.studio/pgp-public-key.asc
