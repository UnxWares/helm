name: End-to-end tests

# Install a chart in kind next to real dependencies, then check what the application actually does, not only that
# its pods start. Pull requests run the tests of what they change; main and the weekly run test everything, so that
# a new upstream image or base layer that breaks a chart is caught before a user hits it.
on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
    schedule:
        - cron: "23 5 * * 2"
    workflow_dispatch:

concurrency:
    group: e2e-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    HELM_VERSION: v3.22.1

jobs:
    changes:
        name: Detect changes
        runs-on: ubuntu-latest
        outputs:
            openeverest: ${{ steps.diff.outputs.openeverest }}
            cloudreve: ${{ steps.diff.outputs.cloudreve }}
            taiga: ${{ steps.diff.outputs.taiga }}
            kener: ${{ steps.diff.outputs.kener }}
            excalidash: ${{ steps.diff.outputs.excalidash }}
            fossflow: ${{ steps.diff.outputs.fossflow }}
            bind9: ${{ steps.diff.outputs.bind9 }}
            powerdns: ${{ steps.diff.outputs.powerdns }}
            laravel: ${{ steps.diff.outputs.laravel }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Changed paths
              id: diff
              env:
                  EVENT: ${{ github.event_name }}
                  BASE: ${{ github.event.pull_request.base.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha }}
              run: |
                  matches() {
                      [ "$EVENT" != pull_request ] && return 0
                      git diff --name-only "$BASE" "$HEAD" | grep -qE "$1"
                  }
                  common='^\.github/workflows/e2e\.yaml$'
                  if matches "$common|^charts/openeverest-database-tools/|^images/(postgresql-client|mysql-client|mongosh)/|^\.github/scripts/openeverest-test-"; then
                      echo "openeverest=true" >> "$GITHUB_OUTPUT"
                  fi
                  if matches "$common|^charts/cloudreve/|^images/cloudreve/|^\.github/scripts/cloudreve-e2e\.sh$"; then
                      echo "cloudreve=true" >> "$GITHUB_OUTPUT"
                  fi
                  if matches "$common|^charts/taiga/|^images/(taiga-back|taiga-front|taiga-events|taiga-protected|postgres/17)/|^\.github/scripts/taiga-e2e\.sh$"; then
                      echo "taiga=true" >> "$GITHUB_OUTPUT"
                  fi
                  if matches "$common|^charts/kener/|^\.github/scripts/kener-e2e\.sh$"; then
                      echo "kener=true" >> "$GITHUB_OUTPUT"
                  fi
                  if matches "$common|^charts/excalidash/|^\.github/scripts/excalidash-e2e\.sh$"; then
                      echo "excalidash=true" >> "$GITHUB_OUTPUT"
                  fi
                  if matches "$common|^charts/fossflow/|^images/fossflow/|^\.github/scripts/fossflow-e2e\.sh$"; then
                      echo "fossflow=true" >> "$GITHUB_OUTPUT"
                  fi
                  if matches "$common|^charts/bind9/|^images/(bind9|bind-exporter)/|^\.github/scripts/bind9-e2e\.sh$"; then
                      echo "bind9=true" >> "$GITHUB_OUTPUT"
                  fi
                  if matches "$common|^charts/powerdns/|^images/(pdns-auth|pdns-recursor|postgresql-client|mysql-client)/|^\.github/scripts/powerdns-e2e"; then
                      echo "powerdns=true" >> "$GITHUB_OUTPUT"
                  fi
                  if matches "$common|^charts/laravel-generic/|^\.github/e2e/laravel-app/|^\.github/scripts/laravel-generic-e2e"; then
                      echo "laravel=true" >> "$GITHUB_OUTPUT"
                  fi

    openeverest-database-tools:
        name: openeverest-database-tools
        needs: changes
        if: needs.changes.outputs.openeverest == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            CHART: charts/openeverest-database-tools
            RELEASE: oedt
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The client images of this commit, so that a change to an image is tested before it is published.
            - name: Build the client images
              run: |
                  for image in postgresql-client mysql-client mongosh; do
                      docker build --tag "local/$image:e2e" "images/$image"
                  done

            - name: Create kind cluster
              uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

            - name: Load the client images
              run: |
                  for image in postgresql-client mysql-client mongosh; do
                      kind load docker-image "local/$image:e2e" --name chart-testing
                  done

            - name: Install Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
              with:
                  version: ${{ env.HELM_VERSION }}

            - name: Start PostgreSQL, MySQL, MongoDB and the DatabaseClusters
              run: .github/scripts/openeverest-test-env.sh

            # The client images were loaded into kind; the kubectl image of the wait containers is pulled (the pull
            # policy applies to every container, so it stays IfNotPresent).
            - name: Install the chart and run its Jobs
              run: &install |
                  helm upgrade --install "$RELEASE" "$CHART" --namespace "$RELEASE" --create-namespace \
                      --values "$CHART/ci/e2e-values.yaml" \
                      --set image.postgresql.repository=local/postgresql-client --set image.postgresql.tag=e2e \
                      --set image.mysql.repository=local/mysql-client --set image.mysql.tag=e2e \
                      --set image.mongodb.repository=local/mongosh --set image.mongodb.tag=e2e
                  kubectl --namespace everest-databases wait --for=condition=complete job --all --timeout=600s

            - name: Check the databases, users and grants
              run: .github/scripts/openeverest-test-verify.sh

            - name: Rotate the application passwords
              run: .github/scripts/openeverest-test-rotate.sh

            - name: Run the Jobs again
              run: *install

            - name: Check again with the new passwords
              run: .github/scripts/openeverest-test-verify.sh

            - name: Diagnostics
              if: failure()
              run: |
                  kubectl get pods --all-namespaces -o wide
                  kubectl --namespace everest-databases describe jobs
                  for pod in $(kubectl --namespace everest-databases get pods -o name); do
                      echo "::group::$pod"
                      kubectl --namespace everest-databases logs "$pod" --all-containers --prefix || true
                      echo "::endgroup::"
                  done

    cloudreve:
        name: cloudreve
        needs: changes
        if: needs.changes.outputs.cloudreve == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 40
        env:
            CHART: charts/cloudreve
            RELEASE: cloudreve
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The image of this commit, so that a change to it is tested before it is published.
            - name: Build the Cloudreve image
              run: docker build --tag local/cloudreve:e2e images/cloudreve

            - name: Create kind cluster
              uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

            - name: Load the Cloudreve image
              run: kind load docker-image local/cloudreve:e2e --name chart-testing

            - name: Install Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
              with:
                  version: ${{ env.HELM_VERSION }}

            - name: Install the chart
              run: |
                  helm install "$RELEASE" "$CHART" --namespace "$RELEASE" --create-namespace \
                      --values "$CHART/ci/default-values.yaml" \
                      --set image.repository=local/cloudreve --set image.tag=e2e \
                      --wait --timeout 10m

            - name: helm test
              run: helm test "$RELEASE" --namespace "$RELEASE"

            - name: Sign up, log in, upload, download and thumbnail
              run: .github/scripts/cloudreve-e2e.sh "$RELEASE" "$RELEASE"

            - name: Diagnostics
              if: failure()
              run: |
                  kubectl get pods --all-namespaces -o wide
                  kubectl --namespace "$RELEASE" describe pods
                  kubectl --namespace "$RELEASE" logs deploy/"$RELEASE" --all-containers --prefix || true

    taiga:
        name: taiga
        needs: changes
        if: needs.changes.outputs.taiga == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            CHART: charts/taiga
            RELEASE: taiga
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The images of this commit, so that a change to one of them is tested before it is published.
            - name: Build the Taiga and PostgreSQL images
              run: |
                  for image in taiga-back taiga-front taiga-events taiga-protected; do
                      docker build --tag "local/$image:e2e" "images/$image"
                  done
                  docker build --tag local/postgres:e2e images/postgres/17

            - name: Create kind cluster
              uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

            - name: Load the images
              run: |
                  for image in taiga-back taiga-front taiga-events taiga-protected postgres; do
                      kind load docker-image "local/$image:e2e" --name chart-testing
                  done

            - name: Install Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
              with:
                  version: ${{ env.HELM_VERSION }}

            # ci/default-values.yaml (bundled PostgreSQL, NetworkPolicies, enforced by kind), with two async workers,
            # to check that the periodic tasks are sent once, and the events broker on another port and vhost than
            # the defaults.
            - name: Install the chart
              run: &taiga-install |
                  helm install "$RELEASE" "$CHART" --namespace "$RELEASE" --create-namespace \
                      --values "$CHART/ci/default-values.yaml" \
                      --set backend.image.repository=local/taiga-back --set backend.image.tag=e2e \
                      --set async.image.repository=local/taiga-back --set async.image.tag=e2e \
                      --set frontend.image.repository=local/taiga-front --set frontend.image.tag=e2e \
                      --set events.image.repository=local/taiga-events --set events.image.tag=e2e \
                      --set protected.image.repository=local/taiga-protected --set protected.image.tag=e2e \
                      --set db.image.repository=local/postgres --set db.image.tag=e2e \
                      --set async.replicaCount=2 --set-json 'async.extraArgs=["--concurrency", "1"]' \
                      --set eventsRabbitmq.service.port=5673 --set eventsRabbitmq.auth.vhost=taiga-events \
                      --wait --timeout 15m

            - name: helm test
              run: helm test "$RELEASE" --namespace "$RELEASE"

            - name: Log in, create, read back, websocket, attachment, beat and NetworkPolicies
              run: .github/scripts/taiga-e2e.sh "$RELEASE" "$RELEASE"

            # The chart Secret is kept with the database, media and broker volumes: a new install must start on them
            # with the same generated passwords.
            - name: Uninstall, keeping the Secret and the volumes
              run: |
                  helm uninstall "$RELEASE" --namespace "$RELEASE" --wait
                  kubectl --namespace "$RELEASE" get secret "$RELEASE"
                  kubectl --namespace "$RELEASE" get pvc "$RELEASE-db" "$RELEASE-media"
                  kubectl --namespace "$RELEASE" wait --for=delete pod -l "app.kubernetes.io/instance=$RELEASE" --timeout=300s

            - name: Install the chart again
              run: *taiga-install

            - name: Check the data of the first install
              run: |
                  projects=$(kubectl --namespace "$RELEASE" exec deploy/"$RELEASE-backend" -c backend -- \
                      python manage.py shell -c 'from taiga.projects.models import Project; print(Project.objects.count())' | tail -n 1)
                  [ "$projects" -ge 1 ] || { echo "FAIL: the projects of the first install are gone ($projects)"; exit 1; }
                  echo "ok: $projects project(s) of the first install are still there"

            - name: helm test after the reinstall
              run: helm test "$RELEASE" --namespace "$RELEASE"

            - name: Check again after the reinstall
              run: .github/scripts/taiga-e2e.sh "$RELEASE" "$RELEASE"

            - name: Diagnostics
              if: failure()
              run: |
                  kubectl get pods --all-namespaces -o wide
                  kubectl --namespace "$RELEASE" describe pods
                  for component in backend async async-beat events protected frontend gateway db; do
                      echo "::group::$component"
                      kubectl --namespace "$RELEASE" logs deploy/"$RELEASE-$component" --all-containers --prefix || true
                      echo "::endgroup::"
                  done
                  for broker in async-rabbitmq events-rabbitmq; do
                      echo "::group::$broker"
                      kubectl --namespace "$RELEASE" logs "$RELEASE-$broker-0" --prefix || true
                      echo "::endgroup::"
                  done

    # The upstream Kener and Valkey images (the chart has no UnxWares image), pulled by kind.
    kener:
        name: kener
        needs: changes
        if: needs.changes.outputs.kener == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            CHART: charts/kener
            RELEASE: kener
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Create kind cluster
              uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

            - name: Install Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
              with:
                  version: ${{ env.HELM_VERSION }}

            - name: Install the chart
              run: &kener-install |
                  helm install "$RELEASE" "$CHART" --namespace "$RELEASE" --create-namespace \
                      --values "$CHART/ci/default-values.yaml" --wait --timeout 10m

            - name: helm test
              run: helm test "$RELEASE" --namespace "$RELEASE"

            - name: Sign up, log in, API key, monitor, status page, NetworkPolicies
              run: .github/scripts/kener-e2e.sh "$RELEASE" "$RELEASE"

            # The Secret and the SQLite PVC are kept on uninstall: a new install must find the same account,
            # API key (hashed with KENER_SECRET_KEY) and monitor.
            - name: Uninstall
              run: helm uninstall "$RELEASE" --namespace "$RELEASE" --wait

            - name: Install the chart again
              run: *kener-install

            - name: Check what the reinstall kept
              run: .github/scripts/kener-e2e.sh "$RELEASE" "$RELEASE" after-reinstall

            - name: Diagnostics
              if: failure()
              run: |
                  kubectl get pods --all-namespaces -o wide
                  kubectl --namespace "$RELEASE" describe pods
                  kubectl --namespace "$RELEASE" logs deploy/"$RELEASE" --all-containers --prefix || true
                  kubectl --namespace "$RELEASE" logs deploy/"$RELEASE"-valkey --all-containers --prefix || true

    # The upstream ExcaliDash images (the chart has no UnxWares image), pulled by kind.
    excalidash:
        name: excalidash
        needs: changes
        if: needs.changes.outputs.excalidash == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            CHART: charts/excalidash
            RELEASE: excalidash
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Create kind cluster
              uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

            - name: Install Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
              with:
                  version: ${{ env.HELM_VERSION }}

            - name: Install the chart
              run: &excalidash-install |
                  helm install "$RELEASE" "$CHART" --namespace "$RELEASE" --create-namespace \
                      --values "$CHART/ci/default-values.yaml" --wait --timeout 10m

            - name: helm test
              run: helm test "$RELEASE" --namespace "$RELEASE"

            - name: Onboarding, log in, drawing, export, import check, cookies, NetworkPolicy
              run: .github/scripts/excalidash-e2e.sh "$RELEASE" "$RELEASE"

            # The Secret and the PVC are kept on uninstall: a new install must find the same account, drawing and
            # session (signed with the kept JWT secret).
            - name: Uninstall
              run: helm uninstall "$RELEASE" --namespace "$RELEASE" --wait

            - name: Install the chart again
              run: *excalidash-install

            - name: Check what the reinstall kept
              run: .github/scripts/excalidash-e2e.sh "$RELEASE" "$RELEASE" after-reinstall

            - name: Diagnostics
              if: failure()
              run: |
                  kubectl get pods --all-namespaces -o wide
                  kubectl --namespace "$RELEASE" describe pods
                  kubectl --namespace "$RELEASE" logs deploy/"$RELEASE"-backend --all-containers --prefix || true
                  kubectl --namespace "$RELEASE" logs deploy/"$RELEASE"-frontend --all-containers --prefix || true

    fossflow:
        name: fossflow
        needs: changes
        if: needs.changes.outputs.fossflow == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            CHART: charts/fossflow
            RELEASE: fossflow
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The image of this commit, so that a change to it is tested before it is published.
            - name: Build the FossFLOW image
              run: docker build --tag local/fossflow:e2e images/fossflow

            - name: Create kind cluster
              uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

            - name: Load the FossFLOW image
              run: kind load docker-image local/fossflow:e2e --name chart-testing

            - name: Install Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
              with:
                  version: ${{ env.HELM_VERSION }}

            # Server storage (ci/default-values.yaml), and browser-only with the NetworkPolicy (2 replicas), in a
            # namespace that enforces the restricted Pod Security Standard.
            - name: Install the chart in both modes
              run: |
                  kubectl create namespace "$RELEASE"
                  kubectl label namespace "$RELEASE" pod-security.kubernetes.io/enforce=restricted
                  helm install "$RELEASE" "$CHART" --namespace "$RELEASE" \
                      --values "$CHART/ci/default-values.yaml" \
                      --set image.repository=local/fossflow --set image.tag=e2e \
                      --wait --timeout 5m
                  helm install "$RELEASE-browser" "$CHART" --namespace "$RELEASE" \
                      --values "$CHART/ci/browser-only-values.yaml" \
                      --set image.repository=local/fossflow --set image.tag=e2e \
                      --wait --timeout 5m

            - name: helm test
              run: |
                  helm test "$RELEASE" --namespace "$RELEASE"
                  helm test "$RELEASE-browser" --namespace "$RELEASE"

            - name: Diagrams through the Service, browser-only mode, backend and NetworkPolicy isolation
              run: |
                  .github/scripts/fossflow-e2e.sh "$RELEASE" "$RELEASE"
                  .github/scripts/fossflow-e2e.sh "$RELEASE" "$RELEASE-browser"

            - name: Diagnostics
              if: failure()
              run: |
                  kubectl get pods --all-namespaces -o wide
                  kubectl --namespace "$RELEASE" describe pods
                  kubectl --namespace "$RELEASE" get events --sort-by=.lastTimestamp
                  for deployment in "$RELEASE" "$RELEASE-browser"; do
                      kubectl --namespace "$RELEASE" logs deploy/"$deployment" --all-containers --prefix || true
                  done

    bind9:
        name: bind9
        needs: changes
        if: needs.changes.outputs.bind9 == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            CHART: charts/bind9
            RELEASE: bind9
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The images of this commit, so that a change to them is tested before they are published.
            - name: Build the BIND and exporter images
              run: |
                  for image in bind9 bind-exporter; do
                      docker build --tag "local/$image:e2e" "images/$image"
                  done

            - name: Create kind cluster
              uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

            - name: Load the images
              run: |
                  for image in bind9 bind-exporter; do
                      kind load docker-image "local/$image:e2e" --name chart-testing
                  done

            - name: Install Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
              with:
                  version: ${{ env.HELM_VERSION }}

            # The namespace enforces the restricted Pod Security Standard: named must run as non-root, without any
            # capability.
            - name: Install the chart
              run: |
                  kubectl create namespace "$RELEASE"
                  kubectl label namespace "$RELEASE" pod-security.kubernetes.io/enforce=restricted
                  helm install "$RELEASE" "$CHART" --namespace "$RELEASE" \
                      --values "$CHART/ci/default-values.yaml" \
                      --set image.repository=local/bind9 --set image.tag=e2e \
                      --set metrics.image.repository=local/bind-exporter --set metrics.image.tag=e2e \
                      --wait --timeout 5m

            - name: helm test
              run: helm test "$RELEASE" --namespace "$RELEASE"

            # The client pods run the BIND image of this commit too (dig, wget).
            - name: Query the zones, read the metrics, check the NetworkPolicy
              env:
                  CLIENT_IMAGE: local/bind9:e2e
              run: .github/scripts/bind9-e2e.sh "$RELEASE" "$RELEASE"

            - name: Diagnostics
              if: failure()
              run: |
                  kubectl get pods --all-namespaces -o wide
                  kubectl --namespace "$RELEASE" describe pods
                  kubectl --namespace "$RELEASE" logs deploy/"$RELEASE" --all-containers --prefix || true

    powerdns:
        name: powerdns
        needs: changes
        if: needs.changes.outputs.powerdns == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            CHART: charts/powerdns
            NAMESPACE: powerdns
            RELEASES: powerdns powerdns-pgsql powerdns-mysql
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The images of this commit, so that a change to one of them is tested before it is published.
            - name: Build the PowerDNS and database client images
              run: |
                  for image in pdns-auth pdns-recursor postgresql-client mysql-client; do
                      docker build --tag "local/$image:e2e" "images/$image"
                  done

            - name: Create kind cluster
              uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

            - name: Load the images
              run: |
                  for image in pdns-auth pdns-recursor postgresql-client mysql-client; do
                      kind load docker-image "local/$image:e2e" --name chart-testing
                  done

            - name: Install Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
              with:
                  version: ${{ env.HELM_VERSION }}

            - name: Start PostgreSQL (TLS) and MySQL
              run: .github/scripts/powerdns-e2e-env.sh "$NAMESPACE" powerdns-db

            # Three releases in a namespace that enforces the restricted Pod Security Standard: SQLite with the
            # recursor and the NetworkPolicy (ci/default-values.yaml), PostgreSQL with the server certificate checked
            # against a CA mounted with extraVolumes (schema init included), and MySQL. The database password holds
            # quotes, a backslash and a #, which the MySQL options file must escape.
            - name: Install the chart
              run: |
                  kubectl label namespace "$NAMESPACE" pod-security.kubernetes.io/enforce=restricted
                  images=(--set image.repository=local/pdns-auth --set image.tag=e2e
                      --set recursor.image.repository=local/pdns-recursor --set recursor.image.tag=e2e
                      --set backend.schemaInit.postgresImage=local/postgresql-client:e2e
                      --set backend.schemaInit.mysqlImage=local/mysql-client:e2e)
                  helm install powerdns "$CHART" --namespace "$NAMESPACE" "${images[@]}" \
                      --values "$CHART/ci/default-values.yaml" --wait --timeout 5m
                  helm install powerdns-pgsql "$CHART" --namespace "$NAMESPACE" "${images[@]}" \
                      --wait --timeout 5m --values - <<'EOF'
                  backend:
                    type: gpgsql
                    gpgsql:
                      host: powerdns-pg.powerdns-db.svc
                      existingSecret: powerdns-db
                      extraConnectionParameters: sslmode=verify-full sslrootcert=/etc/ssl/db/ca.crt
                  extraVolumes:
                    - name: db-ca
                      secret:
                        secretName: powerdns-pg-ca
                  extraVolumeMounts:
                    - name: db-ca
                      mountPath: /etc/ssl/db
                      readOnly: true
                  EOF
                  helm install powerdns-mysql "$CHART" --namespace "$NAMESPACE" "${images[@]}" \
                      --set backend.type=gmysql --set backend.gmysql.host=powerdns-mysql.powerdns-db.svc \
                      --set backend.gmysql.existingSecret=powerdns-db --wait --timeout 5m

            - name: helm test
              run: |
                  for release in $RELEASES; do
                      helm test "$release" --namespace "$NAMESPACE"
                  done

            - name: API, zones, DNS answers, recursor and NetworkPolicy
              run: |
                  for release in $RELEASES; do
                      echo "::group::$release"
                      .github/scripts/powerdns-e2e.sh "$NAMESPACE" "$release"
                      echo "::endgroup::"
                  done

            - name: Diagnostics
              if: failure()
              run: |
                  kubectl get pods --all-namespaces -o wide
                  kubectl --namespace "$NAMESPACE" describe pods
                  for release in $RELEASES; do
                      kubectl --namespace "$NAMESPACE" logs deploy/"$release" --all-containers --prefix || true
                  done
                  kubectl --namespace "$NAMESPACE" logs deploy/powerdns-recursor --prefix || true

    # The chart runs the user's own image: a Laravel test application (.github/e2e/laravel-app), built here for both
    # runtimes and never published.
    laravel-generic:
        name: laravel-generic
        needs: changes
        if: needs.changes.outputs.laravel == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            CHART: charts/laravel-generic
            RELEASE: laravel-generic
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Composer downloads the packages through the GitHub API: the token (a BuildKit secret, kept out of the
            # image) raises its rate limit.
            - name: Build the test application images
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  for target in frankenphp fpm; do
                      docker build --target "$target" --tag "local/laravel-generic-e2e:$target" \
                          --secret id=github_token,env=GITHUB_TOKEN .github/e2e/laravel-app
                  done

            - name: Create kind cluster
              uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

            - name: Load the test application images
              run: |
                  for target in frankenphp fpm; do
                      kind load docker-image "local/laravel-generic-e2e:$target" --name chart-testing
                  done

            - name: Install Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
              with:
                  version: ${{ env.HELM_VERSION }}

            - name: Restricted namespace and PostgreSQL
              run: .github/scripts/laravel-generic-e2e-env.sh "$RELEASE" "$RELEASE-db"

            # Two releases in a namespace that enforces the restricted Pod Security Standard: FrankenPHP with SQLite
            # on the persistent volume (migrated by an init container of the web pod), the scheduler CronJob and the
            # NetworkPolicy (ci/default-values.yaml); PHP-FPM behind the nginx sidecar with the application in
            # /var/www/html, PostgreSQL with the password in an existing Secret (migrated by the hook Job), the
            # schedule:work Deployment and the NetworkPolicy.
            - name: Install the chart
              run: &laravel-install |
                  helm install "$RELEASE" "$CHART" --namespace "$RELEASE" \
                      --values "$CHART/ci/default-values.yaml" \
                      --set image.repository=local/laravel-generic-e2e --set image.tag=frankenphp \
                      --wait --timeout 10m
                  helm install "$RELEASE-fpm" "$CHART" --namespace "$RELEASE" \
                      --set image.repository=local/laravel-generic-e2e --set image.tag=fpm \
                      --wait --timeout 10m --values - <<'EOF'
                  appPath: /var/www/html
                  workload:
                    runtime:
                      type: fpm
                    scheduler:
                      mode: deployment
                  laravel:
                    database:
                      connection: pgsql
                      host: laravel-generic-pg.laravel-generic-db.svc
                      database: laravel
                      username: laravel
                      existingSecret: laravel-generic-db
                      secretKeys:
                        host: ""
                        port: ""
                        database: ""
                        username: ""
                        password: password
                  networkPolicy:
                    enabled: true
                  EOF

            - name: helm test
              run: |
                  helm test "$RELEASE" --namespace "$RELEASE"
                  helm test "$RELEASE-fpm" --namespace "$RELEASE"

            - name: Runtime, APP_KEY, migrations, database, session, cache, queue, files, scheduler, NetworkPolicy
              run: |
                  for release in "$RELEASE" "$RELEASE-fpm"; do
                      echo "::group::$release"
                      .github/scripts/laravel-generic-e2e.sh "$RELEASE" "$release"
                      echo "::endgroup::"
                  done

            # The Secret holding the generated APP_KEY and the PVC are kept on uninstall (helm.sh/resource-policy:
            # keep): a new install must start on them, with the same key, session, files and SQLite database.
            - name: Uninstall, keeping the Secrets and the volumes
              run: |
                  for release in "$RELEASE" "$RELEASE-fpm"; do
                      helm uninstall "$release" --namespace "$RELEASE" --wait
                      kubectl --namespace "$RELEASE" get "secret/$release" "pvc/$release"
                      kubectl --namespace "$RELEASE" wait --for=delete pod -l "app.kubernetes.io/instance=$release" --timeout=300s
                  done

            - name: Install the chart again
              run: *laravel-install

            - name: helm test after the reinstall
              run: |
                  helm test "$RELEASE" --namespace "$RELEASE"
                  helm test "$RELEASE-fpm" --namespace "$RELEASE"

            - name: Check what the reinstall kept
              run: |
                  for release in "$RELEASE" "$RELEASE-fpm"; do
                      echo "::group::$release"
                      .github/scripts/laravel-generic-e2e.sh "$RELEASE" "$release" after-reinstall
                      echo "::endgroup::"
                  done

            - name: Diagnostics
              if: failure()
              run: |
                  kubectl get pods --all-namespaces -o wide
                  kubectl --namespace "$RELEASE" describe pods
                  kubectl --namespace "$RELEASE" get events --sort-by=.lastTimestamp
                  for release in "$RELEASE" "$RELEASE-fpm"; do
                      for deployment in "$release" "$release-queue"; do
                          echo "::group::$deployment"
                          kubectl --namespace "$RELEASE" logs deploy/"$deployment" --all-containers --prefix || true
                          echo "::endgroup::"
                      done
                  done
                  for component in scheduler migrations; do
                      echo "::group::$component"
                      kubectl --namespace "$RELEASE" logs -l "app.kubernetes.io/component=$component" --all-containers --prefix --tail=100 || true
                      echo "::endgroup::"
                  done
                  kubectl --namespace "$RELEASE-db" logs deploy/laravel-generic-pg || true
