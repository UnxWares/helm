name: Site

# Builds the page of the Helm repository (https://helm.unxwares.studio, GitHub Pages from the gh-pages branch) from the
# charts, the images and the latest results of the test, image and CVE workflows, then commits it to gh-pages when
# it changed. Only the generated files are written: index.html, charts/, images/, assets/ and status.json.
# index.yaml, the packages, CNAME, artifacthub-repo.yml and pgp-public-key.asc belong to the release workflow and are
# never touched.
on:
    workflow_run:
        workflows:
            - Lint and Test Charts
            - Unit tests
            - End-to-end tests
            - Container Images
            - CVE Watch
            - Release Charts
        types:
            - completed
        branches:
            - main
    # Half an hour after each scheduled CVE watch (every 6 hours, at :17), in case a workflow_run event was missed.
    schedule:
        - cron: "47 */6 * * *"
    workflow_dispatch:

# One build at a time; a newer pending run replaces an older pending one (it would publish newer results).
concurrency:
    group: site
    cancel-in-progress: false

permissions: {}

jobs:
    build:
        name: Collect and build
        # Pull request runs (even from a fork branch named main) bring nothing to publish.
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            actions: read # runs, job logs and artifacts of the other workflows
            issues: read # the CVE watch issue, until the CVE watch has published its report artifact
            pull-requests: read # merged pull requests, whose runs give the lint and install results
        outputs:
            release-running: ${{ steps.release.outputs.running }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false

            - name: Collect the results
              env:
                  GH_TOKEN: ${{ github.token }}
              run: .github/scripts/site-collect.py "$RUNNER_TEMP/results.json"

            - name: Build the site
              run: .github/scripts/site.py "$RUNNER_TEMP/results.json" "$RUNNER_TEMP/site"

            - name: Keep the site
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: site
                  path: ${{ runner.temp }}/site
                  retention-days: 7

            # The publish job shares the concurrency group of the release workflow, and a newly queued member of a
            # group cancels the one already pending: publishing while a release waits could cancel that release.
            # The release completing triggers this workflow again, so nothing is lost by skipping.
            - name: Release in progress?
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  count=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yaml --limit 20 \
                      --json status --jq '[.[] | select(.status != "completed")] | length')
                  if [ "$count" -gt 0 ]; then
                      echo "::notice::a release is queued or running: the site is published after it"
                      echo "running=true" >> "$GITHUB_OUTPUT"
                  fi

    publish:
        name: Publish to gh-pages
        needs: build
        if: needs.build.outputs.release-running != 'true'
        runs-on: ubuntu-24.04
        permissions:
            contents: write # push to gh-pages
        # Same group as release.yaml: the two never push to gh-pages at the same time.
        concurrency:
            group: gh-pages
            cancel-in-progress: false
        steps:
            - name: Download the site
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: site
                  path: ${{ runner.temp }}/site

            - name: Checkout gh-pages
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: gh-pages
                  path: gh-pages
                  persist-credentials: true

            # The files to write are the ones status.json lists, and only those. A page the previous build listed and
            # this one does not (a chart or an image that is gone) is removed by name; nothing else is ever removed.
            - name: Commit the generated files if they changed
              env:
                  SITE: ${{ runner.temp }}/site
              run: |
                  set -euo pipefail
                  jq -r '.files[]' "$SITE/status.json" | sort > "$RUNNER_TEMP/new-files"
                  if grep -Ev '^(index\.html|status\.json|(assets|charts|images)/[A-Za-z0-9._/-]+)$' "$RUNNER_TEMP/new-files" ||
                      grep -E '(^|/)\.\.(/|$)|\.tgz$|^(index\.yaml|CNAME|artifacthub-repo\.yml|pgp-public-key\.asc)$' "$RUNNER_TEMP/new-files"; then
                      echo "::error::unexpected file in the generated site (listed above)"
                      exit 1
                  fi
                  cd gh-pages
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  stale=()
                  if [ -f status.json ]; then
                      while IFS= read -r file; do
                          stale+=("$file")
                      done < <(jq -r '.files[]?' status.json | sort | comm -23 - "$RUNNER_TEMP/new-files" |
                          grep -E '^(charts|images)/[a-z0-9][a-z0-9.-]*\.html$' || true)
                  fi
                  while IFS= read -r file; do
                      mkdir -p "$(dirname "$file")"
                      cp "$SITE/$file" "$file"
                  done < "$RUNNER_TEMP/new-files"
                  git add --pathspec-from-file="$RUNNER_TEMP/new-files"
                  if [ ${#stale[@]} -gt 0 ]; then
                      git rm --quiet --ignore-unmatch -- "${stale[@]}"
                  fi
                  if git diff --cached --quiet; then
                      echo "The site has not changed"
                      exit 0
                  fi
                  git diff --cached --stat
                  git commit --quiet -m "Update the site from main (${GITHUB_SHA::7})"
                  for attempt in 1 2 3; do
                      git pull --rebase --quiet origin gh-pages && git push --quiet origin HEAD:gh-pages && exit 0
                      echo "::warning::push attempt $attempt failed, retrying"
                      sleep $((attempt * 10))
                  done
                  exit 1
