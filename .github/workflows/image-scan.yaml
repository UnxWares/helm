name: Image Security Scan

# Weekly Trivy scan of every image referenced by the charts (artifacthub.io/images
# annotation). The report lands in the run summary: when an upstream image ships
# a fix, bump the tag in values.yaml + Chart.yaml and release.
on:
    schedule:
        - cron: "17 5 * * 1"
    workflow_dispatch:

permissions:
    contents: read

env:
    TRIVY_VERSION: 0.76.0

jobs:
    scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Installed from the release tarball with checksum verification rather than
            # through a third-party action (smaller supply-chain surface).
            - name: Install Trivy
              run: |
                  cd "$RUNNER_TEMP"
                  curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
                  curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
                  grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
                  tar xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
                  echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

            - name: Scan chart images
              run: .github/scripts/image-scan.sh | tee -a "$GITHUB_STEP_SUMMARY"
