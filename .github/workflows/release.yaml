name: Release Charts

on:
    push:
        branches:
            - main
        paths:
            - charts/**
            - artifacthub-repo.yml
            - pgp-public-key.asc
    workflow_dispatch:

# Never run two releases at the same time: both would push to gh-pages.
concurrency:
    group: release
    cancel-in-progress: false

permissions: {}

jobs:
    release:
        permissions:
            contents: write # create GitHub releases and push index.yaml to gh-pages
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: true

            - name: Configure Git
              run: |
                  git config user.name "$GITHUB_ACTOR"
                  git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

            - name: Install Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
              with:
                  version: v3.22.1

            # Charts are signed with the UnxWares Helm Charts key
            # (fingerprint 7902E52EA435EF27C6432E5378D6B532C599DA9B, public key in pgp-public-key.asc).
            # chart-releaser writes a .prov file next to each .tgz; Artifact Hub then shows the package as signed.
            - name: Prepare signing key
              env:
                  HELM_SIGNING_KEY: ${{ secrets.HELM_SIGNING_KEY }}
                  HELM_SIGNING_PASSPHRASE: ${{ secrets.HELM_SIGNING_PASSPHRASE }}
              run: |
                  if [ -z "$HELM_SIGNING_KEY" ] || [ -z "$HELM_SIGNING_PASSPHRASE" ]; then
                      echo "::error::HELM_SIGNING_KEY / HELM_SIGNING_PASSPHRASE secrets are missing, refusing to publish unsigned charts"
                      exit 1
                  fi
                  gpg_dir="$RUNNER_TEMP/.cr-gpg"
                  install -d -m 700 "$gpg_dir"
                  base64 -d <<< "$HELM_SIGNING_KEY" > "$gpg_dir/secring.gpg"
                  printf '%s' "$HELM_SIGNING_PASSPHRASE" > "$gpg_dir/passphrase"
                  chmod 600 "$gpg_dir/secring.gpg" "$gpg_dir/passphrase"
                  {
                      echo "CR_KEYRING=$gpg_dir/secring.gpg"
                      echo "CR_PASSPHRASE_FILE=$gpg_dir/passphrase"
                  } >> "$GITHUB_ENV"

            - name: Run Chart Releaser
              uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
              with:
                  version: v1.8.1
                  charts_dir: charts
                  skip_existing: true
              env:
                  CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  CR_SIGN: "true"
                  CR_KEY: "UnxWares Helm Charts"
                  CR_GENERATE_RELEASE_NOTES: "true"

            - name: Remove signing key
              if: always()
              run: rm -rf "$RUNNER_TEMP/.cr-gpg"

            - name: Deploy Artifact Hub metadata and public key to GitHub Pages
              run: |
                  git checkout gh-pages
                  git pull origin gh-pages
                  git checkout "$GITHUB_SHA" -- artifacthub-repo.yml pgp-public-key.asc
                  git add artifacthub-repo.yml pgp-public-key.asc
                  git commit -m "Update Artifact Hub repository metadata and signing key" || echo "No changes to commit"
                  git push origin gh-pages
