name: Bug report
description: A chart does not render, install or behave as documented.
labels: [bug]
body:
  - type: dropdown
    id: chart
    attributes:
      label: Chart
      options:
        - bind9
        - cloudreve
        - excalidash
        - fossflow
        - kener
        - laravel-generic
        - openeverest-database-tools
        - powerdns
        - taiga
    validations:
      required: true
  - type: input
    id: chart-version
    attributes:
      label: Chart version
      placeholder: "2026.10.1"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Kubernetes and Helm versions
      placeholder: "Kubernetes 1.34.1, Helm 4.3.1"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Minimal values.yaml (remove secrets) and the commands you ran.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: helm / kubectl output, pod logs.
      render: shell
