name: Feature request
description: Suggest an improvement or a new chart.
labels: [enhancement]
body:
  - type: input
    id: chart
    attributes:
      label: Chart (or "new chart")
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
