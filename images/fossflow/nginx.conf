# FossFLOW: nginx as the image user on port 8080, with a read-only root filesystem (pid and temporary files in
# /tmp/nginx, logs on the container output). Same site as the upstream image, without its basic auth.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # Kubernetes probes are not logged.
    map $http_user_agent $loggable {
        ~^kube-probe/ 0;
        default 1;
    }
    access_log /dev/stdout combined if=$loggable;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        # Diagrams up to 10 MB, as the backend accepts.
        client_max_body_size 10M;

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # The backend does not trust proxy headers (its rate limit counts every request as coming from nginx)
            # and logs an error when it receives X-Forwarded-For: do not pass it on.
            proxy_set_header X-Forwarded-For "";
            proxy_read_timeout 300s;
            # The web app calls the API on its own origin. The backend allows any origin (CORS *): drop these
            # headers so that another site cannot read or change the diagrams through a visitor's browser.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header Access-Control-Max-Age;
        }
    }
}
