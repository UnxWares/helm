// Default configuration of the image, the same as the official image
// (named.conf of https://github.com/isc-projects/bind9-docker, branch v9.20): a resolver for the local networks
// (recursion is allowed from localhost and localnets by default), over DNS, DNS over TLS and DNS over HTTPS with an
// ephemeral certificate. The bind9 chart replaces this file with its own named.conf.

http local {
        endpoints { "/dns-query"; };
};

options {
        directory "/var/cache/bind";

        listen-on { any; };
        listen-on-v6 { any; };
        listen-on tls ephemeral { any; };
        listen-on-v6 tls ephemeral { any; };
        listen-on tls ephemeral http local { any; };
        listen-on-v6 tls ephemeral http local { any; };
};
