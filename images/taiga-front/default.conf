# Taiga front: static files from the image, conf.json and index.html generated at start in /tmp/taiga-front
# (see 40-taiga-config.sh), so that the root filesystem can stay read-only.
server {
    listen 8080 default_server;

    client_max_body_size 100M;
    charset utf-8;
    root /usr/share/nginx/html;

    location = /conf.json {
        root /tmp/taiga-front;
        expires -1;
    }

    location = /index.html {
        root /tmp/taiga-front;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
