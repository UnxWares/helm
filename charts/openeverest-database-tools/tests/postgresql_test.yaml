suite: PostgreSQL Jobs
templates:
  - templates/postgresql-jobs.yaml
release:
  name: oedt
  namespace: apps
values:
  - values/readme-postgresql.yaml
tests:
  - it: renders nothing without entries
    set:
      databases.postgresql: []
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one immutable ConfigMap and one Job per entry, sharing a hashed name
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
        documentIndex: 0
      - equal:
          path: immutable
          value: true
        documentIndex: 0
      - matchRegex:
          path: metadata.name
          pattern: ^laravel-db-init-[0-9a-f]{8}$
      - isKind:
          of: Job
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: everest-databases

  - it: mounts the ConfigMap of its own entry
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.volumes[?(@.name == "scripts")].configMap.name
          pattern: ^laravel-db-init-[0-9a-f]{8}$

  - it: labels the Job and its pod with the postgresql-init component
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: postgresql-init
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: postgresql-init
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: oedt
      - equal:
          path: spec.template.metadata.annotations["kubectl.kubernetes.io/default-container"]
          value: init-postgresql
      - equal:
          path: spec.template.spec.containers[0].name
          value: init-postgresql

  - it: connects through the PgBouncer host and the superuser of the OpenEverest Secret, over TLS
    documentSelector:
      path: kind
      value: Job
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGHOST
            valueFrom:
              secretKeyRef:
                name: everest-secrets-my-pg
                key: pgbouncer-host
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGPORT
            value: "5432"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGUSER
            valueFrom:
              secretKeyRef:
                name: everest-secrets-my-pg
                key: user
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: everest-secrets-my-pg
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGSSLMODE
            value: require
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGDATABASE
            value: postgres
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INIT_SCRIPTS_DATABASE
            value: laravel-app
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLUSTER_NAME
            value: my-pg
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONNECT_TIMEOUT
            value: "120"

  - it: takes a literal host, port, admin user, keys, TLS mode and admin database from the entry
    documentSelector:
      path: kind
      value: Job
    set:
      databases.postgresql:
        - name: pg-init
          clusterName: pg
          credentialsSecret: legacy-admin
          host: pg-primary
          port: 6432
          adminUser: admin
          passwordKey: admin-password
          sslMode: verify-full
          adminDatabase: maintenance
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGHOST
            value: pg-primary
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGPORT
            value: "6432"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGUSER
            value: admin
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: legacy-admin
                key: admin-password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGSSLMODE
            value: verify-full
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGDATABASE
            value: maintenance
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name == "INIT_SCRIPTS_DATABASE")]

  - it: creates the databases, the role, its ownership and closes the public schema (README example)
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["init.sql"]
          pattern: "SELECT format\\('CREATE DATABASE %I', 'laravel-app'\\) WHERE NOT EXISTS \\(SELECT FROM pg_database WHERE datname = 'laravel-app'\\)\\\\gexec"
      - matchRegex:
          path: data["init.sql"]
          pattern: "format\\('ALTER DATABASE %I OWNER TO %I', 'laravel-app', :'username'\\)"
      - matchRegex:
          path: data["init.sql"]
          pattern: '\\connect "laravel-app"\nSELECT format\(''ALTER SCHEMA public OWNER TO %I'', :''username''\)\\gexec\nREVOKE ALL ON SCHEMA public FROM PUBLIC;'
      - matchRegex:
          path: data["init.sql"]
          pattern: "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO %I"
      - matchRegex:
          path: data["init.sql"]
          pattern: '\\connect "postgres"\n\\unset username\n$'

  - it: resets existing passwords by default, and only creates missing roles when updateUserPasswords is false
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      global.updateUserPasswords: false
    asserts:
      - notMatchRegex:
          path: data["init.sql"]
          pattern: ALTER ROLE
      - matchRegex:
          path: data["init.sql"]
          pattern: "SELECT format\\('CREATE ROLE %I LOGIN PASSWORD %L', :'username', :'password'\\) WHERE NOT EXISTS"

  - it: resets the password of an existing role with the default updateUserPasswords
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["init.sql"]
          pattern: "THEN format\\('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'username', :'password'\\) ELSE format\\('CREATE ROLE %I LOGIN PASSWORD %L'"

  - it: stores each init script in its own file and runs them in order in initScriptsDatabase
    asserts:
      - equal:
          path: data["script-0.sql"]
          value: |
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
        documentIndex: 0
      - equal:
          path: data["script-1.sql"]
          value: |
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
        documentIndex: 0
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'psql -X -v ON_ERROR_STOP=1 -f /scripts/init\.sql\necho "Running init script 1/2"\npsql -X -v ON_ERROR_STOP=1 \$\{INIT_SCRIPTS_DATABASE:\+-d "\$INIT_SCRIPTS_DATABASE"\} -f /scripts/script-0\.sql\necho "Running init script 2/2"\npsql -X -v ON_ERROR_STOP=1 \$\{INIT_SCRIPTS_DATABASE:\+-d "\$INIT_SCRIPTS_DATABASE"\} -f /scripts/script-1\.sql\n'
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: /bin/sh
        documentIndex: 1
      - equal:
          path: spec.template.spec.containers[0].command[1]
          value: -ec
        documentIndex: 1

  - it: retries the login until connectTimeoutSeconds, set per entry
    documentSelector:
      path: kind
      value: Job
    set:
      databases.postgresql:
        - name: pg-init
          clusterName: pg
          adminCredentialsSecret: s
          connectTimeoutSeconds: 30
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CONNECT_TIMEOUT
            value: "30"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'deadline=\$\(\( \$\(date \+%s\) \+ CONNECT_TIMEOUT \)\)'
