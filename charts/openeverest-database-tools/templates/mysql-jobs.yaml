{{- range $index, $db := .Values.databases.mysql }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $db.name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "openeverest-database-tools.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mariadb-init
spec:
  backoffLimit: {{ $db.backoffLimit | default $.Values.global.backoffLimit }}
  ttlSecondsAfterFinished: {{ $db.ttlSecondsAfterFinished | default $.Values.global.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mariadb-init
        job-name: {{ $db.name }}
    spec:
      restartPolicy: {{ $db.restartPolicy | default $.Values.global.restartPolicy }}
      containers:
        - name: init-mariadb
          image: {{ $db.image | default $.Values.image.mysql }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: CLUSTER_NAME
              value: {{ $db.clusterName | quote }}
            # Admin credentials
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $db.adminCredentialsSecret }}
                  key: {{ $db.hostKey | default "host" }}
            - name: MYSQL_PORT
              value: {{ $db.port | default "3306" | quote }}
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $db.adminCredentialsSecret }}
                  key: {{ $db.userKey | default "user" }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db.adminCredentialsSecret }}
                  key: {{ $db.passwordKey | default "password" }}

            # App user secrets
            {{- if $db.users }}
            {{- range $index, $user := $db.users }}
            - name: APP_USERNAME_{{ $index }}
              valueFrom:
                secretKeyRef:
                  name: {{ $user.credentialsSecret }}
                  key: username
            - name: APP_PASSWORD_{{ $index }}
              valueFrom:
                secretKeyRef:
                  name: {{ $user.credentialsSecret }}
                  key: password
            {{- end }}
            {{- end }}

          command:
            - sh
            - -ec
            - |
              set -e
              echo "=== MariaDB Initialization ==="
              apk add --no-cache mysql-client kubectl busybox-extras

              echo "Waiting for DatabaseCluster '$CLUSTER_NAME'..."
              TIMEOUT=300
              ELAPSED=0
              until [ "$(kubectl get databasecluster "$CLUSTER_NAME" -n {{ $.Values.global.namespace }} \
                -o jsonpath='{.status.status}' 2>/dev/null)" = "ready" ]; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "Timeout waiting for cluster"
                  exit 1
                fi
                sleep 5
                ELAPSED=$((ELAPSED + 5))
              done
              echo "Cluster ready."

              # Test connection
              mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" -e "SELECT 1;" >/dev/null

              # -----------------------------
              # Ensure Databases Exist
              # -----------------------------
              {{- range $db.databases }}
              echo "Ensuring database '{{ . }}' exists..."
              mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS \`{{ . }}\`;"
              {{- end }}

              # -----------------------------
              # Ensure Users + Grants
              # -----------------------------
              {{- if $db.users }}
              echo "Managing users..."
              {{- range $index, $user := $db.users }}
              USERNAME="$(printenv APP_USERNAME_{{ $index }})"
              PASSWORD="$(printenv APP_PASSWORD_{{ $index }})"

              echo "Ensuring user '$USERNAME' exists..."
              mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" <<EOSQL
              CREATE USER IF NOT EXISTS '$USERNAME'@'%' IDENTIFIED BY '$PASSWORD';
EOSQL

              {{- range $dbname := $user.databases }}
              echo "Granting privileges on '{{ $dbname }}' to $USERNAME"
              mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" <<EOSQL
              GRANT ALL PRIVILEGES ON \`{{ $dbname }}\`.* TO '$USERNAME'@'%';
EOSQL
              {{- end }}
              {{- end }}
              {{- end }}

              # -----------------------------
              # Custom Scripts
              # -----------------------------
              {{- if $db.initScripts }}
              echo "Running custom scripts..."
              {{- range $script := $db.initScripts }}
              mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" <<'EOSQL'
              {{ $script }}
EOSQL
              {{- end }}
              {{- end }}

              echo "=== MariaDB initialization complete ==="
{{- end }}
