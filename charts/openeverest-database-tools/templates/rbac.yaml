{{- include "openeverest-database-tools.validate" . }}
{{- if .Values.rbac.create }}
# Lets the Jobs wait for their DatabaseCluster (read only).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openeverest-database-tools.fullname" . }}-dbcluster-read
  namespace: {{ include "openeverest-database-tools.namespace" . }}
  labels:
    {{- include "openeverest-database-tools.labels" . | nindent 4 }}
rules:
  - apiGroups: ["everest.percona.com"]
    resources: ["databaseclusters"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openeverest-database-tools.fullname" . }}-dbcluster-read
  namespace: {{ include "openeverest-database-tools.namespace" . }}
  labels:
    {{- include "openeverest-database-tools.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openeverest-database-tools.serviceAccountName" . }}
    namespace: {{ include "openeverest-database-tools.namespace" . }}
roleRef:
  kind: Role
  name: {{ include "openeverest-database-tools.fullname" . }}-dbcluster-read
  apiGroup: rbac.authorization.k8s.io
{{- end }}
