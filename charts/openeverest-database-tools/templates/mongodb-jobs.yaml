{{- range $index, $db := .Values.databases.mongodb }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $db.name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "openeverest-database-tools.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mongodb-init
    {{- with $db.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $.Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "openeverest-database-tools.annotations" $ | nindent 4 }}
    {{- with $db.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ $db.backoffLimit | default $.Values.global.backoffLimit }}
  ttlSecondsAfterFinished: {{ $db.ttlSecondsAfterFinished | default $.Values.global.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mongodb-init
        job-name: {{ $db.name }}
    spec:
      restartPolicy: {{ $db.restartPolicy | default $.Values.global.restartPolicy }}
      containers:
        - name: init-mongodb
          image: {{ $db.image | default $.Values.image.mongodb }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: CLUSTER_NAME
              value: {{ $db.clusterName | quote }}
            - name: MONGO_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $db.adminCredentialsSecret }}
                  key: {{ $db.hostKey | default "host" }}
            - name: MONGO_PORT
              value: {{ $db.port | default "27017" | quote }}
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $db.adminCredentialsSecret }}
                  key: {{ $db.userKey | default "user" }}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db.adminCredentialsSecret }}
                  key: {{ $db.passwordKey | default "password" }}
            {{- if $db.authDatabase }}
            - name: MONGO_AUTH_DB
              value: {{ $db.authDatabase | quote }}
            {{- end }}
            {{- if $db.users }}
            {{- range $index, $user := $db.users }}
            - name: APP_USERNAME_{{ $index }}
              valueFrom:
                secretKeyRef:
                  name: {{ $user.credentialsSecret }}
                  key: username
            - name: APP_PASSWORD_{{ $index }}
              valueFrom:
                secretKeyRef:
                  name: {{ $user.credentialsSecret }}
                  key: password
            {{- end }}
            {{- end }}
          command:
            - sh
            - -ec
            - |
              set -e

              echo "=== MongoDB Initialization ==="
              apk add --no-cache mongodb-tools kubectl busybox-extras

              echo "Waiting for DatabaseCluster '$CLUSTER_NAME' to be ready..."
              TIMEOUT=300
              ELAPSED=0
              until [ "$(kubectl get databasecluster "$CLUSTER_NAME" -n {{ $.Values.global.namespace }} \
                -o jsonpath='{.status.status}' 2>/dev/null)" = "ready" ]; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "Timeout waiting for cluster"
                  exit 1
                fi
                sleep 5
                ELAPSED=$((ELAPSED + 5))
              done
              echo "Cluster ready."

              {{- if $db.authDatabase }}
              MONGO_URI="mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/admin?authSource={{ $db.authDatabase }}"
              {{- else }}
              MONGO_URI="mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/admin"
              {{- end }}

              echo "Connection test..."
              mongosh "$MONGO_URI" --quiet --eval "db.adminCommand('ping')" || exit 1

              # -----------------------------
              # Ensure Databases
              # -----------------------------
              {{- range $db.databases }}
              echo "Ensuring database '{{ . }}' exists..."
              mongosh "$MONGO_URI" --quiet --eval "
                use {{ . }};
                db.getCollectionNames();
              "
              {{- end }}

              # -----------------------------
              # Ensure Users and Permissions
              # -----------------------------
              {{- if $db.users }}
              echo "Creating users and granting access..."
              {{- range $index, $user := $db.users }}
              USERNAME="$(printenv APP_USERNAME_{{ $index }})"
              PASSWORD="$(printenv APP_PASSWORD_{{ $index }})"

              {{- range $dbname := $user.databases }}
              echo "Ensuring user '$USERNAME' has readWrite on '{{ $dbname }}'..."
              mongosh "$MONGO_URI" --quiet --eval "
                use {{ $dbname }};
                if (!db.getUser('$USERNAME')) {
                  db.createUser({
                    user: '$USERNAME',
                    pwd: '$PASSWORD',
                    roles: [{ role: 'readWrite', db: '{{ $dbname }}' }]
                  });
                }
              "
              {{- end }}
              {{- end }}
              {{- end }}

              # -----------------------------
              # Create collections
              # -----------------------------
              {{- if $db.collections }}
              echo "Creating collections..."
              {{- range $db.collections }}
              echo "Creating collection '{{ .name }}' in database '{{ .database }}'..."
              mongosh "$MONGO_URI" --quiet --eval "
                use {{ .database }};
                if (!db.getCollection('{{ .name }}')) { db.createCollection('{{ .name }}'); }
              "
              {{- end }}
              {{- end }}

              # -----------------------------
              # Custom Scripts
              # -----------------------------
              {{- if $db.initScripts }}
              echo "Running custom initialization scripts..."
              {{- range $scriptIndex, $script := $db.initScripts }}
              echo "Executing script {{ add1 $scriptIndex }}/{{ len $db.initScripts }}..."
              mongosh "$MONGO_URI" --quiet --eval "{{ $script }}"
              {{- end }}
              {{- end }}

              echo "=== MongoDB initialization complete ==="
{{- end }}
