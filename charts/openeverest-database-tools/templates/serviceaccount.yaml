{{- if include "openeverest-database-tools.createServiceAccount" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openeverest-database-tools.serviceAccountName" . }}
  namespace: {{ include "openeverest-database-tools.namespace" . }}
  labels:
    {{- include "openeverest-database-tools.labels" . | nindent 4 }}
# Only the kubectl wait init containers get a token, through a projected volume.
automountServiceAccountToken: false
{{- end }}
