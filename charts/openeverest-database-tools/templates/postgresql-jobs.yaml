{{- range $index, $db := .Values.databases.postgresql }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $db.name }}
  namespace: {{ $.Values.global.namespace }}
  annotations:
    {{- include "openeverest-database-tools.annotations" $ | nindent 4 }}
    {{- with $db.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "openeverest-database-tools.labels" $ | nindent 4 }}
    app.kubernetes.io/component: postgresql-init
spec:
  backoffLimit: {{ $db.backoffLimit | default $.Values.global.backoffLimit }}
  ttlSecondsAfterFinished: {{ $db.ttlSecondsAfterFinished | default $.Values.global.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgresql-init
        job-name: {{ $db.name }}
    spec:
      restartPolicy: {{ $db.restartPolicy | default $.Values.global.restartPolicy }}
      {{- with $.Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: init-postgresql
          image: {{ $db.image | default $.Values.image.postgresql }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: CLUSTER_NAME
              value: {{ $db.clusterName | quote }}

            # Admin credentials
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: {{ $db.adminCredentialsSecret }}
                  key: {{ $db.hostKey | default "pgbouncer-host" }}
            - name: PGSSLMODE
              value: require
            - name: PGPORT
              value: {{ $db.port | default "5432" | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $db.adminCredentialsSecret }}
                  key: {{ $db.userKey | default "user" }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $db.adminCredentialsSecret }}
                  key: {{ $db.passwordKey | default "password" }}

            # App user secrets
            {{- if $db.users }}
            {{- range $index, $user := $db.users }}
            - name: APP_USERNAME_{{ $index }}
              valueFrom:
                secretKeyRef:
                  name: {{ $user.credentialsSecret }}
                  key: username
            - name: APP_PASSWORD_{{ $index }}
              valueFrom:
                secretKeyRef:
                  name: {{ $user.credentialsSecret }}
                  key: password
            {{- end }}
            {{- end }}

          command:
            - sh
            - -ec
            - |
              set -e

              echo "=== PostgreSQL Initialization ==="
              apk add --no-cache postgresql-client kubectl busybox-extras

              echo "Waiting for DatabaseCluster '$CLUSTER_NAME'..."
              TIMEOUT=300
              ELAPSED=0
              until [ "$(kubectl get databasecluster "$CLUSTER_NAME" -n {{ $.Values.global.namespace }} \
                -o jsonpath='{.status.status}' 2>/dev/null)" = "ready" ]; do
                if [ $ELAPSED -ge $TIMEOUT ]; then
                  echo "Timeout waiting for cluster"
                  exit 1
                fi
                sleep 5
                ELAPSED=$((ELAPSED + 5))
              done
              echo "Cluster ready."

              # Test connection
              psql -v ON_ERROR_STOP=1 -c "SELECT 1;" >/dev/null

              # -----------------------------
              # Ensure Databases Exist
              # -----------------------------
              {{- range $db.databases }}
              echo "Ensuring database '{{ . }}' exists..."
              if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ . }}'" | grep -q 1; then
                psql -c "CREATE DATABASE \"{{ . }}\";"
              fi
              {{- end }}

              # -----------------------------
              # Ensure Users + Grants
              # -----------------------------
              {{- if $db.users }}
              echo "Managing users..."
              {{- range $index, $user := $db.users }}
              USERNAME="$(printenv APP_USERNAME_{{ $index }})"
              PASSWORD="$(printenv APP_PASSWORD_{{ $index }})"

              echo "Ensuring role '$USERNAME' exists..."
              if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='${USERNAME}'" | grep -q 1; then
                psql -c "CREATE ROLE \"${USERNAME}\" LOGIN PASSWORD '${PASSWORD}';"
              fi

              # Grant CONNECT + harden
              {{- range $dbname := $user.databases }}
              echo "Setting owner of '{{ $dbname }}' to ${USERNAME}"
              psql -c "ALTER DATABASE \"{{ $dbname }}\" OWNER TO \"${USERNAME}\";"

              echo "Granting CONNECT on '{{ $dbname }}' to ${USERNAME}"
              psql -c "GRANT CONNECT ON DATABASE \"{{ $dbname }}\" TO \"${USERNAME}\";"

              psql -d "{{ $dbname }}" -c "ALTER SCHEMA public OWNER TO \"${USERNAME}\";"
              psql -d "{{ $dbname }}" -c "REVOKE ALL ON SCHEMA public FROM PUBLIC;"
              psql -d "{{ $dbname }}" -c "GRANT ALL ON SCHEMA public TO \"${USERNAME}\";"
              psql -d "{{ $dbname }}" -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO \"${USERNAME}\";"
              {{- end }}
              {{- end }}
              {{- end }}

              # -----------------------------
              # Custom Scripts
              # -----------------------------
              {{- if $db.initScripts }}
              echo "Running custom scripts..."
              {{- range $script := $db.initScripts }}
              psql -v ON_ERROR_STOP=1 <<'EOSQL'
              {{ $script }}
              EOSQL
              {{- end }}
              {{- end }}

              echo "=== PostgreSQL initialization complete ==="
{{- end }}
