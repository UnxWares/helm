apiVersion: v2
name: openeverest-database-tools
description: Jobs that wait for an OpenEverest DatabaseCluster to be ready, then create PostgreSQL, MySQL and MongoDB databases, users, grants and run init scripts.
type: application
version: 2026.11.5
# OpenEverest release the chart is tested against (DatabaseCluster everest.percona.com/v1alpha1, 1.x series).
appVersion: "1.17.0"
kubeVersion: ">=1.27.0-0"
home: https://github.com/UnxWares/helm/tree/main/charts/openeverest-database-tools
icon: https://openeverest.io/images/brandkit/icon-full-color-white-min.png

sources:
  - https://github.com/openeverest/openeverest
  - https://github.com/openeverest/openeverest-operator
  - https://github.com/UnxWares/helm/tree/main/charts/openeverest-database-tools

keywords:
  - database
  - initialization
  - openeverest
  - everest
  - percona
  - postgresql
  - mysql
  - mongodb

maintainers:
  - name: David Gheghea
    email: david.gheghea@unxwares.com
    url: https://github.com/UnxWares
  - name: Baptiste Gosselin
    email: baptiste.gosselin@unxwares.com
    url: https://github.com/UnxWares

annotations:
  artifacthub.io/displayName: OpenEverest Database Tools
  artifacthub.io/category: database
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/UnxWares/helm/tree/main/charts/openeverest-database-tools
    - name: OpenEverest documentation
      url: https://openeverest.io/documentation/current/
    - name: Support
      url: https://github.com/UnxWares/helm/issues
  artifacthub.io/images: |
    - name: postgresql-client
      image: ghcr.io/unxwares/postgresql-client:18
    - name: mysql-client
      image: ghcr.io/unxwares/mysql-client:8.4
    - name: mongosh
      image: ghcr.io/unxwares/mongosh:2.14.1
    - name: kubectl
      image: registry.k8s.io/kubectl:v1.37.2
