{{- include "fossflow.validate" . }}
{{- $probePath := ternary "/api/storage/status" "/" .Values.storage.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fossflow.fullname" . }}
  labels:
    {{- include "fossflow.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if include "fossflow.singleNodeStorage" . }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "fossflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "fossflow.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fossflow.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      # No Service environment variables: a Service named `backend` would set BACKEND_PORT.
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "fossflow.podSecurityContext" . | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- include "fossflow.securityContext" . | nindent 12 }}
          image: {{ include "fossflow.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ include "fossflow.containerPort" . }}
              protocol: TCP

          env:
            - name: ENABLE_SERVER_STORAGE
              value: {{ .Values.storage.enabled | quote }}
            {{- if .Values.storage.enabled }}
            - name: STORAGE_PATH
              value: /data/diagrams
            # The backend only listens inside the pod: nginx reaches it on 127.0.0.1, other pods cannot.
            - name: BACKEND_HOST
              value: 127.0.0.1
            {{- if not (include "fossflow.unxwaresImage" .) }}
            - name: PUID
              value: {{ .Values.storage.uid | quote }}
            - name: PGID
              value: {{ .Values.storage.gid | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          {{- with .Values.extraEnvFrom }}
          envFrom:
          {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.livenessProbe }}
          {{- $probe := deepCopy . }}
          {{- if and $probe.httpGet (eq ($probe.httpGet.path | default "/") "/") }}
          {{- $_ := set $probe.httpGet "path" $probePath }}
          {{- end }}
          livenessProbe:
            {{- toYaml $probe | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          {{- $probe := deepCopy . }}
          {{- if and $probe.httpGet (eq ($probe.httpGet.path | default "/") "/") }}
          {{- $_ := set $probe.httpGet "path" $probePath }}
          {{- end }}
          readinessProbe:
            {{- toYaml $probe | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.storage.enabled }}
            - name: data
              mountPath: /data/diagrams
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        # nginx pid and temporary files (request bodies up to 10 MB) of the UnxWares image.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.storage.enabled }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "fossflow.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
