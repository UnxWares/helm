apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "fossflow.fullname" . }}-test-connection"
  labels:
    {{- /* Not the FossFLOW selector labels: the Service and the NetworkPolicy must never pick this pod. */}}
    helm.sh/chart: {{ include "fossflow.chart" . }}
    app.kubernetes.io/name: {{ include "fossflow.name" . }}-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: {{ include "fossflow.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - wget
        - -qO-
        - http://{{ include "fossflow.fullname" . }}:{{ .Values.service.port }}{{ ternary "/api/storage/status" "/" .Values.storage.enabled }}
