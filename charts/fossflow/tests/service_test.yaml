suite: Service, Ingress and HTTPRoute
templates:
  - service.yaml
  - ingress.yaml
  - httproute.yaml
release:
  name: diagrams
  namespace: tools
tests:
  - it: exposes port 80 to the http container port inside the cluster
    template: service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: diagrams-fossflow
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports
          value:
            - port: 80
              targetPort: http
              protocol: TCP
              name: http
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: fossflow
            app.kubernetes.io/instance: diagrams

  - it: applies the Service type and port (README example)
    template: service.yaml
    set:
      service:
        type: LoadBalancer
        port: 8080
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: http

  - it: rejects a Service type outside the schema
    template: service.yaml
    set:
      service:
        type: ExternalName
    asserts:
      - failedTemplate:
          errorPattern: service.type

  - it: creates neither an Ingress nor an HTTPRoute by default
    asserts:
      - hasDocuments:
          count: 0
        template: ingress.yaml
      - hasDocuments:
          count: 0
        template: httproute.yaml

  - it: renders the Ingress of the README with TLS and the body size annotation
    template: ingress.yaml
    set:
      ingress:
        enabled: true
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
          nginx.ingress.kubernetes.io/proxy-body-size: 10m
        hosts:
          - host: diagrams.example.com
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: fossflow-tls
            hosts:
              - diagrams.example.com
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: diagrams-fossflow
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-body-size"]
          value: 10m
      - equal:
          path: spec.tls
          value:
            - hosts:
                - diagrams.example.com
              secretName: fossflow-tls
      - equal:
          path: spec.rules
          value:
            - host: diagrams.example.com
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: diagrams-fossflow
                        port:
                          number: 80

  - it: defaults the Ingress path type to Prefix and follows the Service port
    template: ingress.yaml
    set:
      service:
        port: 8080
      ingress:
        enabled: true
        hosts:
          - host: diagrams.example.com
            paths:
              - path: /
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8080
      - notExists:
          path: spec.tls
      - notExists:
          path: spec.ingressClassName
      - notExists:
          path: metadata.annotations

  - it: renders the HTTPRoute of the README
    template: httproute.yaml
    set:
      httpRoute:
        enabled: true
        parentRefs:
          - name: public-gateway
            namespace: gateway-system
            sectionName: https
        hostnames:
          - diagrams.example.com
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1
      - equal:
          path: spec.parentRefs
          value:
            - name: public-gateway
              namespace: gateway-system
              sectionName: https
      - equal:
          path: spec.hostnames
          value:
            - diagrams.example.com
      - equal:
          path: spec.rules
          value:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              backendRefs:
                - name: diagrams-fossflow
                  port: 80
                  weight: 1

  - it: sends every HTTPRoute rule to the FossFLOW Service and keeps its filters
    template: httproute.yaml
    set:
      service:
        port: 8080
      httpRoute:
        enabled: true
        annotations:
          owner: platform
        hostnames: []
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  set:
                    - name: X-Forwarded-Proto
                      value: https
          - backendRefs:
              - name: elsewhere
                port: 1234
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 2
      - equal:
          path: spec.rules[0].filters[0].type
          value: RequestHeaderModifier
      - equal:
          path: spec.rules[0].backendRefs
          value:
            - name: diagrams-fossflow
              port: 8080
              weight: 1
      - equal:
          path: spec.rules[1]
          value:
            backendRefs:
              - name: diagrams-fossflow
                port: 8080
                weight: 1
      - notExists:
          path: spec.hostnames
      - equal:
          path: metadata.annotations.owner
          value: platform
