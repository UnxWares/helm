suite: NetworkPolicy
templates:
  - networkpolicy.yaml
release:
  name: diagrams
  namespace: tools
tests:
  - it: renders no NetworkPolicy by default
    asserts:
      - hasDocuments:
          count: 0

  - it: opens the http port to any source and closes every egress when ingressFrom is empty
    set:
      networkPolicy:
        enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: diagrams-fossflow
      - equal:
          path: spec
          value:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: fossflow
                app.kubernetes.io/instance: diagrams
            policyTypes:
              - Ingress
              - Egress
            ingress:
              - ports:
                  - port: http
                    protocol: TCP
            egress: []

  - it: allows the pods of the release and the listed peers only (README example)
    set:
      networkPolicy:
        enabled: true
        ingressFrom:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress-nginx
    asserts:
      - equal:
          path: spec.ingress
          value:
            - ports:
                - port: http
                  protocol: TCP
              from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: diagrams
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: ingress-nginx
      - equal:
          path: spec.egress
          value: []

  - it: applies the same policy in browser-only mode
    set:
      storage:
        enabled: false
      networkPolicy:
        enabled: true
    asserts:
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
            - Egress
      - equal:
          path: spec.ingress[0].ports
          value:
            - port: http
              protocol: TCP
