# -- Number of replicas. With server storage on a ReadWriteOnce volume, keep 1.
replicaCount: 1

# -- Image provider. `unxwares`: `ghcr.io/unxwares/fossflow`, FossFLOW built from the upstream sources with updated
# dependencies on a current Alpine, rebuilt twice a week, signed (https://github.com/UnxWares/helm/tree/main/images):
# nginx on port 8080 and the backend run as a non-root user, with a read-only root filesystem. `upstream`:
# `docker.io/abrar74774/fossflow`, built by the maintained continuation of FossFLOW (github.com/Abrar74774/FossFLOW),
# which starts as root (nginx on port 80, backend through su-exec) with a writable root filesystem.
imageProvider: unxwares  # @schema enum:[unxwares, upstream]

image:
  # -- Image repository. Empty: `ghcr.io/unxwares/fossflow` or `docker.io/abrar74774/fossflow`, from `imageProvider`.
  repository: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent  # @schema enum:[Always, IfNotPresent, Never]
  # -- Image tag. Empty: the chart appVersion for the UnxWares image, `master-b06baad` for the upstream one (upstream only publishes `master-<commit>` tags: `master-b06baad` is release v1.0.6).
  tag: ""
  # -- Image digest (`sha256:...`). When set, it takes precedence over the tag.
  digest: ""

# -- Secrets for pulling images from a private registry.
imagePullSecrets: []
# -- Override the chart name.
nameOverride: ""
# -- Override the full resource names.
fullnameOverride: ""

storage:
  # -- Save diagrams on the server (Node.js backend + volume). When false, diagrams only live in the browser.
  enabled: true
  # -- User that owns the diagrams. The UnxWares image runs nginx and the backend as this user; the upstream image
  # starts as root and drops the backend to it (`PUID`), nginx keeping its own `nginx` user.
  uid: 1000
  # -- Group of the diagrams (`fsGroup` of the pod; `PGID` with the upstream image).
  gid: 1000

# -- Extra environment variables. HTTP_AUTH_USER/HTTP_AUTH_PASSWORD do not work: the upstream image fails to build its password file (OpenSSL 3 has no bcrypt) and the UnxWares image refuses to start with them. Protect FossFLOW at the ingress level instead.
extraEnv: []

# -- Extra envFrom sources.
extraEnvFrom: []

serviceAccount:
  # -- Create a dedicated service account.
  create: true
  # -- FossFLOW never talks to the Kubernetes API: the token is not mounted.
  automount: false
  # -- Service account annotations.
  annotations: {}
  # -- Service account name (generated when empty).
  name: ""

# -- Pod annotations.
podAnnotations: {}
# -- Pod labels.
podLabels: {}

# -- Pod security context. Empty: the defaults of `imageProvider`, `fsGroup` `storage.gid` and seccomp
# `RuntimeDefault`, plus `runAsNonRoot` as `storage.uid`:`storage.gid` with the UnxWares image (see Security in the
# README).
podSecurityContext: {}  # @schema skipProperties:true

# -- Container security context. Empty: the defaults of `imageProvider`. UnxWares image: read-only root filesystem,
# every capability dropped. Upstream image: its entrypoint must start as root (nginx binds port 80 and rewrites its
# configuration, the backend is started through su-exec), so every capability is dropped except the five it needs.
securityContext: {}  # @schema skipProperties:true

# -- Grace period of the pod. The UnxWares image stops nginx and the backend on SIGTERM; the upstream entrypoint
# does not forward it, so the pod waits for the whole period.
terminationGracePeriodSeconds: 10

service:
  # -- Service type.
  type: ClusterIP  # @schema enum:[ClusterIP, NodePort, LoadBalancer]
  # -- Service port (the container listens on 8080 with the UnxWares image, 80 with the upstream one).
  port: 80

ingress:
  # -- Expose FossFLOW through an Ingress.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress annotations (add authentication here, e.g. oauth2-proxy or basic auth).
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  # -- Ingress hosts.
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS.
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

httpRoute:
  # -- Expose FossFLOW through a Gateway API HTTPRoute.
  enabled: false
  # -- HTTPRoute annotations.
  annotations: {}
  # -- Gateways this route is attached to.
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  # -- Hostnames.
  hostnames:
    - chart-example.local
  # -- Rules (every rule is sent to the FossFLOW service).
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# -- Resources.
resources:  # @schema skipProperties:true
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    memory: 512Mi

# -- Liveness probe (same `/api/storage/status` substitution as the readiness probe).
livenessProbe:  # @schema skipProperties:true
  httpGet:
    path: /
    port: http
  periodSeconds: 20
# -- Readiness probe. With `storage.enabled` and the default path `/`, the chart probes `/api/storage/status` instead, so a dead backend makes the pod unready.
readinessProbe:  # @schema skipProperties:true
  httpGet:
    path: /
    port: http
  periodSeconds: 10

autoscaling:
  # -- Enable the HorizontalPodAutoscaler (only without server storage, or with a ReadWriteMany volume).
  enabled: false
  # -- Minimum replicas.
  minReplicas: 1
  # -- Maximum replicas.
  maxReplicas: 5
  # -- Target CPU utilization.
  targetCPUUtilizationPercentage: 80
  # -- Target memory utilization.
  targetMemoryUtilizationPercentage: null  # @schema type:[integer, null]

persistence:
  # -- Persist the diagrams (/data/diagrams) when `storage.enabled`.
  enabled: true
  # -- Use an existing PVC.
  existingClaim: ""
  # -- Storage class (empty uses the cluster default).
  storageClass: ""
  # -- Access modes.
  accessModes:
    - ReadWriteOnce
  # -- Volume size.
  size: 1Gi
  # -- PVC annotations.
  annotations: {}

networkPolicy:
  # -- Create a NetworkPolicy: FossFLOW only accepts traffic on its HTTP port and opens no connection (no egress at all).
  enabled: false
  # -- Peers allowed to reach FossFLOW (e.g. your ingress controller). Empty allows any source on the HTTP port; pods of this release are always allowed.
  ingressFrom: []
  # - namespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: ingress-nginx

# -- Additional volumes on the output Deployment definition.
volumes: []
# -- Additional volumeMounts on the output Deployment definition.
volumeMounts: []

# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity rules.
affinity: {}
