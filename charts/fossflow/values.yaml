# -- Number of replicas. With server storage on a ReadWriteOnce volume, keep 1.
replicaCount: 1

image:
  # -- FossFLOW image. `abrar74774/fossflow` is built by the maintained continuation of FossFLOW (github.com/Abrar74774/FossFLOW).
  repository: docker.io/abrar74774/fossflow
  # -- Image pull policy.
  pullPolicy: IfNotPresent  # @schema enum:[Always, IfNotPresent, Never]
  # -- Image tag. Upstream only publishes `master-<commit>` tags: `master-2b3cee3` is release v1.0.5.
  tag: "master-2b3cee3"
  # -- Image digest (`sha256:...`). When set, it takes precedence over the tag.
  digest: ""

# -- Secrets for pulling images from a private registry.
imagePullSecrets: []
# -- Override the chart name.
nameOverride: ""
# -- Override the full resource names.
fullnameOverride: ""

storage:
  # -- Save diagrams on the server (Node.js backend + volume). When false, diagrams only live in the browser.
  enabled: true
  # -- User and group the Node.js backend drops to (`PUID`/`PGID`). nginx keeps its own `nginx` user.
  uid: 1000
  gid: 1000

# -- Extra environment variables. HTTP_AUTH_USER/HTTP_AUTH_PASSWORD are broken in the upstream image (OpenSSL 3 has no bcrypt): protect FossFLOW at the ingress level instead.
extraEnv: []
# - name: DIAGRAM_LIST_CACHE_TTL_MS
#   value: "5000"

# -- Extra envFrom sources.
extraEnvFrom: []

serviceAccount:
  # -- Create a dedicated service account.
  create: true
  # -- FossFLOW never talks to the Kubernetes API: the token is not mounted.
  automount: false
  # -- Service account annotations.
  annotations: {}
  # -- Service account name (generated when empty).
  name: ""

# -- Pod annotations.
podAnnotations: {}
# -- Pod labels.
podLabels: {}

# -- Pod security context.
podSecurityContext:  # @schema skipProperties:true
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# -- Container security context. The image entrypoint must start as root (nginx binds port 80 and rewrites its config,
# the backend is started through su-exec): every capability is dropped except the five it needs.
securityContext:  # @schema skipProperties:true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE

# -- The image entrypoint does not forward SIGTERM: keep the grace period short.
terminationGracePeriodSeconds: 10

service:
  # -- Service type.
  type: ClusterIP  # @schema enum:[ClusterIP, NodePort, LoadBalancer]
  # -- Service port (the container listens on 80).
  port: 80

ingress:
  # -- Expose FossFLOW through an Ingress.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress annotations (add authentication here, e.g. oauth2-proxy or basic auth).
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  # -- Ingress hosts.
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS.
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

httpRoute:
  # -- Expose FossFLOW through a Gateway API HTTPRoute.
  enabled: false
  # -- HTTPRoute annotations.
  annotations: {}
  # -- Gateways this route is attached to.
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  # -- Hostnames.
  hostnames:
    - chart-example.local
  # -- Rules (every rule is sent to the FossFLOW service).
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# -- Resources.
resources:  # @schema skipProperties:true
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    memory: 512Mi

# -- Liveness probe (same `/api/storage/status` substitution as the readiness probe).
livenessProbe:  # @schema skipProperties:true
  httpGet:
    path: /
    port: http
  periodSeconds: 20
# -- Readiness probe. With `storage.enabled` and the default path `/`, the chart probes `/api/storage/status` instead, so a dead backend makes the pod unready.
readinessProbe:  # @schema skipProperties:true
  httpGet:
    path: /
    port: http
  periodSeconds: 10

autoscaling:
  # -- Enable the HorizontalPodAutoscaler (only without server storage, or with a ReadWriteMany volume).
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

persistence:
  # -- Persist the diagrams (/data/diagrams) when `storage.enabled`.
  enabled: true
  # -- Use an existing PVC.
  existingClaim: ""
  # -- Storage class (empty uses the cluster default).
  storageClass: ""
  # -- Access modes.
  accessModes:
    - ReadWriteOnce
  # -- Volume size.
  size: 1Gi
  # -- PVC annotations.
  annotations: {}

# -- Additional volumes on the output Deployment definition.
volumes: []
# -- Additional volumeMounts on the output Deployment definition.
volumeMounts: []

# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity rules.
affinity: {}
