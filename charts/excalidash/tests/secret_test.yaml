suite: chart Secret
templates:
  - secret.yaml
release:
  name: excalidash
  namespace: excalidash
tests:
  - it: generates the JWT and CSRF secrets and the API key pepper, 64 characters each, kept on uninstall
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: excalidash
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - matchRegex:
          path: data["jwt-secret"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{64}$
      - matchRegex:
          path: data["csrf-secret"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{64}$
      - matchRegex:
          path: data["api-key-hash-pepper"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{64}$
      - notExists:
          path: data["oidc-client-secret"]

  - it: stores the default SQLite URL, so DATABASE_URL always comes from a Secret
    asserts:
      - equal:
          path: data["database-url"]
          value: file:/app/prisma/db.sqlite
          decodeBase64: true

  - it: keeps the generated values already stored in the release Secret
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: excalidash
            namespace: excalidash
          data:
            jwt-secret: a2VwdC1qd3Q=  # kept-jwt
            csrf-secret: a2VwdC1jc3Jm  # kept-csrf
            api-key-hash-pepper: a2VwdC1wZXBwZXI=  # kept-pepper
    asserts:
      - equal:
          path: data["jwt-secret"]
          value: kept-jwt
          decodeBase64: true
      - equal:
          path: data["csrf-secret"]
          value: kept-csrf
          decodeBase64: true
      - equal:
          path: data["api-key-hash-pepper"]
          value: kept-pepper
          decodeBase64: true

  - it: generates the missing values next to the ones it keeps
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: excalidash
            namespace: excalidash
          data:
            jwt-secret: a2VwdC1qd3Q=  # kept-jwt
    asserts:
      - equal:
          path: data["jwt-secret"]
          value: kept-jwt
          decodeBase64: true
      - matchRegex:
          path: data["api-key-hash-pepper"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{64}$

  - it: generates new values over a kept Secret that has no data (all secrets were in your own Secrets)
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: excalidash
            namespace: excalidash
    asserts:
      - matchRegex:
          path: data["jwt-secret"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{64}$

  - it: ignores a Secret of another release
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: other-excalidash
            namespace: excalidash
          data:
            jwt-secret: a2VwdC1qd3Q=
    asserts:
      - matchRegex:
          path: data["jwt-secret"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{64}$

  - it: stores the secrets given in the values, even over the stored ones
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: excalidash
            namespace: excalidash
          data:
            jwt-secret: a2VwdC1qd3Q=  # kept-jwt
    set:
      backend.secrets.jwtSecret: jwt-given-by-the-user
      backend.secrets.csrfSecret: csrf-given-by-the-user
      backend.secrets.apiKeyHashPepper: pepper-given-by-the-user
    asserts:
      - equal:
          path: data["jwt-secret"]
          value: jwt-given-by-the-user
          decodeBase64: true
      - equal:
          path: data["csrf-secret"]
          value: csrf-given-by-the-user
          decodeBase64: true
      - equal:
          path: data["api-key-hash-pepper"]
          value: pepper-given-by-the-user
          decodeBase64: true

  - it: leaves the three application secrets out with backend.secrets.existingSecret
    set:
      backend.secrets.existingSecret: excalidash-app
      backend.secrets.jwtSecret: ignored
    asserts:
      - notExists:
          path: data["jwt-secret"]
      - notExists:
          path: data["csrf-secret"]
      - notExists:
          path: data["api-key-hash-pepper"]
      - exists:
          path: data["database-url"]

  - it: stores the PostgreSQL URL given as a value
    set:
      backend.database.provider: postgresql
      backend.database.url: postgresql://excalidash:pw@db-rw.databases.svc:5432/excalidash
    asserts:
      - equal:
          path: data["database-url"]
          value: postgresql://excalidash:pw@db-rw.databases.svc:5432/excalidash
          decodeBase64: true

  - it: stores no database URL with an existing database Secret
    set:
      backend.database.provider: postgresql
      backend.database.existingSecret: excalidash-db
    asserts:
      - notExists:
          path: data["database-url"]

  - it: stores the OIDC client secret given as a value
    set:
      backend.auth.oidc.clientSecret: oidc-secret
    asserts:
      - equal:
          path: data["oidc-client-secret"]
          value: oidc-secret
          decodeBase64: true

  - it: stores no OIDC client secret with an existing OIDC Secret
    set:
      backend.auth.oidc.clientSecret: ignored
      backend.auth.oidc.existingSecret: excalidash-oidc
    asserts:
      - notExists:
          path: data["oidc-client-secret"]

  - it: renders an empty Secret when every secret comes from your own Secrets
    set:
      backend.secrets.existingSecret: excalidash-app
      backend.database.existingSecret: excalidash-db
    asserts:
      - isKind:
          of: Secret
      - isNullOrEmpty:
          path: data
