suite: persistence of /app/prisma
templates:
  - backend/deployment.yaml
  - backend/pvc.yaml
release:
  name: excalidash
  namespace: excalidash
tests:
  - it: creates a 1Gi ReadWriteOnce claim kept on uninstall
    template: backend/pvc.yaml
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: excalidash-backend
      - equal:
          path: metadata.annotations
          value:
            helm.sh/resource-policy: keep
      - equal:
          path: spec.accessModes
          value:
            - ReadWriteOnce
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
      - notExists:
          path: spec.storageClassName

  - it: mounts the claim on /app/prisma
    template: backend/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: excalidash-backend
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /app/prisma

  - it: sets the storage class, size, access modes and annotations (README example)
    template: backend/pvc.yaml
    set:
      backend.persistence.storageClass: fast-ssd
      backend.persistence.size: 5Gi
      backend.persistence.accessModes:
        - ReadWriteOncePod
      backend.persistence.annotations:
        backup: daily
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast-ssd
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi
      - equal:
          path: spec.accessModes
          value:
            - ReadWriteOncePod
      - equal:
          path: metadata.annotations
          value:
            helm.sh/resource-policy: keep
            backup: daily

  - it: uses an existing claim without creating one
    set:
      backend.persistence.existingClaim: excalidash-data
    asserts:
      - hasDocuments:
          count: 0
        template: backend/pvc.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: excalidash-data
        template: backend/deployment.yaml

  - it: falls back to an emptyDir when persistence is disabled
    set:
      backend.persistence.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: backend/pvc.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}
        template: backend/deployment.yaml
