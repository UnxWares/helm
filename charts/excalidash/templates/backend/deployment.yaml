{{- $b := .Values.backend }}
{{- $secret := include "excalidash.secretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "excalidash.backend.fullname" . }}
  labels:
    {{- include "excalidash.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # Socket.IO state lives in memory: a single replica, replaced (not rolled) so two pods never share the SQLite volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "excalidash.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ list $b.secrets $b.database.url $b.auth.oidc.clientSecret | toJson | sha256sum }}
        {{- with $b.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "excalidash.backend.selectorLabels" . | nindent 8 }}
        {{- with $b.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- $ips := $b.imagePullSecrets | default .Values.global.imagePullSecrets }}
      {{- if $ips }}
      imagePullSecrets:
        {{- toYaml $ips | nindent 8 }}
      {{- end }}

      serviceAccountName: {{ include "excalidash.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}

      {{- with $b.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        # The entrypoint replaces /app/dist/generated (the Prisma client of the selected provider) and changes the
        # mode of /app/uploads (import staging) at every start. With a read-only root filesystem, both come from
        # this pod's emptyDir: a fresh copy of the image's /app/dist, and an empty uploads directory owned by the
        # backend user.
        - name: copy-app
          {{- with $b.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "excalidash.image" (dict "image" $b.image "default" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ $b.image.pullPolicy }}
          command:
            - sh
            - -c
            - mkdir -p /runtime/dist /runtime/uploads && cp -R /app/dist/. /runtime/dist/
          {{- with $b.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: runtime
              mountPath: /runtime

      containers:
        - name: backend
          {{- with $b.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          image: {{ include "excalidash.image" (dict "image" $b.image "default" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ $b.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ $b.service.port }}
              protocol: TCP

          env:
            - name: PORT
              value: "{{ $b.service.port }}"
            - name: NODE_ENV
              value: {{ $b.nodeEnv | quote }}
            - name: FRONTEND_URL
              value: {{ .Values.frontend.url | quote }}
            - name: TRUST_PROXY
              value: {{ $b.trustProxy | quote }}
            - name: DATABASE_PROVIDER
              value: {{ $b.database.provider | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $b.database.existingSecret | default $secret }}
                  key: {{ ternary $b.database.secretKeys.url "database-url" (not (empty $b.database.existingSecret)) }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $b.secrets.existingSecret | default $secret }}
                  key: jwt-secret
            - name: CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $b.secrets.existingSecret | default $secret }}
                  key: csrf-secret
            - name: API_KEY_HASH_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ $b.secrets.existingSecret | default $secret }}
                  key: api-key-hash-pepper
            - name: AUTH_MODE
              value: {{ $b.auth.mode | quote }}
            {{- if has $b.auth.mode (list "hybrid" "oidc_enforced") }}
            {{- with $b.auth.oidc }}
            - name: OIDC_PROVIDER_NAME
              value: {{ .providerName | default "SSO" | quote }}
            - name: OIDC_ISSUER_URL
              value: {{ .issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .clientId | quote }}
            - name: OIDC_REDIRECT_URI
              value: {{ .redirectUri | default (printf "%s/api/auth/oidc/callback" (trimSuffix "/" $.Values.frontend.url)) | quote }}
            {{- if or .clientSecret .existingSecret }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret | default $secret }}
                  key: {{ ternary .existingSecretKey "oidc-client-secret" (not (empty .existingSecret)) }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with $b.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          {{- with $b.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with $b.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $b.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $b.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with $b.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            - name: data
              mountPath: /app/prisma
            - name: tmp
              mountPath: /tmp
            - name: runtime
              mountPath: /app/dist
              subPath: dist
            - name: runtime
              mountPath: /app/uploads
              subPath: uploads
            {{- with $b.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

      volumes:
        - name: data
          {{- if $b.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $b.persistence.existingClaim | default (include "excalidash.backend.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        # /app/dist (about 35 MB once the entrypoint has copied the Prisma client) and /app/uploads (import archives
        # while they are checked, up to the upload size limit).
        - name: runtime
          emptyDir:
            sizeLimit: 1Gi
        {{- with $b.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- $ns := $b.nodeSelector | default .Values.global.pod.nodeSelector }}
      {{- if $ns }}
      nodeSelector:
        {{- toYaml $ns | nindent 8 }}
      {{- end }}

      {{- $aff := $b.affinity | default .Values.global.pod.affinity }}
      {{- if $aff }}
      affinity:
        {{- toYaml $aff | nindent 8 }}
      {{- end }}

      {{- $tol := $b.tolerations | default .Values.global.pod.tolerations }}
      {{- if $tol }}
      tolerations:
        {{- toYaml $tol | nindent 8 }}
      {{- end }}
