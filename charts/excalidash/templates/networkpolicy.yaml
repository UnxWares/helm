{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "excalidash.backend.fullname" . }}
  labels:
    {{- include "excalidash.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      {{- include "excalidash.backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Only the frontend (and helm tests of this release) may reach the backend API.
    - from:
        - podSelector:
            matchLabels:
              {{- include "excalidash.frontend.selectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "excalidash.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: test
      ports:
        - port: http
          protocol: TCP
{{- end }}
