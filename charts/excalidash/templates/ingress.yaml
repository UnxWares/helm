{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "excalidash.fullname" . }}
  labels:
    {{- include "excalidash.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}

  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}

  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:

          # Backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "excalidash.backend.fullname" $ }}
                port:
                  number: {{ $.Values.backend.service.port }}

          # Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "excalidash.frontend.fullname" $ }}
                port:
                  number: {{ $.Values.frontend.service.port }}

    {{- end }}
{{- end }}
