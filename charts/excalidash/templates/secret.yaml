{{- include "excalidash.validate" . }}
{{- $b := .Values.backend }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "excalidash.secretName" . }}
  labels:
    {{- include "excalidash.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not $b.secrets.existingSecret }}
  jwt-secret: {{ include "excalidash.generatedSecret" (dict "ctx" $ "key" "jwt-secret" "value" $b.secrets.jwtSecret "length" 64) | b64enc | quote }}
  csrf-secret: {{ include "excalidash.generatedSecret" (dict "ctx" $ "key" "csrf-secret" "value" $b.secrets.csrfSecret "length" 64) | b64enc | quote }}
  api-key-hash-pepper: {{ include "excalidash.generatedSecret" (dict "ctx" $ "key" "api-key-hash-pepper" "value" $b.secrets.apiKeyHashPepper "length" 64) | b64enc | quote }}
  {{- end }}
  {{- if not $b.database.existingSecret }}
  database-url: {{ $b.database.url | b64enc | quote }}
  {{- end }}
  {{- if and $b.auth.oidc.clientSecret (not $b.auth.oidc.existingSecret) }}
  oidc-client-secret: {{ $b.auth.oidc.clientSecret | b64enc | quote }}
  {{- end }}
