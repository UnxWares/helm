global:
  pod:
    nodeSelector: {}
    tolerations: []
    affinity: {}
  imagePullSecrets: []

frontend:
  replicaCount: 1
  image:
    repository: zimengxiong/excalidash-frontend
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "0.4.27"

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  service:
    type: ClusterIP
    port: 80

  extraEnv: []
  # - name: ENABLE_SERVER_STORAGE
  #   value: "false"

  extraEnvFrom: []
  # - secretRef:
  #     name: my-secret
  # - configMapRef:
  #     name: my-config

  # This is for setting Kubernetes Annotations to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  # This is for setting Kubernetes Labels to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

  # This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # Additional volumes on the output Deployment definition.
  volumes: []
    # - name: data
    #   secret:
    #   persistentVolumeClaim:
    #     claimName: some-claim

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
    # - name: data
    #   mountPath: ""
    #   readOnly: false

  nodeSelector: {}

  tolerations: []

  affinity: {}

backend:
  replicaCount: 1
  image:
    repository: zimengxiong/excalidash-backend
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "0.4.27"

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  nodeEnv: production

  service:
    type: ClusterIP
    # This port will be used for the PORT environment variable
    port: 8000

  database:
    enabled: true

    # This must be changed for production
    url: "file:/app/prisma/db.sqlite"

    # If you want to pull values from an existing secret
    # Using existingSecret will override database.url
    # existingSecret: "existing-secret"
    secretKeys:
      url: database-url

  extraEnv:
    # Keep disabled by default; only enable when a trusted proxy sanitizes forwarded headers. (can be enabled safely with traefik)
    - name: TRUST_PROXY
      value: "false"
    # Optional for single-instance deployments:
    # if unset, backend auto-generates and persists one in the volume.
    # Recommended to set explicitly for portability and multi-instance setups.
    # Recommended to generate with `openssl rand -hex 32`.
    # - name: JWT_SECRET
    #   value: "somedefaultsecret"
    # - name: CSRF_SECRET
    #   value: "someothersecret"

    - name: AUTH_MODE
      value: "local"
    # Optional OIDC settings (required for AUTH_MODE=hybrid or oidc_enforced)
    # - name: OIDC_PROVIDER_NAME
    #   value: "Authentik"
    # - name: OIDC_ISSUER_URL
    #   value: "https://auth.example.com/application/o/excalidash/"
    # - name: OIDC_CLIENT_ID
    #   value: "your-client-id"
    # - name: OIDC_CLIENT_SECRET
    #   value: "your-client-secret"
    # - name: OIDC_REDIRECT_URI
    #   value: "https://excalidash.example.com/api/auth/oidc/callback"

  # Everything above can be pulled by a secret
  extraEnvFrom: []
  # - secretRef:
  #     name: my-secret
  # - configMapRef:
  #     name: my-config

  # This is for setting Kubernetes Annotations to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  # This is for setting Kubernetes Labels to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    httpGet:
      path: /health
      port: http
  readinessProbe:
    httpGet:
      path: /health
      port: http

  # This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # Additional volumes on the output Deployment definition.
  volumes: []
    # - name: data
    #   secret:
    #   persistentVolumeClaim:
    #     claimName: some-data

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
    # - name: data
    #   mountPath: "/some/path"
    #   readOnly: false

  nodeSelector: {}

  tolerations: []

  affinity: {}

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""


# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

