global:
  pod:
    # -- Default node selector for every pod.
    nodeSelector: {}
    # -- Default tolerations for every pod.
    tolerations: []
    # -- Default affinity for every pod.
    affinity: {}
  # -- Default image pull secrets for every pod.
  imagePullSecrets: []

frontend:
  # -- Frontend replicas (stateless nginx, can scale).
  replicaCount: 1
  image:
    # -- Frontend image repository. Keep the frontend and backend tags identical.
    repository: docker.io/zimengxiong/excalidash-frontend
    # -- Image pull policy.
    pullPolicy: IfNotPresent  # @schema enum:[Always, IfNotPresent, Never]
    # -- Image tag (defaults to the chart appVersion).
    tag: ""
    # -- Image digest (takes precedence over the tag).
    digest: ""

  # -- Public URL of ExcaliDash (used by the backend for redirects, cookies and OIDC). An https URL makes the backend redirect plain HTTP requests.
  url: https://excalidash.example.com

  # -- Image pull secrets (defaults to global.imagePullSecrets).
  imagePullSecrets: []

  service:
    # -- Frontend service type.
    type: ClusterIP  # @schema enum:[ClusterIP, NodePort, LoadBalancer]
    # -- Frontend service port (the container listens on 8080).
    port: 80

  # -- Extra environment variables.
  extraEnv: []
  # -- Extra envFrom sources.
  extraEnvFrom: []

  # -- Pod annotations.
  podAnnotations: {}
  # -- Pod labels.
  podLabels: {}

  # -- Pod security context. The image (nginx-unprivileged, uid 101) also listens on port 80, which needs the
  # `net.ipv4.ip_unprivileged_port_start` sysctl (in the Kubernetes "safe" set) when running without capabilities.
  podSecurityContext:  # @schema skipProperties:true
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "80"

  # -- Container security context.
  securityContext:  # @schema skipProperties:true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # -- Resources.
  resources:  # @schema skipProperties:true
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

  # -- Liveness probe.
  livenessProbe:  # @schema skipProperties:true
    httpGet:
      path: /
      port: http
  # -- Readiness probe.
  readinessProbe:  # @schema skipProperties:true
    httpGet:
      path: /
      port: http

  autoscaling:
    # -- Enable the frontend HorizontalPodAutoscaler.
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  # -- Additional volumes.
  volumes: []
  # -- Additional volume mounts.
  volumeMounts: []

  # -- Node selector (defaults to global.pod.nodeSelector).
  nodeSelector: {}
  # -- Tolerations (defaults to global.pod.tolerations).
  tolerations: []
  # -- Affinity (defaults to global.pod.affinity).
  affinity: {}

backend:
  # -- Backend replicas. Socket.IO keeps its state in memory: the chart only supports 1.
  replicaCount: 1
  image:
    # -- Backend image repository.
    repository: docker.io/zimengxiong/excalidash-backend
    # -- Image pull policy.
    pullPolicy: IfNotPresent  # @schema enum:[Always, IfNotPresent, Never]
    # -- Image tag (defaults to the chart appVersion).
    tag: ""
    # -- Image digest (takes precedence over the tag).
    digest: ""

  # -- Image pull secrets (defaults to global.imagePullSecrets).
  imagePullSecrets: []

  # -- NODE_ENV.
  nodeEnv: production

  service:
    # -- Backend service type.
    type: ClusterIP  # @schema enum:[ClusterIP, NodePort, LoadBalancer]
    # -- Backend port (also used for the PORT environment variable).
    port: 8000

  database:
    # -- Database provider: `sqlite` (stored in the persistent volume) or `postgresql`.
    provider: sqlite  # @schema enum:[sqlite, postgresql]
    # -- Database URL. For sqlite keep a path under /app/prisma; for postgresql use a postgresql:// URL (stored in the chart secret).
    url: "file:/app/prisma/db.sqlite"
    # -- Existing secret holding the database URL (overrides `url`).
    existingSecret: ""
    secretKeys:
      # -- Key of the URL in `existingSecret`.
      url: database-url

  # Application secrets. Empty values are generated once and kept across upgrades.
  secrets:
    # -- JWT signing secret (32+ characters).
    jwtSecret: ""
    # -- CSRF secret.
    csrfSecret: ""
    # -- Pepper used to hash API keys. Never change it once API keys exist.
    apiKeyHashPepper: ""
    # -- Existing secret with the keys `jwt-secret`, `csrf-secret` and `api-key-hash-pepper` (overrides the values above).
    existingSecret: ""

  auth:
    # -- Authentication mode: `local`, `hybrid` (local + OIDC), `oidc_enforced` or `disabled`.
    mode: local  # @schema enum:[local, hybrid, oidc_enforced, disabled]
    oidc:
      # -- Name shown on the login button.
      providerName: ""
      # -- OIDC issuer URL.
      issuerUrl: ""
      # -- OIDC client ID.
      clientId: ""
      # -- OIDC client secret (stored in the chart secret; ignored with `existingSecret`).
      clientSecret: ""
      # -- Existing secret holding the client secret.
      existingSecret: ""
      # -- Key of the client secret in `existingSecret`.
      existingSecretKey: oidc-client-secret
      # -- Redirect URI (defaults to `<frontend.url>/api/auth/oidc/callback`).
      redirectUri: ""

  # -- Trust X-Forwarded-* headers. Only enable it when a trusted proxy (your ingress) sanitizes them.
  trustProxy: "false"

  # -- Extra environment variables (SMTP, S3 storage, backups, rate limits...). See the ExcaliDash docs.
  extraEnv: []
  # - name: FILE_UPLOAD_MAX_MB
  #   value: "100"

  # -- Extra envFrom sources (e.g. a secret with SMTP or S3 credentials).
  extraEnvFrom: []

  persistence:
    # -- Persist /app/prisma (SQLite database, migrations lock). Without it, data is lost when the pod restarts.
    enabled: true
    # -- Use an existing PVC.
    existingClaim: ""
    # -- Storage class (empty uses the cluster default).
    storageClass: ""
    # -- Access modes.
    accessModes:
      - ReadWriteOnce
    # -- Volume size.
    size: 1Gi
    # -- PVC annotations.
    annotations: {}

  # -- Pod annotations.
  podAnnotations: {}
  # -- Pod labels.
  podLabels: {}

  # -- Pod security context (the image runs as `nodejs`, uid 1001).
  podSecurityContext:  # @schema skipProperties:true
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  # -- Container security context. The entrypoint regenerates files under /app at every start, so the root filesystem stays writable.
  securityContext:  # @schema skipProperties:true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # -- Resources.
  resources:  # @schema skipProperties:true
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 1Gi

  # -- Liveness probe (`/health` checks the database).
  livenessProbe:  # @schema skipProperties:true
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
  # -- Readiness probe.
  readinessProbe:  # @schema skipProperties:true
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    timeoutSeconds: 10
  # -- Startup probe (database migrations run at startup, with a 120 s lock timeout).
  startupProbe:  # @schema skipProperties:true
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    failureThreshold: 60

  autoscaling:
    # -- Not supported (single backend replica); kept for compatibility, must stay false.
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80

  # -- Additional volumes.
  volumes: []
  # -- Additional volume mounts.
  volumeMounts: []

  # -- Node selector (defaults to global.pod.nodeSelector).
  nodeSelector: {}
  # -- Tolerations (defaults to global.pod.tolerations).
  tolerations: []
  # -- Affinity (defaults to global.pod.affinity).
  affinity: {}

serviceAccount:
  # -- Create a dedicated service account.
  create: true
  # -- ExcaliDash never talks to the Kubernetes API: the token is not mounted.
  automount: false
  # -- Service account annotations.
  annotations: {}
  # -- Service account name (generated when empty).
  name: ""

# -- Override the chart name.
nameOverride: ""
# -- Override the full resource names.
fullnameOverride: ""

ingress:
  # -- Expose ExcaliDash through an Ingress (everything goes to the frontend, which proxies /api and /socket.io).
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress annotations (WebSockets must be allowed for live collaboration).
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  # -- Ingress hosts.
  hosts:
    - host: chart-example.local
  # -- Ingress TLS.
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

httpRoute:
  # -- Expose ExcaliDash through a Gateway API HTTPRoute.
  enabled: false
  # -- HTTPRoute annotations.
  annotations: {}
  # -- Gateways this route is attached to.
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  # -- Hostnames.
  hostnames:
    - chart-example.local
  # -- Rules (every rule is sent to the frontend service).
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

networkPolicy:
  # -- Create NetworkPolicies: the backend only accepts traffic from the frontend.
  enabled: false
