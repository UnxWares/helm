      url: https://github.com/UnxWares/helm/issues
  artifacthub.io/images: |
    - name: excalidash-frontend
      image: docker.io/zimengxiong/excalidash-frontend:0.6.7
    - name: excalidash-backend
      image: docker.io/zimengxiong/excalidash-backend:0.6.7
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: security
      description: "backend.trustProxy defaults to \"1\", the chart's own frontend nginx: behind an Ingress or a Gateway that terminates TLS, session and CSRF cookies now get the Secure flag. See Upgrading in the README."
    - kind: changed
      description: "The backend runs with a read-only root filesystem: an init container copies /app/dist into an emptyDir, which also holds /app/uploads."
    - kind: fixed
      description: "The chart Secret is kept on uninstall (helm.sh/resource-policy: keep), like the PVC: a new install keeps sessions and API keys valid."
    - kind: fixed
      description: "The OIDC modes require backend.auth.oidc.clientId as well as issuerUrl, and an https:// redirect URI in production, without which the backend does not start."
    - kind: fixed
      description: "helm test uses the image pull secrets and pull policy of the frontend, and sets resources."
    - kind: added
      description: "frontend.autoscaling.targetMemoryUtilizationPercentage, already read by the HPA template."
    - kind: fixed
      description: "NOTES explain how the first administrator is created in each authentication mode."
    - kind: added
      description: "End-to-end test in CI: onboarding with the setup code, login, drawing created, listed, exported and accepted by the import check, Secure cookies behind TLS, NetworkPolicy, then what a new install keeps."
  artifacthub.io/signKey: |
    fingerprint: 7902E52EA435EF27C6432E5378D6B532C599DA9B
    url: https://helm.unxwares.studio/pgp-public-key.asc
