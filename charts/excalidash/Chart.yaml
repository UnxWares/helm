annotations:
  artifacthub.io/displayName: ExcaliDash
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/UnxWares/helm/tree/main/charts/excalidash
    - name: ExcaliDash documentation
      url: https://github.com/ZimengXiong/ExcaliDash/tree/main/docs
