apiVersion: v2
name: bind9
description: A flexible and production-ready Helm chart for running ISC Bind9 DNS server on Kubernetes.
type: application

version: 2026.11.2
appVersion: "9.20"
kubeVersion: ">=1.27.0-0"
home: https://github.com/UnxWares/helm/tree/main/charts/bind9
icon: https://avatars.githubusercontent.com/u/3965132?v=4

sources:
  - https://gitlab.isc.org/isc-projects/bind9
  - https://github.com/isc-projects/bind9-docker
  - https://hub.docker.com/r/internetsystemsconsortium/bind9
  - https://github.com/prometheus-community/bind_exporter
  - https://github.com/UnxWares/helm/tree/main/charts/bind9

keywords:
