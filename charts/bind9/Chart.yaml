  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: added
      description: "Unit tests (helm-unittest, 107 tests) of the security contexts, image selection, named.conf and zone files, persistence, Services, ServiceMonitor, NetworkPolicy, HPA and PDB, preStop hook, helm test pod, release notes and README examples, run in CI on every pull request and push to main. They also showed that the README fallback for clusters that forbid the port sysctl kept it (Helm merges maps): the example now sets sysctls: null."
    - kind: fixed
      description: "A rolling update or a drain no longer refuses queries while the old pod stops: a preStop hook keeps named answering for preStopSleepSeconds (5 s) while the pod leaves the Service endpoints (the sleep action on Kubernetes 1.30 and later, sleep from the image on older clusters; 0 removes it). terminationGracePeriodSeconds (30) is set by the chart and must be greater."
