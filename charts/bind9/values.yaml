# -- Number of Bind9 replicas. With `persistence.enabled` and a ReadWriteOnce volume, keep 1.
replicaCount: 1

# -- Images used when `image.repository` and `metrics.image.repository` are empty. `unxwares`:
# `ghcr.io/unxwares/bind9`, BIND built by UnxWares from the signed ISC release tarball with the build options, paths
# and user (`bind`, uid 53) of the official image, and `ghcr.io/unxwares/bind-exporter`, bind_exporter built from its
# sources (master branch, current Go toolchain and golang.org/x modules) on a distroless base, both rebuilt twice a
# week on current bases and published for amd64 and arm64 (https://github.com/UnxWares/helm/tree/main/images).
# `upstream`: the official ISC image `docker.io/internetsystemsconsortium/bind9` (linux/amd64 only, see
# `nodeSelector`) and the Prometheus community image `docker.io/prometheuscommunity/bind-exporter`.
imageProvider: unxwares  # @schema enum:[unxwares, upstream]

image:
  # -- Bind9 image repository. Empty: `ghcr.io/unxwares/bind9` or `docker.io/internetsystemsconsortium/bind9`, from
  # `imageProvider`.
  repository: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent  # @schema enum:[Always, IfNotPresent, Never]
  # -- Image tag. Empty: the chart appVersion (`9.20.30`, the BIND release) for the UnxWares image, its branch (`9.20`,
  # which ISC moves to each patch release) for the ISC image (a repository ending in `internetsystemsconsortium/bind9`).
  # `9.21` is ISC's development branch.
  tag: ""
  # -- Image digest (`sha256:...`). When set, it takes precedence over the tag.
  digest: ""

# -- Secrets for pulling images from a private registry.
imagePullSecrets: []
# -- Override the chart name.
nameOverride: ""
# -- Override the full resource names.
fullnameOverride: ""

serviceAccount:
  # -- Create a dedicated service account.
  create: true
  # -- Bind9 never talks to the Kubernetes API: the token is not mounted.
  automount: false
  # -- Service account annotations.
  annotations: {}
  # -- Service account name (generated when empty).
  name: ""

# -- Pod annotations.
podAnnotations: {}
# -- Pod labels.
podLabels: {}

# -- Pod security context. named runs as the `bind` user of the image (uid 53) from the start, without any
# capability: the `net.ipv4.ip_unprivileged_port_start` sysctl (a safe sysctl, allowed by the `restricted` Pod Security
# Standard) lets it bind port 53 in the pod's network namespace. Keep the sysctl if you override this value.
podSecurityContext:  # @schema skipProperties:true
  runAsNonRoot: true
  runAsUser: 53
  runAsGroup: 53
  fsGroup: 53
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
  sysctls:
    - name: net.ipv4.ip_unprivileged_port_start
      value: "53"

# -- Bind9 container security context: every capability dropped, read-only root filesystem.
securityContext:  # @schema skipProperties:true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  # -- Create the DNS service.
  enabled: true
  # -- Service annotations (e.g. MetalLB or cloud load balancer settings).
  annotations: {}
  # -- Service type.
  type: ClusterIP  # @schema enum:[ClusterIP, NodePort, LoadBalancer]
  # -- Load balancer IP, when supported by the provider.
  loadBalancerIP: ""
  # -- Source ranges allowed by the load balancer.
  loadBalancerSourceRanges: []
  # -- `Local` preserves client source IPs (needed by ACLs such as allow-transfer).
  externalTrafficPolicy: ""
  # -- Expose the rndc control port through the admin Service (`adminService`), never the DNS Service. Off by default:
  # rndc is an administrative channel.
  exposeRndc: false
  ports:
    # -- DNS TCP port.
    dnsTcp: 53
    # -- DNS UDP port.
    dnsUdp: 53
    # -- rndc port of the admin Service (only with `service.exposeRndc`).
    rndc: 953
    # -- Prometheus exporter port, in the pod and on the admin Service.
    metrics: 9119
    # -- NodePort for DNS over TCP.
    dnsTcpNodePort: null  # @schema type:[integer, null]
    # -- NodePort for DNS over UDP.
    dnsUdpNodePort: null  # @schema type:[integer, null]
    # -- NodePort for rndc, when `adminService.type` is NodePort or LoadBalancer.
    rndcNodePort: null  # @schema type:[integer, null]
    # -- NodePort for the metrics port, when `adminService.type` is NodePort or LoadBalancer.
    metricsNodePort: null  # @schema type:[integer, null]

# The rndc and metrics ports live on their own Service, `<fullname>-admin`, so that publishing DNS (LoadBalancer,
# NodePort) never publishes them. It exists when `service.exposeRndc` or `metrics.enabled` is set.
adminService:
  # -- Admin Service type. Keep it internal: rndc and the metrics are administrative ports.
  type: ClusterIP  # @schema enum:[ClusterIP, NodePort, LoadBalancer]
  # -- Admin Service annotations.
  annotations: {}

# -- Bind9 container resources.
resources:  # @schema skipProperties:true
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi

# -- Liveness probe (dig exits 0 as soon as the server answers, whatever the answer).
livenessProbe:  # @schema skipProperties:true
  exec:
    command:
      - dig
      - +time=2
      - +tries=1
      - "@127.0.0.1"
      - version.bind
      - txt
      - chaos
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
# -- Readiness probe.
readinessProbe:  # @schema skipProperties:true
  exec:
    command:
      - dig
      - +time=2
      - +tries=1
      - "@127.0.0.1"
      - version.bind
      - txt
      - chaos
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5

# -- Seconds named keeps answering after its pod is marked for deletion, before it gets SIGTERM (preStop hook). The pod
# leaves the Service endpoints while it stops: without this delay, queries still routed to it during a rolling update
# or a drain are refused. 0 removes the hook. The hook uses the `sleep` action on Kubernetes 1.30 and later, and runs
# `sleep` from the image on older clusters.
preStopSleepSeconds: 5  # @schema minimum:0
# -- Grace period of the pods: the preStop sleep, then the time named has to stop after SIGTERM. Must be greater than
# `preStopSleepSeconds`.
terminationGracePeriodSeconds: 30  # @schema minimum:0

autoscaling:
  # -- Enable the HorizontalPodAutoscaler (static zones only: no persistence).
  enabled: false
  # -- Minimum number of replicas.
  minReplicas: 1
  # -- Maximum number of replicas.
  maxReplicas: 10
  # -- Target average CPU utilization (%).
  targetCPUUtilizationPercentage: 80
  # -- Target average memory utilization (%). Empty: no memory target.
  targetMemoryUtilizationPercentage: null  # @schema type:[integer, null]

podDisruptionBudget:
  # -- Create a PodDisruptionBudget (useful with 2+ replicas).
  enabled: false
  # -- Minimum available pods.
  minAvailable: 1
  # -- Maximum unavailable pods (used instead of minAvailable when set).
  maxUnavailable: null  # @schema type:[integer, string, null]

metrics:
  # -- Run the Prometheus bind_exporter sidecar (reads the statistics channel on 127.0.0.1:8053).
  enabled: false

  # -- Statistics groups to collect (`tasks` is deprecated since bind_exporter 0.8.0).
  statsGroups:
    - server
    - view

  image:
    # -- Exporter image repository. Empty: `ghcr.io/unxwares/bind-exporter` or `docker.io/prometheuscommunity/bind-exporter`,
    # from `imageProvider`.
    repository: ""
    # -- Exporter image pull policy.
    pullPolicy: IfNotPresent  # @schema enum:[Always, IfNotPresent, Never]
    # -- Exporter image tag. Empty: `0.8.0-62-gbafd56f` (unxwares: the master commit bafd56f, 62 commits after v0.8.0)
    # or `master@sha256:a1f46e6abf8d284a158a1ba0e3275bc2e17f9119ec227f18bdb20019d24b3bcf` (upstream: the master build of
    # 2026-10-14, pinned by digest). v0.8.0, the latest release (November 2024), was built with an old Go toolchain.
    tag: ""
    # -- Exporter image digest (takes precedence over the tag).
    digest: ""

  # -- Exporter security context (both images run as `nobody`).
  securityContext:  # @schema skipProperties:true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # -- Exporter liveness probe.
  livenessProbe:  # @schema skipProperties:true
    failureThreshold: 3
    httpGet:
      path: /
      port: metrics
      scheme: HTTP
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
  # -- Exporter readiness probe.
  readinessProbe:  # @schema skipProperties:true
    failureThreshold: 3
    httpGet:
      path: /
      port: metrics
      scheme: HTTP
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1

  # -- Exporter resources.
  resources:  # @schema skipProperties:true
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor on the admin Service (requires `metrics.enabled`; rendered only when the CRD exists).
    enabled: false
    # -- Extra ServiceMonitor labels (e.g. `release: kube-prometheus-stack`).
    labels: {}
    # -- ServiceMonitor endpoints.
    endpoints:
      - port: metrics
        scheme: http

# General Bind9 configuration
bind:
  # -- Extra arguments passed to named (after `-g`).
  args: []

  # -- named.conf content. The default is a minimal authoritative-only server: add your zones (see `bind.zones`).
  # Keep `directory "/var/cache/bind";`: it is the only writable working directory.
  # https://bind9.readthedocs.io/en/stable/reference.html
  namedConf: |
    options {
      directory "/var/cache/bind";
      listen-on { any; };
      listen-on-v6 { any; };
      // Authoritative only: no recursion, no zone transfers unless allowed per zone.
      recursion no;
      allow-transfer { none; };
      // Do not reveal the version in CH TXT version.bind queries.
      version none;
    };
    # zone "example.com" {
    #   type primary;
    #   file "/etc/bind/example-com.zone";
    # };

  # -- Zone files, mounted as `/etc/bind/<key>.zone`.
  zones: {}
    # example-com: |
    #   $TTL 3D
    #   @       IN      SOA     ns1.example.com. hostmaster.example.com. (
    #                           2026102001 ; Serial
    #                           3H ; Refresh
    #                           15 ; Retry
    #                           1W ; Expire
    #                           3H ; Negative Cache TTL
    #   )
    #   @       IN      NS      ns1.example.com.
    #   ns1     IN      A       192.0.2.1
    #   www     IN      CNAME   example.com.

# Persistence for /var/lib/bind (dynamic zones, journals, DNSSEC keys)
persistence:
  # -- Persist /var/lib/bind in a PVC. Without it an emptyDir is used.
  enabled: false
  # -- Use an existing PVC.
  existingClaim: ""
  # -- Access mode.
  accessMode: ReadWriteOnce
  # -- Volume size.
  size: 1Gi
  # -- Storage class (empty uses the cluster default).
  storageClass: ""
  # -- Size limit of the emptyDir used when persistence is disabled.
  emptyDirSizeLimit: ""

# -- Additional volumes on the pod.
volumes: []
  # - name: custom-config
  #   configMap:
  #     name: custom-config

# -- Additional volumeMounts on the Bind9 container.
volumeMounts: []
  # - name: custom-config
  #   mountPath: /etc/bind/custom.conf
  #   subPath: custom.conf
  #   readOnly: true

networkPolicy:
  # -- Create a NetworkPolicy: DNS stays open, rndc and metrics only accept the peers below.
  enabled: false
  # -- Peers allowed to reach rndc and metrics (e.g. your Prometheus namespace).
  adminAllowedFrom: []

# -- Priority class of the pods.
priorityClassName: ""
# -- Node selector of the pods and of the `helm test` pod. When named runs the ISC image (a repository ending in
# `internetsystemsconsortium/bind9`, as with `imageProvider: upstream`), published for linux/amd64 only, the chart
# adds `kubernetes.io/arch: amd64` unless this map sets `kubernetes.io/arch`. The UnxWares image runs on amd64 and
# arm64.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity rules.
affinity: {}
# -- Topology spread constraints.
topologySpreadConstraints: []
