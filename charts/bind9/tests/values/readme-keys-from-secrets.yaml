# README section "rndc and keys from Secrets", as written in the README.
volumes:
  - name: bind-keys
    secret:
      secretName: bind9-keys
      defaultMode: 0440
volumeMounts:
  - name: bind-keys
    mountPath: /etc/bind/keys
    readOnly: true
bind:
  namedConf: |
    include "/etc/bind/keys/rndc.key";
    include "/etc/bind/keys/transfer.key";
    controls {
      inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
    };
    options {
      directory "/var/cache/bind";
      listen-on { any; };
      listen-on-v6 { any; };
      recursion no;
      allow-transfer { none; };
      version none;
    };
    zone "example.com" {
      type primary;
      file "/etc/bind/example-com.zone";
      allow-transfer { key "transfer-key"; };
    };
