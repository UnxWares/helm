suite: autoscaling and disruption budget
templates:
  # deployment.yaml includes configmap.yaml for its checksum annotation
  - configmap.yaml
  - deployment.yaml
  - hpa.yaml
  - pdb.yaml
release:
  name: my-dns
  namespace: dns-system
tests:
  - it: renders neither by default
    asserts:
      - hasDocuments:
          count: 0
        template: hpa.yaml
      - hasDocuments:
          count: 0
        template: pdb.yaml

  - it: runs replicaCount replicas
    template: deployment.yaml
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: scales the Deployment on CPU and leaves the replica count to the HPA
    set:
      autoscaling.enabled: true
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
        template: hpa.yaml
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: my-dns-bind9
        template: hpa.yaml
      - equal:
          path: spec.minReplicas
          value: 1
        template: hpa.yaml
      - equal:
          path: spec.maxReplicas
          value: 10
        template: hpa.yaml
      - equal:
          path: spec.metrics
          value:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 80
        template: hpa.yaml
      - notExists:
          path: spec.replicas
        template: deployment.yaml

  - it: adds a memory target when set
    template: hpa.yaml
    set:
      autoscaling.enabled: true
      autoscaling.targetMemoryUtilizationPercentage: 75
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 2
      - equal:
          path: spec.metrics[1].resource
          value:
            name: memory
            target:
              type: Utilization
              averageUtilization: 75

  - it: keeps one pod available by default
    template: pdb.yaml
    set:
      podDisruptionBudget.enabled: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: bind9
            app.kubernetes.io/instance: my-dns

  - it: uses maxUnavailable instead of minAvailable when set
    template: pdb.yaml
    set:
      podDisruptionBudget.enabled: true
      podDisruptionBudget.maxUnavailable: 1
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable
