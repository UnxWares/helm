apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bind9.fullname" . }}
  labels:
    {{- include "bind9.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if and .Values.persistence.enabled (eq .Values.persistence.accessMode "ReadWriteOnce") }}
  # A ReadWriteOnce volume cannot be attached to the old and the new pod at the same time.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "bind9.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # force pod reload on config change
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "bind9.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bind9.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "bind9.image" (dict "image" .Values.image "default" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /var/cache/bind
          command: ["/usr/sbin/named"]
          args:
            # Bind port 53 as root, then run as the unprivileged bind user (uid 53).
            - "-u"
            - "bind"
            # Foreground, logs to stderr.
            - "-g"
          {{- with .Values.bind.args }}
            {{- toYaml . | nindent 12 }}
          {{- end }}

          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: rndc
              containerPort: 953
              protocol: TCP

          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            - name: bind-config
              mountPath: /etc/bind/named.conf
              subPath: named.conf
              readOnly: true
            {{- range $name, $_ := .Values.bind.zones }}
            - name: bind-config
              mountPath: /etc/bind/{{ $name }}.zone
              subPath: {{ $name }}.zone
              readOnly: true
            {{- end }}
            - name: bind-data
              mountPath: /var/lib/bind
            - name: bind-cache
              mountPath: /var/cache/bind
            - name: bind-run
              mountPath: /run/named
            - name: tmp
              mountPath: /tmp
            {{- with .Values.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: {{ .Chart.Name }}-exporter
          {{- with .Values.metrics.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "bind9.image" (dict "image" .Values.metrics.image "default" .Values.metrics.image.tag) | quote }}
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          args:
            - --bind.stats-url=http://127.0.0.1:8053/
            - --bind.stats-groups={{ .Values.metrics.statsGroups | join "," }}
            - --web.listen-address=:{{ .Values.service.ports.metrics }}
          ports:
            - name: metrics
              containerPort: {{ .Values.service.ports.metrics }}
              protocol: TCP
          {{- with .Values.metrics.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.metrics.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.metrics.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: bind-config
          configMap:
            name: {{ include "bind9.fullname" . }}-config

        {{- if .Values.persistence.enabled }}
        - name: bind-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-pvc" (include "bind9.fullname" .)) }}
        {{- else }}
        - name: bind-data
          {{- if .Values.persistence.emptyDirSizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.persistence.emptyDirSizeLimit }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        # named working directory (managed keys, cache dumps) and pid file
        - name: bind-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: bind-run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        {{- with .Values.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
