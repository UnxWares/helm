{{- if .Values.service.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "bind9.fullname" . }}-test-dns
  labels:
    {{- include "bind9.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 53
    runAsGroup: 53
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: dig
      image: {{ include "bind9.image" (dict "image" .Values.image "default" .Chart.AppVersion) | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      # dig exits 0 when the server answers over UDP and TCP (whatever the rcode), 9 when it does not.
      command:
        - sh
        - -ec
        - |
          dig +time=3 +tries=2 @{{ include "bind9.fullname" . }} -p {{ .Values.service.ports.dnsUdp }} version.bind txt chaos
          dig +tcp +time=3 +tries=2 @{{ include "bind9.fullname" . }} -p {{ .Values.service.ports.dnsTcp }} version.bind txt chaos
{{- end }}
