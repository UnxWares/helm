{{- if .Values.service.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "bind9.fullname" . }}-test-dns
  labels:
    {{- include "bind9.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /* Same image as named: same architecture constraint. */}}
  {{- with include "bind9.nodeSelector" . }}
  nodeSelector:
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 53
    runAsGroup: 53
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: dig
      image: {{ include "bind9.namedImage" . | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      # dig exits 0 when the server answers over UDP and TCP (whatever the rcode), 9 when it does not.
      command:
        - sh
        - -ec
        - |
          # Right after an install the Service may not be programmed on the node yet: retry for up to a minute.
          query() {
            n=0
            until dig "$@" version.bind txt chaos; do
              n=$((n + 1))
              [ "$n" -lt 12 ] || return 1
              sleep 5
            done
          }
          query +time=3 +tries=1 @{{ include "bind9.fullname" . }} -p {{ .Values.service.ports.dnsUdp }}
          query +tcp +time=3 +tries=1 @{{ include "bind9.fullname" . }} -p {{ .Values.service.ports.dnsTcp }}
{{- end }}
