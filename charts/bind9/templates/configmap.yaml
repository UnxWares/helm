apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bind9.fullname" . }}-config
  labels:
    {{- include "bind9.labels" . | nindent 4 }}

data:
  named.conf: |
    {{- if .Values.metrics.enabled }}
    statistics-channels {
      inet 127.0.0.1 port 8053 allow { 127.0.0.1; };
    };
    {{- end }}
    {{- .Values.bind.namedConf | nindent 4 }}

  {{- range $name, $zone := .Values.bind.zones }}
  {{ $name }}.zone: |
    {{- $zone | nindent 4 }}
  {{- end }}
