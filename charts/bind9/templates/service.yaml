{{- if .Values.service.enabled }}
{{- $nodePorts := has .Values.service.type (list "NodePort" "LoadBalancer") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bind9.fullname" . }}
  labels:
    {{- include "bind9.labels" . | nindent 4 }}
{{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- if and .Values.service.externalTrafficPolicy $nodePorts }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - name: dns-tcp
      port: {{ .Values.service.ports.dnsTcp }}
      targetPort: dns-tcp
      protocol: TCP
      {{- if and .Values.service.ports.dnsTcpNodePort $nodePorts }}
      nodePort: {{ .Values.service.ports.dnsTcpNodePort }}
      {{- end }}

    - name: dns-udp
      port: {{ .Values.service.ports.dnsUdp }}
      targetPort: dns-udp
      protocol: UDP
      {{- if and .Values.service.ports.dnsUdpNodePort $nodePorts }}
      nodePort: {{ .Values.service.ports.dnsUdpNodePort }}
      {{- end }}
    {{- /* rndc and metrics are on the admin Service (service-admin.yaml): a public DNS Service never publishes them. */}}
  selector:
    {{- include "bind9.selectorLabels" . | nindent 4 }}
{{- end }}
