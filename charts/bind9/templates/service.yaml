apiVersion: v1
kind: Service
metadata:
  name: {{ include "bind9.fullname" . }}
  labels:
    {{- include "bind9.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: dns-tcp
      port: {{ .Values.service.ports.dnsTcp }}
      targetPort: dns-tcp
      protocol: TCP
      {{- if .Values.service.ports.dnsTcpNodePort }}
      nodePort: {{ .Values.service.ports.dnsTcpNodePort }}
      {{- end }}

    - name: dns-udp
      port: {{ .Values.service.ports.dnsUdp }}
      targetPort: dns-udp
      protocol: UDP
      {{- if .Values.service.ports.dnsUdpNodePort }}
      nodePort: {{ .Values.service.ports.dnsUdpNodePort }}
      {{- end }}

    - name: rndc
      port: {{ .Values.service.ports.rndc }}
      targetPort: rndc
      protocol: TCP
      {{- if .Values.service.ports.rndcNodePort }}
      nodePort: {{ .Values.service.ports.rndcNodePort }}
      {{- end }}

  selector:
    {{- include "bind9.selectorLabels" . | nindent 4 }}
