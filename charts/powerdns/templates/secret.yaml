{{- $db := include "powerdns.sqlBackend" . | fromYaml }}
{{- $apiKey := and .Values.api.enabled (not .Values.api.existingSecret) }}
{{- $dbPassword := and $db (not $db.existingSecret) }}
{{- if or $apiKey $dbPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "powerdns.secretName" . }}
  labels:
    {{- include "powerdns.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $apiKey }}
  api-key: {{ include "powerdns.apiKey" . | b64enc | quote }}
  {{- end }}
  {{- if $dbPassword }}
  db-password: {{ $db.password | b64enc | quote }}
  {{- end }}
{{- end }}
