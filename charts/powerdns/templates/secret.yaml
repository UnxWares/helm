{{- $db := include "powerdns.sqlBackend" . | fromYaml }}
{{- $apiKey := and .Values.api.enabled (not .Values.api.existingSecret) }}
{{- $dbPassword := and $db (not $db.existingSecret) }}
{{- if or $apiKey $dbPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "powerdns.secretName" . }}
  labels:
    {{- include "powerdns.labels" . | nindent 4 }}
  {{- if and $apiKey (not .Values.api.key) }}
  annotations:
    # Holds the generated API key: it survives helm uninstall (like the PVC), so that a later install of the same
    # release reuses it and the API clients (ExternalDNS...) keep working.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- if $apiKey }}
  api-key: {{ include "powerdns.apiKey" . | b64enc | quote }}
  {{- end }}
  {{- if $dbPassword }}
  db-password: {{ $db.password | b64enc | quote }}
  {{- end }}
{{- end }}
