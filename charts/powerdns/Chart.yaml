apiVersion: v2
name: powerdns
description: PowerDNS Authoritative Server with its REST API, SQLite/PostgreSQL/MySQL backends and an optional PowerDNS Recursor, hardened for Kubernetes.
type: application
version: 2026.10.5
appVersion: "5.1.5"
kubeVersion: ">=1.27.0-0"
home: https://github.com/UnxWares/helm/tree/main/charts/powerdns
icon: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/common/powerdns-logo-500px.png

sources:
  - https://github.com/PowerDNS/pdns
  - https://hub.docker.com/r/powerdns/pdns-auth-51
  - https://hub.docker.com/r/powerdns/pdns-recursor-54
  - https://github.com/UnxWares/helm/tree/main/charts/powerdns

keywords:
  - dns
  - powerdns
  - pdns
  - authoritative-dns
  - recursor
  - dnssec
  - external-dns

maintainers:
  - name: David Gheghea
    email: david.gheghea@unxwares.com
    url: https://github.com/UnxWares
  - name: Baptiste Gosselin
    email: baptiste.gosselin@unxwares.com
    url: https://github.com/UnxWares

annotations:
  artifacthub.io/displayName: PowerDNS
  artifacthub.io/category: networking
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/UnxWares/helm/tree/main/charts/powerdns
    - name: PowerDNS documentation
      url: https://doc.powerdns.com/
    - name: Support
      url: https://github.com/UnxWares/helm/issues
  artifacthub.io/images: |
    - name: pdns-auth
      image: ghcr.io/unxwares/pdns-auth:5.1.5
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: "Default images move to ghcr.io/unxwares/pdns-auth and pdns-recursor (imageProvider: unxwares): the same PowerDNS versions built from the release tarballs on current Alpine bases and rebuilt every week, with the same user, paths and startup script. imageProvider: upstream keeps the official Debian images."
      links:
        - name: UnxWares images
          url: https://github.com/UnxWares/helm/tree/main/images
    - kind: security
      description: Known vulnerabilities of the images (Trivy) drop from 539 to 0 for the authoritative server and from 352 to 0 for the recursor.
    - kind: fixed
      description: "The recursor answered SERVFAIL (EDE 10, RRSIGs missing) for recursor.authoritativeZones without a public DNSSEC chain of trust: they are now negative trust anchors, unless recursor.validateAuthoritativeZones is true."
    - kind: changed
      description: "The PostgreSQL client of the gpgsql schema init follows imageProvider (ghcr.io/unxwares/postgres by default)."
  artifacthub.io/signKey: |
    fingerprint: 7902E52EA435EF27C6432E5378D6B532C599DA9B
    url: https://helm.unxwares.studio/pgp-public-key.asc
