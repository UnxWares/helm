apiVersion: v2
name: powerdns
description: PowerDNS Authoritative Server with its REST API, SQLite/PostgreSQL/MySQL backends and an optional PowerDNS Recursor, hardened for Kubernetes.
type: application
version: 2026.11.2
appVersion: "5.1.5"
kubeVersion: ">=1.27.0-0"
home: https://github.com/UnxWares/helm/tree/main/charts/powerdns
icon: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/common/powerdns-logo-500px.png

sources:
  - https://github.com/PowerDNS/pdns
  - https://hub.docker.com/r/powerdns/pdns-auth-51
  - https://hub.docker.com/r/powerdns/pdns-recursor-54
  - https://github.com/UnxWares/helm/tree/main/charts/powerdns

keywords:
  - dns
  - powerdns
  - pdns
  - authoritative-dns
  - recursor
  - dnssec
  - external-dns

maintainers:
  - name: David Gheghea
    email: david.gheghea@unxwares.com
    url: https://github.com/UnxWares
  - name: Baptiste Gosselin
    email: baptiste.gosselin@unxwares.com
    url: https://github.com/UnxWares

annotations:
  artifacthub.io/displayName: PowerDNS
  artifacthub.io/category: networking
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/UnxWares/helm/tree/main/charts/powerdns
    - name: PowerDNS documentation
      url: https://doc.powerdns.com/
    - name: Support
      url: https://github.com/UnxWares/helm/issues
  artifacthub.io/images: |
    - name: pdns-auth
      image: ghcr.io/unxwares/pdns-auth:5.1.5
    - name: pdns-recursor
      image: ghcr.io/unxwares/pdns-recursor:5.4.9
    - name: postgresql-client
      image: ghcr.io/unxwares/postgresql-client:18
    - name: mysql-client
      image: ghcr.io/unxwares/mysql-client:8.4
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: security
      description: "The recursor webserver (API, /metrics) moves from the recursor DNS Service to its own ClusterIP Service, <fullname>-recursor-api: a LoadBalancer recursor Service no longer publishes it."
    - kind: security
      description: "gmysql schema init: the MySQL client options file, which holds the password, is written to a memory-backed /tmp private to the init container instead of the disk-backed /tmp shared with the server; the password is escaped, so quotes and backslashes no longer break it."
    - kind: security
      description: "The Secret holding a generated API key is kept on uninstall (helm.sh/resource-policy: keep), so that a reinstall reuses the key; the schema init container only gets the database password and the helm test pod only the API key."
    - kind: fixed
      description: "The schema init container mounts extraVolumeMounts, so a CA given in backend.gpgsql.extraConnectionParameters (sslrootcert) works with the schema init enabled."
    - kind: fixed
      description: "gmysql with the UnxWares image: the server connects to a MySQL server with a self-signed certificate (the default of MySQL), encrypted without checking the certificate like the MySQL client; backend.gmysql.verifyServerCertificate: true keeps the check."
    - kind: fixed
      description: "An IPv6 address of the authoritative Service (service.clusterIP or the injected variable) is written in brackets in the recursor forwarders."
    - kind: changed
      description: "Schema init images: ghcr.io/unxwares/postgresql-client:18 and ghcr.io/unxwares/mysql-client:8.4 with imageProvider: unxwares (the clients alone), docker.io/library/postgres:18.6-alpine and docker.io/library/mysql:8.4.13 with upstream. backend.schemaInit.mysqlImage defaults to empty."
    - kind: fixed
      description: "The NOTES show the images actually deployed (tag or digest); autoscaling.targetMemoryUtilizationPercentage is a documented value."
    - kind: added
      description: "End-to-end test in CI on SQLite with the recursor, PostgreSQL over verified TLS and MySQL, in a namespace that enforces the restricted Pod Security Standard: the API refuses wrong keys and manages zones, the records are answered by the authoritative server and the recursor, and survive a restart."
  artifacthub.io/signKey: |
    fingerprint: 7902E52EA435EF27C6432E5378D6B532C599DA9B
    url: https://helm.unxwares.studio/pgp-public-key.asc
