apiVersion: v2
name: powerdns
description: PowerDNS Authoritative Server with its REST API, SQLite/PostgreSQL/MySQL backends and an optional PowerDNS Recursor, hardened for Kubernetes.
type: application
version: 2026.11.4
appVersion: "5.1.5"
kubeVersion: ">=1.27.0-0"
home: https://github.com/UnxWares/helm/tree/main/charts/powerdns
icon: https://raw.githubusercontent.com/PowerDNS/pdns/master/docs/common/powerdns-logo-500px.png

sources:
  - https://github.com/PowerDNS/pdns
  - https://hub.docker.com/r/powerdns/pdns-auth-51
  - https://hub.docker.com/r/powerdns/pdns-recursor-54
  - https://github.com/UnxWares/helm/tree/main/charts/powerdns

keywords:
  - dns
  - powerdns
  - pdns
  - authoritative-dns
  - recursor
  - dnssec
  - external-dns

maintainers:
  - name: David Gheghea
    email: david.gheghea@unxwares.com
    url: https://github.com/UnxWares
  - name: Baptiste Gosselin
    email: baptiste.gosselin@unxwares.com
    url: https://github.com/UnxWares

annotations:
  artifacthub.io/displayName: PowerDNS
  artifacthub.io/category: networking
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/UnxWares/helm/tree/main/charts/powerdns
    - name: PowerDNS documentation
      url: https://doc.powerdns.com/
    - name: Support
      url: https://github.com/UnxWares/helm/issues
  artifacthub.io/images: |
    - name: pdns-auth
      image: ghcr.io/unxwares/pdns-auth:5.1.5
    - name: pdns-recursor
      image: ghcr.io/unxwares/pdns-recursor:5.4.9
    - name: postgresql-client
      image: ghcr.io/unxwares/postgresql-client:18
    - name: mysql-client
      image: ghcr.io/unxwares/mysql-client:8.4
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: fixed
      description: "An empty recursor.image.tag without recursor.image.digest rendered an image reference without tag (ghcr.io/unxwares/pdns-recursor:), which Kubernetes refuses: the chart now stops with the value to set (recursor.image.tag or recursor.image.digest). The other images were already right: an empty image.tag follows the chart appVersion, and empty client or helm test images fall back to their defaults."
  artifacthub.io/signKey: |
    fingerprint: 7902E52EA435EF27C6432E5378D6B532C599DA9B
    url: https://helm.unxwares.studio/pgp-public-key.asc
