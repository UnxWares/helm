suite: persistence of the SQLite database
templates:
  # deployment.yaml includes configmap.yaml for its checksum annotation
  - configmap.yaml
  - deployment.yaml
  - pvc.yaml
release:
  name: dns
  namespace: dns
tests:
  - it: creates a 1Gi ReadWriteOnce claim kept on uninstall
    template: pvc.yaml
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: dns-powerdns
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: spec.accessModes
          value:
            - ReadWriteOnce
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
      - notExists:
          path: spec.storageClassName

  - it: sets the storage class, size and annotations
    template: pvc.yaml
    set:
      persistence:
        size: 5Gi
        storageClass: standard
        annotations:
          example.com/backup: "true"
    asserts:
      - equal:
          path: spec.storageClassName
          value: standard
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi
      - equal:
          path: metadata.annotations["example.com/backup"]
          value: "true"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: mounts the claim on the directory of the database
    template: deployment.yaml
    set:
      backend.gsqlite3.database: /var/lib/powerdns/zones/pdns.sqlite3
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: dns-powerdns
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/lib/powerdns/zones

  - it: mounts an existing claim and creates none
    set:
      persistence.existingClaim: my-pdns-data
    asserts:
      - hasDocuments:
          count: 0
        template: pvc.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: my-pdns-data
        template: deployment.yaml

  - it: keeps the database in an emptyDir without persistence, still recreated
    set:
      persistence.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: pvc.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}
        template: deployment.yaml
      - notExists:
          path: spec.strategy
        template: deployment.yaml

  - it: creates no claim and no data volume with a SQL backend
    values:
      - values/gpgsql.yaml
    asserts:
      - hasDocuments:
          count: 0
        template: pvc.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: data
          any: true
        template: deployment.yaml
