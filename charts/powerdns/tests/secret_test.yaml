suite: chart Secret
templates:
  - secret.yaml
release:
  name: dns
  namespace: dns
tests:
  - it: generates a 40-character API key at install and keeps the Secret on uninstall
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: dns-powerdns
      - equal:
          path: type
          value: Opaque
      - matchRegex:
          path: data["api-key"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{40}$
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - notExists:
          path: data["db-password"]

  - it: keeps the API key already stored in the release Secret at upgrade
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: dns-powerdns
            namespace: dns
          data:
            api-key: a2VwdC1mcm9tLXRoZS1wcmV2aW91cy1yZWxlYXNl  # kept-from-the-previous-release
    asserts:
      - equal:
          path: data["api-key"]
          value: kept-from-the-previous-release
          decodeBase64: true

  - it: ignores a Secret of another release
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: other-powerdns
            namespace: dns
          data:
            api-key: a2VwdC1mcm9tLXRoZS1wcmV2aW91cy1yZWxlYXNl
    asserts:
      - matchRegex:
          path: data["api-key"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{40}$

  - it: generates a new key when the release Secret has none (for instance only a database password)
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: dns-powerdns
            namespace: dns
          data:
            db-password: ZGItcGFzcw==
    asserts:
      - matchRegex:
          path: data["api-key"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{40}$

  - it: stores the API key given in the values, without the keep policy
    set:
      api.key: an-api-key-given-by-the-user
    asserts:
      - equal:
          path: data["api-key"]
          value: an-api-key-given-by-the-user
          decodeBase64: true
      - notExists:
          path: metadata.annotations

  - it: renders no Secret when the API key comes from an existing Secret and the backend is SQLite
    set:
      api.existingSecret: powerdns-api-key
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Secret without the API on SQLite
    set:
      api.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: stores the inline database password next to the generated key
    values:
      - values/gpgsql.yaml
    asserts:
      - equal:
          path: data["db-password"]
          value: db-pass
          decodeBase64: true
      - exists:
          path: data["api-key"]

  - it: stores only the database password when the API key comes from an existing Secret
    values:
      - values/gmysql.yaml
    set:
      api.existingSecret: powerdns-api-key
    asserts:
      - equal:
          path: data["db-password"]
          value: db-pass
          decodeBase64: true
      - notExists:
          path: data["api-key"]
      - notExists:
          path: metadata.annotations

  - it: stores no database password with an existing database Secret
    values:
      - values/gpgsql.yaml
    set:
      backend.gpgsql.existingSecret: pdns-db
    asserts:
      - notExists:
          path: data["db-password"]

  - it: stores no database password for SQLite, even if one is set for another backend
    set:
      backend.gpgsql.password: unused
    asserts:
      - notExists:
          path: data["db-password"]
