suite: preStop sleep and grace period
templates:
  # the Deployments include their ConfigMap for the checksum annotation
  - configmap.yaml
  - deployment.yaml
  - recursor/configmap.yaml
  - recursor/deployment.yaml
release:
  name: dns
  namespace: dns
values:
  - values/recursor.yaml
# The native sleep action is enabled by default since Kubernetes 1.30 (beta, GA in 1.34).
capabilities:
  majorVersion: "1"
  minorVersion: "31"
tests:
  - it: keeps the server and the recursor answering 5 seconds with the sleep action, within a 30 second grace period
    templates:
      - deployment.yaml
      - recursor/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle
          value:
            preStop:
              sleep:
                seconds: 5
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30

  - it: uses the sleep action on Kubernetes 1.30, the first version that enables it by default
    template: deployment.yaml
    capabilities:
      majorVersion: "1"
      minorVersion: "30"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 5
      - notExists:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec

  - it: runs sleep from the image on Kubernetes 1.29 and older, where the sleep action is off
    templates:
      - deployment.yaml
      - recursor/deployment.yaml
    capabilities:
      majorVersion: "1"
      minorVersion: "29"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle
          value:
            preStop:
              exec:
                command: ["sleep", "5"]

  - it: sets the server and the recursor separately
    set:
      preStopSleepSeconds: 10
      terminationGracePeriodSeconds: 45
      recursor:
        preStopSleepSeconds: 3
        terminationGracePeriodSeconds: 20
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 10
        template: deployment.yaml
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 45
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 3
        template: recursor/deployment.yaml
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 20
        template: recursor/deployment.yaml

  - it: removes the hooks with 0 and keeps the grace periods
    templates:
      - deployment.yaml
      - recursor/deployment.yaml
    set:
      preStopSleepSeconds: 0
      recursor.preStopSleepSeconds: 0
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30

  - it: accepts any grace period when the hook is off
    template: deployment.yaml
    set:
      preStopSleepSeconds: 0
      terminationGracePeriodSeconds: 0
    asserts:
      - notFailedTemplate: {}
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0

  - it: refuses a server grace period that is not longer than the sleep
    template: deployment.yaml
    set:
      preStopSleepSeconds: 30
    asserts:
      - failedTemplate:
          errorMessage: terminationGracePeriodSeconds (30) must be greater than preStopSleepSeconds (30)

  - it: refuses a recursor grace period shorter than the sleep, naming the recursor values
    template: recursor/deployment.yaml
    set:
      recursor:
        preStopSleepSeconds: 10
        terminationGracePeriodSeconds: 5
    asserts:
      - failedTemplate:
          errorMessage: recursor.terminationGracePeriodSeconds (5) must be greater than recursor.preStopSleepSeconds (10)

  - it: keeps the hook with the gpgsql backend and the official images (both have sleep)
    template: deployment.yaml
    values:
      - values/gpgsql.yaml
    set:
      imageProvider: upstream
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 5
      - notExists:
          path: spec.template.spec.initContainers[0].lifecycle
      - notExists:
          path: spec.template.spec.initContainers[1].lifecycle
