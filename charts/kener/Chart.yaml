  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/UnxWares/helm/tree/main/charts/kener
    - name: Kener documentation
      url: https://kener.ing/docs/v4/setup/environment-variables
    - name: Support
      url: https://github.com/UnxWares/helm/issues
  artifacthub.io/images: |
    - name: kener
      image: docker.io/rajnandan1/kener:4.1.10-alpine
    - name: kener-debian
      image: docker.io/rajnandan1/kener:4.1.10
    - name: kener-status
      image: docker.io/rajnandan1/kener:4.1.10-status-alpine
    - name: kener-status-debian
      image: docker.io/rajnandan1/kener:4.1.10-status
    - name: valkey
      image: docker.io/valkey/valkey:9.1.3-alpine
  artifacthub.io/changes: |
    - kind: security
      description: "Kener 4.1.10. 4.1.9 fixes an authentication bypass: from 4.0.0 to 4.1.8, a percent-encoded path such as /%61pi/v4/monitors reached every /api/v4 route without an API key. If your instance was reachable from an untrusted network, follow the steps of the upstream 4.1.9 changelog."
      links:
        - name: Kener 4.1.9 changelog
          url: https://kener.ing/docs/v4/changelogs/v4.1.9
    - kind: security
      description: Kener 4.1.10 no longer signs sessions with a built-in fallback key when KENER_SECRET_KEY is empty. The chart always sets one (generated when kener.secretKey is empty), so there is nothing to change.
    - kind: changed
      description: Bundled Valkey 9.1.3.
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/signKey: |
    fingerprint: 7902E52EA435EF27C6432E5378D6B532C599DA9B
    url: https://helm.unxwares.studio/pgp-public-key.asc
