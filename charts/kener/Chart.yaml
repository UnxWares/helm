apiVersion: v2
name: kener
description: Kener 4 status page with SQLite/PostgreSQL/MySQL, a bundled hardened Valkey for its queues, and secure defaults for Kubernetes.
type: application
version: 2026.11.3
appVersion: "4.1.11"
kubeVersion: ">=1.27.0-0"
home: https://github.com/UnxWares/helm/tree/main/charts/kener
icon: https://kener.ing/logo.png

sources:
  - https://github.com/rajnandan1/kener
  - https://hub.docker.com/r/rajnandan1/kener
  - https://github.com/valkey-io/valkey
  - https://github.com/UnxWares/helm/tree/main/charts/kener

keywords:
  - kener
  - status
  - status-page
  - uptime
  - monitoring
  - incident

maintainers:
  - name: David Gheghea
    email: david.gheghea@unxwares.com
    url: https://github.com/UnxWares
  - name: Baptiste Gosselin
    email: baptiste.gosselin@unxwares.com
    url: https://github.com/UnxWares

annotations:
  artifacthub.io/displayName: Kener
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/UnxWares/helm/tree/main/charts/kener
    - name: Kener documentation
      url: https://kener.ing/docs/v4/setup/environment-variables
    - name: Support
      url: https://github.com/UnxWares/helm/issues
  artifacthub.io/images: |
    - name: kener
      image: docker.io/rajnandan1/kener:4.1.11-alpine
    - name: valkey
      image: docker.io/valkey/valkey:9.1.3-alpine
  artifacthub.io/changes: |
    - kind: fixed
      description: "The chart Secret is kept on uninstall (helm.sh/resource-policy: keep), like the SQLite PVC: a new install reads the generated KENER_SECRET_KEY back, so sessions and API keys keep working."
    - kind: fixed
      description: "podDisruptionBudget.enabled is refused with SQLite, and when minAvailable is not lower than the number of replicas: such a budget blocked node drains."
    - kind: fixed
      description: "An empty redis.image.tag no longer falls back to a Valkey tag hidden in the templates: the chart asks for a tag or a digest."
    - kind: added
      description: "proxy.existingSecret (keys existingSecretHttpProxyKey and existingSecretHttpsProxyKey) reads HTTP_PROXY and HTTPS_PROXY from your own Secret."
    - kind: added
      description: "End-to-end test in CI: first account and login, API key, monitor created through the REST API and run from the queue, status page and badge, Valkey password and NetworkPolicies, then what a new install keeps."
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/signKey: |
    fingerprint: 7902E52EA435EF27C6432E5378D6B532C599DA9B
    url: https://helm.unxwares.studio/pgp-public-key.asc
