  artifacthub.io/changes: |
    - kind: security
      description: "Kener 4.2.0 moves nodemailer (7 to 10), sharp (0.34 to 0.35, libvips, libheif and librsvg in its prebuilt binaries) and glob (13 to 14, with minimatch 11) past their advisories: npm audit of the production dependencies goes from 2 high and 3 moderate findings to none."
      links:
        - name: Kener 4.2.0
          url: https://github.com/rajnandan1/kener/releases/tag/v4.2.0
        - name: rajnandan1/kener#916
          url: https://github.com/rajnandan1/kener/pull/916
    - kind: security
      description: "Custom monitor eval code (API, Ping, TCP and GameDig monitors) no longer runs inside the Kener server process, where it could read the container environment (KENER_SECRET_KEY, DATABASE_URL, REDIS_URL...), its files and the network, without a time limit. Kener 4.2.1 runs each eval in a QuickJS sandbox compiled to WebAssembly, in its own short-lived Node.js process with only TZ from the environment, stopped after 10 seconds, at most 2 at a time. It works under the chart hardening as is (no writable path, capability or variable added), and the end-to-end test now checks it. Its 256 MB memory limit does not bound the eval process yet: an eval that allocates without bound still gets Kener OOM-killed (see Monitor eval code in the README)."
      links:
        - name: Kener 4.2.1
          url: https://github.com/rajnandan1/kener/releases/tag/v4.2.1
        - name: Custom eval sandbox
          url: https://kener.ing/docs/v4/monitors/overview#eval-sandbox
    - kind: changed
      description: "Kener 4.2.1 (from 4.1.11). Eval code that uses Node.js or browser features (fetch, process, require, Buffer, setTimeout, URL, TextDecoder, crypto, Intl) now reports DOWN: review custom evals before upgrading (see Upgrading in the README). Every check of an API, Ping, TCP or GameDig monitor, with the built-in eval too, starts a Node.js process in the Kener container (about 60 MiB plus what the eval allocates, 2 at a time). Recurring maintenances can repeat in a time zone and keep their local time across clock changes (a migration adds a nullable column at the first start), group monitors can list their members inline, and monitors keep honouring HTTP_PROXY, HTTPS_PROXY and NO_PROXY with Axios 1.21."
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/signKey: |
    fingerprint: 7902E52EA435EF27C6432E5378D6B532C599DA9B
    url: https://helm.unxwares.studio/pgp-public-key.asc
