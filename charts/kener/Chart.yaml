apiVersion: v2
name: kener
description: Kener 4 status page with SQLite/PostgreSQL/MySQL, a bundled hardened Valkey for its queues, and secure defaults for Kubernetes.
type: application
version: 2026.10.1
appVersion: "4.1.7"
kubeVersion: ">=1.27.0-0"
home: https://github.com/UnxWares/helm/tree/main/charts/kener
icon: https://kener.ing/logo.png

sources:
  - https://github.com/rajnandan1/kener
  - https://hub.docker.com/r/rajnandan1/kener
  - https://github.com/valkey-io/valkey
  - https://github.com/UnxWares/helm/tree/main/charts/kener

keywords:
  - kener
  - status
  - status-page
  - uptime
  - monitoring
  - incident

maintainers:
  - name: David Gheghea
    email: david.gheghea@unxwares.com
    url: https://github.com/UnxWares
  - name: Baptiste Gosselin
    email: baptiste.gosselin@unxwares.com
    url: https://github.com/UnxWares

annotations:
  artifacthub.io/displayName: Kener
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/UnxWares/helm/tree/main/charts/kener
    - name: Kener documentation
      url: https://kener.ing/docs/v4/setup/environment-variables
    - name: Support
      url: https://github.com/UnxWares/helm/issues
  artifacthub.io/images: |
    - name: kener
      image: docker.io/rajnandan1/kener:4.1.7-alpine
    - name: kener-debian
      image: docker.io/rajnandan1/kener:4.1.7
    - name: kener-status
      image: docker.io/rajnandan1/kener:4.1.7-status-alpine
    - name: kener-status-debian
      image: docker.io/rajnandan1/kener:4.1.7-status
    - name: valkey
      image: docker.io/valkey/valkey:9.1.2-alpine
  artifacthub.io/changes: |
    - kind: changed
      description: "BREAKING: Kener 3.2.19 -> 4.1.7. Database migrations run automatically, but heartbeat URLs, the REST API (/api/v4), uploads and subscriptions changed: read the Upgrading section of the README first."
      links:
        - name: Kener v4.0.0 migration notes
          url: https://kener.ing/docs/v4/changelogs/v4.0.0
    - kind: security
      description: Kener 4.1.7 stops returning the stored OIDC client secret and captcha secret key to read-only users and API keys (affects 4.1.3 to 4.1.6, CVSS 6.5).
      links:
        - name: Kener v4.1.7 changelog
          url: https://kener.ing/docs/v4/changelogs/v4.1.7
    - kind: security
      description: "BREAKING: removed the hard-coded default KENER_SECRET_KEY. It was public and let anyone forge sessions. The key is now generated and kept across upgrades, set with kener.secretKey or read from kener.existingSecret; the old default value is refused."
    - kind: security
      description: Hardened pods (non-root uid 1000, read-only root filesystem, all capabilities dropped, seccomp RuntimeDefault, no service account token). DATABASE_URL and every other secret now reach the container through Secrets only.
    - kind: added
      description: "Bundled single-instance Valkey 9.1.2 (Redis is mandatory since Kener 4) with a generated password and an optional NetworkPolicy, or an external Redis through redis.external."
    - kind: added
      description: SQLite persistence on a PVC kept on uninstall (single replica and Recreate strategy enforced); PostgreSQL/MySQL through database.url or database.existingSecret, with scheme validation.
    - kind: added
      description: "Image variant choice (alpine by default, fewer CVEs, or debian), /status base path images, SMTP and Resend email settings, outbound proxy, database pool tuning, ping monitor support, NetworkPolicy, PodDisruptionBudget and a helm test."
    - kind: fixed
      description: The HTTPRoute default rule routes PathPrefix / to the Kener service (it only matched /headers).
    - kind: fixed
      description: Probes use /healthcheck (readiness checks the database and Redis); the container port no longer follows service.port.
    - kind: deprecated
      description: kener.key, kener.keyFrom, database.enabled, database.secretKeys.url, volumes and volumeMounts still work but are replaced by kener.secretKey, kener.existingSecret, database.url, database.existingSecretKey, extraVolumes and extraVolumeMounts.
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/signKey: |
    fingerprint: 7902E52EA435EF27C6432E5378D6B532C599DA9B
    url: https://helm.unxwares.studio/pgp-public-key.asc
