suite: Service, Ingress and HTTPRoute
templates:
  - service.yaml
  - ingress.yaml
  - httproute.yaml
  - deployment.yaml
release:
  name: status
  namespace: status
tests:
  - it: exposes port 3000 to the http container port inside the cluster, for the Kener pods only
    template: service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: status-kener
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports
          value:
            - port: 3000
              targetPort: http
              protocol: TCP
              name: http
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: kener
            app.kubernetes.io/instance: status

  - it: changes only the Service port, the container keeps listening on 3000
    set:
      service.type: LoadBalancer
      service.port: 80
      service.annotations:
        lb.example.com/internal: "true"
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
        template: service.yaml
      - equal:
          path: spec.ports[0].port
          value: 80
        template: service.yaml
      - equal:
          path: metadata.annotations
          value:
            lb.example.com/internal: "true"
        template: service.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3000
        template: deployment.yaml

  - it: creates neither an Ingress nor an HTTPRoute by default
    asserts:
      - hasDocuments:
          count: 0
        template: ingress.yaml
      - hasDocuments:
          count: 0
        template: httproute.yaml

  - it: sends every Ingress path to the http port of the Service, Prefix by default
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: status.example.com
          paths:
            - path: /
            - path: /api
              pathType: Exact
    asserts:
      - equal:
          path: spec.rules
          value:
            - host: status.example.com
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: status-kener
                        port:
                          name: http
                  - path: /api
                    pathType: Exact
                    backend:
                      service:
                        name: status-kener
                        port:
                          name: http
      - notExists:
          path: spec.tls
      - notExists:
          path: spec.ingressClassName

  - it: sends every HTTPRoute rule to the Service port and keeps its matches and filters
    template: httproute.yaml
    set:
      service.port: 80
      httpRoute.enabled: true
      httpRoute.annotations:
        team: ops
      httpRoute.rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          filters:
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                  - name: X-Forwarded-Proto
                    value: https
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1
      - equal:
          path: metadata.annotations.team
          value: ops
      - equal:
          path: spec.parentRefs
          value:
            - name: gateway
              sectionName: http
      - equal:
          path: spec.hostnames
          value:
            - status.example.com
      - equal:
          path: spec.rules
          value:
            - backendRefs:
                - name: status-kener
                  port: 80
                  weight: 1
              matches:
                - path:
                    type: PathPrefix
                    value: /
              filters:
                - type: RequestHeaderModifier
                  requestHeaderModifier:
                    set:
                      - name: X-Forwarded-Proto
                        value: https
