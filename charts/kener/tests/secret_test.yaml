suite: chart Secret
templates:
  - secret.yaml
release:
  name: status
  namespace: status
tests:
  - it: generates a 64-character secret key and a 40-character Valkey password, kept on uninstall
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: status-kener
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - matchRegex:
          path: data["secret-key"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{64}$
      - matchRegex:
          path: data["redis-password"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{40}$
      - notExists:
          path: data["database-url"]
      - notExists:
          path: data["redis-url"]
      - notExists:
          path: data["smtp-password"]

  - it: keeps the generated values already stored in the release Secret
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: status-kener
            namespace: status
          data:
            secret-key: a2VwdC1zZWNyZXQta2V5LWZyb20tdGhlLXByZXZpb3VzLXJlbGVhc2U=  # kept-secret-key-from-the-previous-release
            redis-password: a2VwdC12YWxrZXktcGFzc3dvcmQ=  # kept-valkey-password
    asserts:
      - equal:
          path: data["secret-key"]
          value: kept-secret-key-from-the-previous-release
          decodeBase64: true
      - equal:
          path: data["redis-password"]
          value: kept-valkey-password
          decodeBase64: true

  - it: ignores a Secret of another release
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: other-kener
            namespace: status
          data:
            secret-key: a2VwdC1zZWNyZXQta2V5LWZyb20tdGhlLXByZXZpb3VzLXJlbGVhc2U=
    asserts:
      - matchRegex:
          path: data["secret-key"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{64}$

  - it: stores the secret key and the Valkey password given in the values
    set:
      kener.secretKey: a-secret-key-given-by-the-user-0123456789
      redis.auth.password: valkey-password
    asserts:
      - equal:
          path: data["secret-key"]
          value: a-secret-key-given-by-the-user-0123456789
          decodeBase64: true
      - equal:
          path: data["redis-password"]
          value: valkey-password
          decodeBase64: true

  - it: still stores the secret key of the deprecated kener.key
    set:
      kener.key: a-legacy-secret-key-0123456789-0123456789
    asserts:
      - equal:
          path: data["secret-key"]
          value: a-legacy-secret-key-0123456789-0123456789
          decodeBase64: true

  - it: leaves out the values read from existing Secrets
    set:
      kener.existingSecret: kener
      kener.secretKey: ignored
      redis.auth.existingSecret: kener-valkey
      redis.auth.password: ignored
      database.url: postgresql://kener:pw@db:5432/kener
    asserts:
      - notExists:
          path: data["secret-key"]
      - notExists:
          path: data["redis-password"]
      - equal:
          path: data["database-url"]
          value: postgresql://kener:pw@db:5432/kener
          decodeBase64: true

  - it: stores no SQLite URL, which is not a secret
    set:
      database.url: sqlite://./database/kener-restored.db
    asserts:
      - notExists:
          path: data["database-url"]

  - it: stores no database URL with an existing database Secret
    set:
      database.url: postgresql://kener:pw@db:5432/kener
      database.existingSecret: kener-database
    asserts:
      - notExists:
          path: data["database-url"]

  - it: stores the URL of an external Redis, and no Valkey password
    set:
      redis.enabled: false
      redis.external.url: rediss://default:pw@redis.example.com:6379
      redis.auth.password: unused
    asserts:
      - equal:
          path: data["redis-url"]
          value: rediss://default:pw@redis.example.com:6379
          decodeBase64: true
      - notExists:
          path: data["redis-password"]

  - it: stores the SMTP password only with an SMTP host
    set:
      email.smtp.password: smtp-pass
    asserts:
      - notExists:
          path: data["smtp-password"]

  - it: stores the SMTP password, the Resend API key and the proxy URLs given as values
    set:
      email.smtp.host: smtp.example.com
      email.smtp.user: status@example.com
      email.smtp.fromEmail: status@example.com
      email.smtp.password: smtp-pass
      email.resend.apiKey: re_123
      email.resend.senderEmail: status@example.com
      proxy.httpProxy: http://user:pw@proxy.example.com:3128
      proxy.httpsProxy: http://user:pw@proxy.example.com:3129
    asserts:
      - equal:
          path: data["smtp-password"]
          value: smtp-pass
          decodeBase64: true
      - equal:
          path: data["resend-api-key"]
          value: re_123
          decodeBase64: true
      - equal:
          path: data["http-proxy"]
          value: http://user:pw@proxy.example.com:3128
          decodeBase64: true
      - equal:
          path: data["https-proxy"]
          value: http://user:pw@proxy.example.com:3129
          decodeBase64: true

  - it: stores nothing that comes from an existing Secret instead
    set:
      email.smtp.host: smtp.example.com
      email.smtp.user: status@example.com
      email.smtp.fromEmail: status@example.com
      email.smtp.password: ignored
      email.smtp.existingSecret: kener-smtp
      email.resend.apiKey: ignored
      email.resend.existingSecret: kener-resend
      email.resend.senderEmail: status@example.com
      proxy.httpProxy: http://ignored:3128
      proxy.existingSecret: kener-proxy
    asserts:
      - notExists:
          path: data["smtp-password"]
      - notExists:
          path: data["resend-api-key"]
      - notExists:
          path: data["http-proxy"]

  - it: renders no Secret when every secret comes from your own Secrets
    set:
      kener.existingSecret: kener
      database.existingSecret: kener
      redis.enabled: false
      redis.external.existingSecret: kener
    asserts:
      - hasDocuments:
          count: 0
