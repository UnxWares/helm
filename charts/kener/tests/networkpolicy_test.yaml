suite: NetworkPolicies
templates:
  - networkpolicy.yaml
release:
  name: status
  namespace: status
tests:
  - it: renders no NetworkPolicy by default
    asserts:
      - hasDocuments:
          count: 0

  - it: lets the Kener pods accept their http port only, from any source by default, with egress open
    set:
      networkPolicy.enabled: true
    documentSelector:
      path: metadata.name
      value: status-kener
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec
          value:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: kener
                app.kubernetes.io/instance: status
            policyTypes:
              - Ingress
            ingress:
              - ports:
                  - port: http
                    protocol: TCP

  - it: allows the release pods and the listed peers when ingressFrom is set (README example)
    set:
      networkPolicy.enabled: true
      networkPolicy.ingressFrom:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
    documentSelector:
      path: metadata.name
      value: status-kener
    asserts:
      - equal:
          path: spec.ingress
          value:
            - ports:
                - port: http
                  protocol: TCP
              from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: status
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: ingress-nginx
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: ingress-nginx

  - it: lets only the Kener pods reach Valkey, and Valkey reach nothing
    set:
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec
          value:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: kener-valkey
                app.kubernetes.io/instance: status
                app.kubernetes.io/component: redis
            policyTypes:
              - Ingress
              - Egress
            ingress:
              - ports:
                  - port: redis
                    protocol: TCP
                from:
                  - podSelector:
                      matchLabels:
                        app.kubernetes.io/name: kener
                        app.kubernetes.io/instance: status
            egress: []
        documentSelector:
          path: metadata.name
          value: status-kener-valkey

  - it: renders only the Kener policy with an external Redis
    set:
      networkPolicy.enabled: true
      redis.enabled: false
      redis.external.url: redis://redis.example.com:6379
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: status-kener
