{{- include "kener.validate" . }}
{{- $sqlite := include "kener.sqlite" . }}
{{- $base := include "kener.basePath" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kener.fullname" . }}
  labels:
    {{- include "kener.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if and $sqlite .Values.persistence.enabled }}
  # A ReadWriteOnce volume cannot be attached to the old and the new pod at the same time,
  # and SQLite must never have two writers.
  strategy:
    type: Recreate
  {{- else if .Values.updateStrategy }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kener.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ list (include "kener.secretKey.value" .) .Values.database.url .Values.redis.auth.password .Values.redis.external.url .Values.email.smtp.password .Values.email.resend.apiKey .Values.proxy.httpProxy .Values.proxy.httpsProxy | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kener.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kener.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      enableServiceLinks: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with include "kener.podSecurityContext" . }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: kener
          image: {{ include "kener.kenerImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with include "kener.securityContext" . }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          env:
            {{- include "kener.env" . | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- include "kener.probe" (dict "probe" .Values.livenessProbe "path" (printf "%s/healthcheck" $base)) | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- include "kener.probe" (dict "probe" .Values.readinessProbe "path" (printf "%s/healthcheck?strict=1" $base)) | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- include "kener.probe" (dict "probe" .Values.startupProbe "path" (printf "%s/healthcheck" $base)) | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $sqlite }}
            - name: data
              mountPath: /app/database
            {{- end }}
            {{- with include "kener.extraVolumeMounts" . }}
            {{- . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if $sqlite }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "kener.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with include "kener.extraVolumes" . }}
        {{- . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
