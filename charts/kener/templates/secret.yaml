{{- $secretKey := not (include "kener.secretKey.existingSecret" .) }}
{{- $databaseUrl := and (not (include "kener.sqlite" .)) (not .Values.database.existingSecret) .Values.database.url }}
{{- $redisPassword := and .Values.redis.enabled (not .Values.redis.auth.existingSecret) }}
{{- $redisUrl := and (not .Values.redis.enabled) (not .Values.redis.external.existingSecret) .Values.redis.external.url }}
{{- $smtpPassword := and .Values.email.smtp.host (not .Values.email.smtp.existingSecret) .Values.email.smtp.password }}
{{- $resendApiKey := and (not .Values.email.resend.existingSecret) .Values.email.resend.apiKey }}
{{- if or $secretKey $databaseUrl $redisPassword $redisUrl $smtpPassword $resendApiKey .Values.proxy.httpProxy .Values.proxy.httpsProxy }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kener.secretName" . }}
  labels:
    {{- include "kener.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $secretKey }}
  secret-key: {{ include "kener.secretKey.value" . | default (include "kener.generated" (dict "ctx" . "key" "secret-key" "length" 64)) | b64enc | quote }}
  {{- end }}
  {{- if $databaseUrl }}
  database-url: {{ .Values.database.url | b64enc | quote }}
  {{- end }}
  {{- if $redisPassword }}
  redis-password: {{ .Values.redis.auth.password | default (include "kener.generated" (dict "ctx" . "key" "redis-password" "length" 40)) | b64enc | quote }}
  {{- end }}
  {{- if $redisUrl }}
  redis-url: {{ .Values.redis.external.url | b64enc | quote }}
  {{- end }}
  {{- if $smtpPassword }}
  smtp-password: {{ .Values.email.smtp.password | b64enc | quote }}
  {{- end }}
  {{- if $resendApiKey }}
  resend-api-key: {{ .Values.email.resend.apiKey | b64enc | quote }}
  {{- end }}
  {{- with .Values.proxy.httpProxy }}
  http-proxy: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.proxy.httpsProxy }}
  https-proxy: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
