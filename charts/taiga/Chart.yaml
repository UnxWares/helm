    - name: Chart source
      url: https://github.com/UnxWares/helm/tree/main/charts/taiga
    - name: Taiga documentation
      url: https://docs.taiga.io/
    - name: Support
      url: https://github.com/UnxWares/helm/issues
  artifacthub.io/images: |
    - name: taiga-back
      image: ghcr.io/unxwares/taiga-back:6.10.2
    - name: taiga-front
      image: ghcr.io/unxwares/taiga-front:6.10.3
    - name: taiga-events
      image: ghcr.io/unxwares/taiga-events:6.10.0
    - name: taiga-protected
      image: ghcr.io/unxwares/taiga-protected:6.10.1
    - name: postgres
      image: ghcr.io/unxwares/postgres:17.11-alpine
    - name: rabbitmq
      image: docker.io/library/rabbitmq:4.4.0-management-alpine
    - name: nginx-unprivileged
      image: docker.io/nginxinc/nginx-unprivileged:1.30.6-alpine-slim
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: fixed
      description: "Periodic tasks were sent once per async worker (each ran its own Celery beat): the beat scheduler now runs once, in its own async-beat Deployment (one replica, Recreate strategy), so the workers can be scaled."
    - kind: changed
      description: "async.command defaults to the Celery worker without beat; a command that starts a beat scheduler (docker/async_entrypoint.sh, -B) is refused. New async.extraArgs for Celery options such as --concurrency."
    - kind: fixed
      description: "The chart Secret is kept on uninstall (helm.sh/resource-policy: keep), like the database and media claims, so a reinstall keeps the passwords the volumes were initialized with."
    - kind: fixed
      description: "taiga-events connects to eventsRabbitmq.service.port instead of always 5672."
    - kind: fixed
      description: "The async pods also use backend.imagePullSecrets (they run the backend image)."
    - kind: fixed
      description: "events and protected restart when the chart Secret changes."
    - kind: fixed
      description: "Value descriptions corrected: global resources and security contexts, OIDC endpoints (no discovery), external database with an existing Secret, events broker vhost, sub-path."
    - kind: added
      description: "Optional NetworkPolicies (networkPolicy.enabled): the gateway is the only entry point, the database and the brokers only accept the components that use them."
    - kind: added
      description: "helm test through the gateway: API, front and its configuration, static files, events websocket handshake, refusal of an unsigned attachment URL. It creates nothing."
  artifacthub.io/signKey: |
    fingerprint: 7902E52EA435EF27C6432E5378D6B532C599DA9B
    url: https://helm.unxwares.studio/pgp-public-key.asc
