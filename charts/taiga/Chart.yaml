apiVersion: v2
name: taiga
description: Taiga, the open-source agile project management platform (backend, async workers, events, front, protected media, bundled PostgreSQL and RabbitMQ), hardened for Kubernetes.
type: application
version: 2026.10.3
appVersion: "6.10.2"
kubeVersion: ">=1.27.0-0"
home: https://github.com/UnxWares/helm/tree/main/charts/taiga
icon: https://avatars.githubusercontent.com/u/6905422?s=200&v=4

sources:
  - https://github.com/taigaio/taiga-back
  - https://github.com/taigaio/taiga-front
  - https://github.com/taigaio/taiga-docker
  - https://github.com/UnxWares/helm/tree/main/charts/taiga

keywords:
  - taiga
  - kanban
  - scrum
  - agile
  - project-management
  - issue-tracker
  - collaboration

maintainers:
  - name: David Gheghea
    email: david.gheghea@unxwares.com
    url: https://github.com/UnxWares
  - name: Baptiste Gosselin
    email: baptiste.gosselin@unxwares.com
    url: https://github.com/UnxWares

annotations:
  artifacthub.io/displayName: Taiga
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Chart source
      url: https://github.com/UnxWares/helm/tree/main/charts/taiga
    - name: Taiga documentation
      url: https://docs.taiga.io/
    - name: Support
      url: https://github.com/UnxWares/helm/issues
  artifacthub.io/images: |
    - name: taiga-back
      image: ghcr.io/unxwares/taiga-back:6.10.2
    - name: taiga-front
      image: ghcr.io/unxwares/taiga-front:6.10.3
    - name: taiga-events
      image: ghcr.io/unxwares/taiga-events:6.10.0
    - name: taiga-protected
      image: ghcr.io/unxwares/taiga-protected:6.10.1
    - name: postgres
      image: ghcr.io/unxwares/postgres:17.11-alpine
    - name: rabbitmq
      image: docker.io/library/rabbitmq:4.4.0-management-alpine
    - name: nginx-unprivileged
      image: docker.io/nginxinc/nginx-unprivileged:1.30.6-alpine-slim
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: "Default images move to ghcr.io/unxwares (global.imageProvider: unxwares): the same Taiga versions rebuilt every week from the upstream sources on current Alpine bases. global.imageProvider: upstream keeps the official images."
      links:
        - name: UnxWares images
          url: https://github.com/UnxWares/helm/tree/main/images
    - kind: security
      description: Known vulnerabilities of the images (Trivy) drop from about 1,200 to 18, Django 3.2 and bleach 4 in taiga-back, which need changes in Taiga itself.
    - kind: security
      description: "taiga-back includes the upstream security fixes not released yet: permissions of the filters data endpoints and of epic custom attribute values, password recovery tokens invalidated on password and email change and expiring, maximum password length, no account enumeration in password recovery."
    - kind: security
      description: With the UnxWares images every Taiga pod runs as non-root with a read-only root filesystem and no capability (the official images need CHOWN, DAC_OVERRIDE, FOWNER, SETUID and SETGID).
    - kind: changed
      description: "OIDC needs no override image with the UnxWares images (plugin built in): global.oidc.*.overrideImage now default to empty (the former latest-oidc images were Taiga 6.9)."
    - kind: added
      description: /tmp volumes for the Taiga containers, and a pod volume for media when global.persistence.media is disabled.
  artifacthub.io/signKey: |
    fingerprint: 7902E52EA435EF27C6432E5378D6B532C599DA9B
    url: https://helm.unxwares.studio/pgp-public-key.asc
