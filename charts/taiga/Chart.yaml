apiVersion: v2
name: taiga
description: Taiga, the open-source agile project management platform (backend, async workers, events, front, protected media, bundled PostgreSQL and RabbitMQ), hardened for Kubernetes.
type: application
version: 2026.10.1
appVersion: "6.10.2"
kubeVersion: ">=1.27.0-0"
home: https://github.com/UnxWares/helm/tree/main/charts/taiga
icon: https://avatars.githubusercontent.com/u/6905422?s=200&v=4

sources:
  - https://github.com/taigaio/taiga-back
  - https://github.com/taigaio/taiga-front
  - https://github.com/taigaio/taiga-docker
  - https://github.com/UnxWares/helm/tree/main/charts/taiga

keywords:
  - taiga
  - kanban
  - scrum
  - agile
  - project-management
  - issue-tracker
  - collaboration

maintainers:
