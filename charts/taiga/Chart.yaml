apiVersion: v2
name: taiga
description: Taiga, the open-source agile project management platform (backend, async workers, events, front, protected media, bundled PostgreSQL and RabbitMQ), hardened for Kubernetes.
type: application
version: 2026.11.2
appVersion: "6.10.2"
kubeVersion: ">=1.27.0-0"
home: https://github.com/UnxWares/helm/tree/main/charts/taiga
