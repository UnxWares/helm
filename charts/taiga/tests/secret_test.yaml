suite: chart Secret
templates:
  - secret.yaml
release:
  name: taiga
  namespace: taiga
values:
  - values/external-database.yaml
tests:
  - it: generates the Django key and both broker passwords, stores the external database password, and is kept on uninstall
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: taiga
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.annotations
          value:
            helm.sh/resource-policy: keep
      - matchRegex:
          path: data["secret-key"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{64}$
      - matchRegex:
          path: data["async-rabbitmq-password"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{32}$
      - matchRegex:
          path: data["events-rabbitmq-password"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{32}$
      - equal:
          path: data["postgres-password"]
          value: ci-db-password
          decodeBase64: true
      - notExists:
          path: data["db-password"]
      - notExists:
          path: data["email-password"]
      - notExists:
          path: data["oidc-client-secret"]

  - it: generates a 32-character password for the bundled database
    values:
      - values/bundled-database.yaml
    asserts:
      - matchRegex:
          path: data["db-password"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{32}$
      - notExists:
          path: data["postgres-password"]

  - it: keeps the generated values already stored in the release Secret at upgrade
    values:
      - values/bundled-database.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: taiga
            namespace: taiga
          data:
            secret-key: a2VwdC1zZWNyZXQta2V5  # kept-secret-key
            db-password: a2VwdC1kYi1wYXNzd29yZA==  # kept-db-password
            async-rabbitmq-password: a2VwdC1hc3luYy1wYXNzd29yZA==  # kept-async-password
            events-rabbitmq-password: a2VwdC1ldmVudHMtcGFzc3dvcmQ=  # kept-events-password
    asserts:
      - equal:
          path: data["secret-key"]
          value: kept-secret-key
          decodeBase64: true
      - equal:
          path: data["db-password"]
          value: kept-db-password
          decodeBase64: true
      - equal:
          path: data["async-rabbitmq-password"]
          value: kept-async-password
          decodeBase64: true
      - equal:
          path: data["events-rabbitmq-password"]
          value: kept-events-password
          decodeBase64: true

  - it: generates a value missing from the release Secret and keeps the others
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: taiga
            namespace: taiga
          data:
            secret-key: a2VwdC1zZWNyZXQta2V5  # kept-secret-key
    asserts:
      - equal:
          path: data["secret-key"]
          value: kept-secret-key
          decodeBase64: true
      - matchRegex:
          path: data["async-rabbitmq-password"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{32}$

  - it: ignores a Secret of the same name in another namespace
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: taiga
            namespace: other
          data:
            secret-key: a2VwdC1zZWNyZXQta2V5
    asserts:
      - matchRegex:
          path: data["secret-key"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{64}$

  - it: stores the key and the passwords given in the values instead of the stored ones
    values:
      - values/bundled-database.yaml
    set:
      global:
        secretKey: a-django-key-given-by-the-user
      db:
        auth:
          password: db-pass
      asyncRabbitmq:
        auth:
          password: async-pass
      eventsRabbitmq:
        auth:
          password: events-pass
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: taiga
            namespace: taiga
          data:
            secret-key: a2VwdC1zZWNyZXQta2V5
    asserts:
      - equal:
          path: data["secret-key"]
          value: a-django-key-given-by-the-user
          decodeBase64: true
      - equal:
          path: data["db-password"]
          value: db-pass
          decodeBase64: true
      - equal:
          path: data["async-rabbitmq-password"]
          value: async-pass
          decodeBase64: true
      - equal:
          path: data["events-rabbitmq-password"]
          value: events-pass
          decodeBase64: true

  - it: generates nothing with global.existingSecret and the bundled database
    values:
      - values/bundled-database.yaml
    set:
      global:
        existingSecret: taiga-secrets
    asserts:
      - isNullOrEmpty:
          path: data

  - it: still stores an inline external database password with global.existingSecret
    set:
      global:
        existingSecret: taiga-secrets
    asserts:
      - equal:
          path: data
          value:
            postgres-password: Y2ktZGItcGFzc3dvcmQ=

  - it: stores no database credential with an existing external database Secret
    set:
      externalDatabase:
        password: ""
        existingSecret: taiga-db
    asserts:
      - notExists:
          path: data["postgres-password"]

  - it: stores no password for the components that read it from their own Secret
    values:
      - values/bundled-database.yaml
    set:
      db:
        auth:
          password: ignored
          existingSecret: taiga-postgres
      asyncRabbitmq:
        auth:
          password: ignored
          existingSecret: taiga-async-broker
    asserts:
      - notExists:
          path: data["db-password"]
      - notExists:
          path: data["async-rabbitmq-password"]
      - matchRegex:
          path: data["events-rabbitmq-password"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{32}$
      - exists:
          path: data["secret-key"]

  - it: stores the SMTP password
    set:
      backend:
        email:
          backend: smtp
          password: smtp-pass
    asserts:
      - equal:
          path: data["email-password"]
          value: smtp-pass
          decodeBase64: true

  - it: stores no SMTP password with an existing email Secret
    set:
      backend:
        email:
          password: smtp-pass
          existingSecret: taiga-smtp
    asserts:
      - notExists:
          path: data["email-password"]

  - it: stores the OIDC client secret when OIDC is enabled
    set:
      global:
        oidc:
          enabled: true
          clientSecret: oidc-secret
    asserts:
      - equal:
          path: data["oidc-client-secret"]
          value: oidc-secret
          decodeBase64: true

  - it: stores no OIDC client secret when OIDC is disabled
    set:
      global:
        oidc:
          clientSecret: oidc-secret
    asserts:
      - notExists:
          path: data["oidc-client-secret"]

  - it: stores no OIDC client secret with an existing OIDC Secret
    set:
      global:
        oidc:
          enabled: true
          clientSecret: oidc-secret
          existingSecret: taiga-oidc
    asserts:
      - notExists:
          path: data["oidc-client-secret"]
