suite: gateway configuration
templates:
  - gateway/configmap.yaml
  - gateway/deployment.yaml
release:
  name: taiga
  namespace: taiga
tests:
  - it: listens on 8080 and limits uploads to 100M
    template: gateway/configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: taiga-gateway
      - matchRegex:
          path: data["default.conf"]
          pattern: "(?m)^    listen 8080 default_server;\\n    listen \\[::\\]:8080 default_server;$"
      - matchRegex:
          path: data["default.conf"]
          pattern: "(?m)^    client_max_body_size 100M;$"

  - it: routes the front, the API, the admin, the media and the events to their Services
    template: gateway/configmap.yaml
    asserts:
      - matchRegex:
          path: data["default.conf"]
          pattern: "location / \\{\\n        proxy_pass http://taiga-frontend:80/;"
      - matchRegex:
          path: data["default.conf"]
          pattern: "location /api/ \\{\\n        proxy_pass http://taiga-backend:8000/api/;"
      - matchRegex:
          path: data["default.conf"]
          pattern: "location /admin/ \\{\\n        proxy_pass http://taiga-backend:8000/admin/;"
      - matchRegex:
          path: data["default.conf"]
          pattern: "location /media/ \\{\\n        proxy_pass http://taiga-protected:8003/;"
      - matchRegex:
          path: data["default.conf"]
          pattern: "location /events \\{\\n        proxy_pass http://taiga-events:8888/events;\\n        proxy_http_version 1.1;\\n        proxy_set_header Upgrade \\$http_upgrade;\\n        proxy_set_header Connection \"upgrade\";"

  - it: serves the static files itself and the media files only through taiga-protected (internal location)
    template: gateway/configmap.yaml
    asserts:
      - matchRegex:
          path: data["default.conf"]
          pattern: "location /static/ \\{\\n        alias /taiga/static/;\\n    \\}"
      - matchRegex:
          path: data["default.conf"]
          pattern: "location /_protected/ \\{\\n        internal;\\n        alias /taiga/media/;"

  - it: serves the project exports from the media volume, as the upstream gateway does
    template: gateway/configmap.yaml
    asserts:
      - matchRegex:
          path: data["default.conf"]
          pattern: "location /media/exports/ \\{\\n        alias /taiga/media/exports/;\\n        add_header Content-disposition \"attachment\";"

  - it: follows the Service ports of the components and the upload limit
    template: gateway/configmap.yaml
    set:
      gateway:
        clientMaxBodySize: 1G
      frontend:
        service:
          port: 8081
      backend:
        service:
          port: 8001
      protected:
        service:
          port: 8004
      events:
        service:
          port: 8889
    asserts:
      - matchRegex:
          path: data["default.conf"]
          pattern: "client_max_body_size 1G;"
      - matchRegex:
          path: data["default.conf"]
          pattern: "proxy_pass http://taiga-frontend:8081/;"
      - matchRegex:
          path: data["default.conf"]
          pattern: "proxy_pass http://taiga-backend:8001/api/;"
      - matchRegex:
          path: data["default.conf"]
          pattern: "proxy_pass http://taiga-protected:8004/;"
      - matchRegex:
          path: data["default.conf"]
          pattern: "proxy_pass http://taiga-events:8889/events;"

  - it: mounts the configuration as the nginx default server and restarts the gateway when it changes
    template: gateway/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nginx-config
            configMap:
              name: taiga-gateway
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$

  - it: uses an existing ConfigMap instead of the built-in configuration
    set:
      gateway:
        configMapName: taiga-gateway-custom
    asserts:
      - hasDocuments:
          count: 0
        template: gateway/configmap.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: nginx-config
            configMap:
              name: taiga-gateway-custom
        template: gateway/deployment.yaml

  - it: copies the static files into a size-limited volume mounted read-only by nginx
    template: gateway/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts
          value:
            - name: static
              mountPath: /static
      - contains:
          path: spec.template.spec.volumes
          content:
            name: static
            emptyDir:
              sizeLimit: 64Mi
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: static
            mountPath: /taiga/static
            readOnly: true
