protected:
  replicaCount: 1

  image:
    repository: taigaio/taiga-protected
    tag: latest
    pullPolicy: IfNotPresent

  ## MAX_AGE controls how long signed attachment URLs remain valid (seconds).
  ## Default is 360 s (6 min). Increase for larger files on slow connections.
  maxAge: 360

  service:
    type: ClusterIP
    port: 8003

  extraEnv: []
  extraEnvFrom: []

  resources: {}

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}


gateway:
  replicaCount: 1

  image:
    repository: nginx
    tag: 1.19-alpine
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  ## Provide the name of a ConfigMap whose key "default.conf" contains a
  ## custom nginx config, mirroring the ./taiga-gateway/taiga.conf bind-mount
  ## in docker-compose. Leave empty to use the chart's built-in config.
  configMapName: ""

  extraVolumes: []
  extraVolumeMounts: []

  resources: {}

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http


ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: taiga.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
