global:
  pod:
    nodeSelector: {}
    tolerations: []
    affinity: {}

  imagePullSecrets: []
  # - name: my-registry-secret

  scheme: "https"
  domain: "taiga.example.com"
  subPath: ""

  websocketsScheme: "wss" # ws | wss

  ## Prefer existingSecret in production.
  secretKey: "changeme"

  ## If set, this secret is mounted as envFrom on every relevant service.
  ## It must expose all keys referenced in secretKeys below.
  existingSecret: ""
  # secretKeys:
  #   secretKey:            SECRET_KEY

  telemetry:
    enabled: true

  persistence:
    static:
      enabled: false
      existingClaim: ""
      storageClass: ""
      accessMode: ReadWriteMany
      size: 1Gi
      annotations: {}
    media:
      enabled: false
      existingClaim: ""
      storageClass: ""
      accessMode: ReadWriteMany
      size: 5Gi
      annotations: {}

  extraEnv: []
  # - name: SOME_SETTING
  #   value: "some-value"

  extraEnvFrom: []
  # - secretRef:
  #     name: my-extra-secret

  resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

  podSecurityContext: {}
  securityContext: {}

  defaultProbes:
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  ## OIDC Authentication Configuration
  ## See: https://github.com/UnxWares/taiga-contrib-oidc-auth for more information
  oidc:
    enabled: false

    issuer: ""
    scopes: "openid profile email"

    clientId: ""
    clientSecret: ""
    # Setting existingSecret will override clientId and clientSecret
    existingSecret: ""
    secretKeys:
      clientId: "oidc-client-id"
      clientSecret: "oidc-client-secret"

    ## Optional, only set if provider doesn't support auto-discovery
    endpoints:
      authorization: ""
      token: ""
      userinfo: ""
      jwks: ""

    frontend:
      overrideImage:
        name: ghcr.io/unxwares/taiga-front
        tag: latest-oidc
      buttonText: "Login with SSO"
      enableDefaultLogin: true

    backend:
      overrideImage:
        name: ghcr.io/unxwares/taiga-back
        tag: latest-oidc
      ## Enable if running behind reverse proxy with TLS termination
      useXForwardedHost: false


externalDatabase:
  enabled: true
  host: 127.0.0.1
  port: 5432
  database: postgres
  username: user
  password: password

  ## If existingSecret is set, all inline values above are ignored.
  ## The secret must expose the keys listed in secretKeys.
  existingSecret: ""
  secretKeys:
    host:     database-host
    port:     database-port
    database: database-name
    username: database-username
    password: database-password


db:
  enabled: false

  image:
    repository: postgres
    tag: "12.3"
    pullPolicy: IfNotPresent

  ## Credentials – ignored when global.existingSecret is set.
  auth:
    database: taiga
    user: taiga
    password: "changeme"
    existingSecret: ""   # overrides auth.user / auth.password
    secretKeys:
      user:     POSTGRES_USER
      password: POSTGRES_PASSWORD

  persistence:
    enabled: false
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 8Gi
    annotations: {}

  service:
    type: ClusterIP
    port: 5432

  healthcheck:
    enabled: true
    interval: 2s
    timeout: 15s
    retries: 5
    startPeriod: 3s

  resources: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}


backend:
  replicaCount: 1

  image:
    ## NOTE: When global.oidc.enabled=true, use OIDC-compatible images
    ## Example: ghcr.io/unxwares/taiga-back:latest-oidc
    repository: taigaio/taiga-back
    tag: latest
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  service:
    type: ClusterIP
    port: 8000

  email:
    backend: "console"   # console | smtp
    defaultFrom: "no-reply@taiga.example.com"
    useTLS: false
    useSSL: false
    host: ""
    port: 25
    user: ""
    password: ""
    ## If existingSecret is set, email.user / email.password are ignored.
    existingSecret: ""
    secretKeys:
      user:     EMAIL_HOST_USER
      password: EMAIL_HOST_PASSWORD

  extraVolumes: []
  # - name: custom-config
  #   configMap:
  #     name: taiga-back-config
  extraVolumeMounts: []
  # - name: custom-config
  #   mountPath: /taiga-back/settings/config.py
  #   subPath: config.py

  extraEnv: []
  extraEnvFrom: []

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  resources: {}

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  livenessProbe:
    httpGet:
      path: /api/v1/
      port: http
  readinessProbe:
    httpGet:
      path: /api/v1/
      port: http


async:
  replicaCount: 1

  image:
    repository: taigaio/taiga-back
    tag: latest
    pullPolicy: IfNotPresent

  command: ["/taiga-back/docker/async_entrypoint.sh"]

  extraVolumes: []
  extraVolumeMounts: []
  extraEnv: []
  extraEnvFrom: []

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  resources: {}

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}


asyncRabbitmq:
  replicaCount: 1

  image:
    repository: rabbitmq
    tag: 3.8-management-alpine
    pullPolicy: IfNotPresent

  auth:
    user: taiga
    password: "changeme"
    vhost: taiga
    erlangCookie: "changeme-erlang-cookie"
    ## If existingSecret is set, all inline auth values are ignored.
    existingSecret: ""
    secretKeys:
      user:         RABBITMQ_USER
      password:     RABBITMQ_PASS
      vhost:        RABBITMQ_VHOST
      erlangCookie: RABBITMQ_ERLANG_COOKIE

  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
    annotations: {}

  service:
    type: ClusterIP
    port: 5672
    managementPort: 15672

  resources: {}

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}


