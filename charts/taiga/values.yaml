global:
  pod:
    nodeSelector: {}
    tolerations: []
    affinity: {}
  imagePullSecrets: []

frontend:
  replicaCount: 1

  image:
    repository: taigaio/taiga-front
    pullPolicy: IfNotPresent
    tag: latest

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  url: "https://taiga.example.com"
  websocketsUrl: "wss://taiga.example.com"
  subPath: ""

  service:
    type: ClusterIP
    port: 80

  extraEnv:
    # - name: SOME_ENV
    #   value: "some-value"
    # - name: TAIGA_URL
    #   value: "https://taiga.example.com"
    # - name: TAIGA_WEBSOCKETS_URL
    #   value: "wss://taiga.example.com"
    # - name: TAIGA_SUBPATH
    #   value: ""

  extraEnvFrom: []
  # - secretRef:
  #     name: my-secret
  # - configMapRef:
  #     name: my-config

  # This is for setting Kubernetes Annotations to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  # This is for setting Kubernetes Labels to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

  # This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # Additional volumes on the output Deployment definition.
  volumes: []
    # - name: data
    #   secret:
    #   persistentVolumeClaim:
    #     claimName: some-data

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
    # - name: data
    #   mountPath: "/some/path"
    #   readOnly: false

  nodeSelector: {}

  tolerations: []

  affinity: {}

backend:
  replicaCount: 1

  image:
    repository: taigaio/taiga-back
    pullPolicy: IfNotPresent
    tag: latest

  service:
    type: ClusterIP
    port: 80

  database:
    host: taiga-db
    name: taiga
    existingSecret: ""
    secretKeys:
      user: POSTGRES_USER
      password: POSTGRES_PASSWORD

  extraEnv:
    - name: TAIGA_SECRET_KEY
      value: "changeme"
    - name: TAIGA_SITES_SCHEME
      value: "https"
    - name: TAIGA_SITES_DOMAIN
      value: "taiga.example.com"
    - name: TAIGA_SUBPATH
      value: ""

  volumes:
    - name: static
      persistentVolumeClaim:
        claimName: taiga-static
    - name: media
      persistentVolumeClaim:
        claimName: taiga-media

  volumeMounts:
    - name: static
      mountPath: /taiga-back/static
    - name: media
      mountPath: /taiga-back/media

################################
# Async worker
################################
async:
  replicaCount: 1

  image:
    repository: taigaio/taiga-back
    tag: latest

  command: ["/taiga-back/docker/async_entrypoint.sh"]

  volumes:
    - name: static
      persistentVolumeClaim:
        claimName: taiga-static
    - name: media
      persistentVolumeClaim:
        claimName: taiga-media

################################
# Database
################################
database:
  enabled: true

  image:
    repository: postgres
    tag: "12.3"

  auth:
    database: taiga
    existingSecret: ""
    secretKeys:
      user: POSTGRES_USER
      password: POSTGRES_PASSWORD

  persistence:
    enabled: true
    size: 10Gi

################################
# RabbitMQ (async)
################################
asyncRabbitmq:
  replicaCount: 1

  image:
    repository: rabbitmq
    tag: 3.8-management-alpine

  auth:
    existingSecret: ""
    secretKeys:
      user: RABBITMQ_USER
      password: RABBITMQ_PASS
      vhost: RABBITMQ_VHOST

  persistence:
    enabled: true
    size: 5Gi

################################
# RabbitMQ (events)
################################
eventsRabbitmq:
  replicaCount: 1

  image:
    repository: rabbitmq
    tag: 3.8-management-alpine

  auth:
    existingSecret: ""
    secretKeys:
      user: RABBITMQ_USER
      password: RABBITMQ_PASS
      vhost: RABBITMQ_VHOST

  persistence:
    enabled: true
    size: 5Gi

################################
# Events service
################################
events:
  replicaCount: 1

  image:
    repository: taigaio/taiga-events
    tag: latest

################################
# Protected attachments service
################################
protected:
  replicaCount: 1

  image:
    repository: taigaio/taiga-protected
    tag: latest

################################
# Gateway (nginx)
################################
gateway:
  replicaCount: 1

  image:
    repository: nginx
    tag: 1.19-alpine

  service:
    type: ClusterIP
    port: 80

  volumes:
    - name: static
      persistentVolumeClaim:
        claimName: taiga-static
    - name: media
      persistentVolumeClaim:
        claimName: taiga-media

  volumeMounts:
    - name: static
      mountPath: /taiga/static
    - name: media
      mountPath: /taiga/media

################################
# Ingress
################################
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: taiga.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

################################
# Service account
################################
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
