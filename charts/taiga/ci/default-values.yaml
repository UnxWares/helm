# Full stack with the bundled PostgreSQL (fresh kind cluster, no ingress), with the NetworkPolicies (kind enforces
# them): `helm test` and the end-to-end test go through them.
global:
  scheme: http
  websocketsScheme: ws
  domain: localhost
externalDatabase:
  enabled: false
db:
  enabled: true
asyncRabbitmq:
  persistence:
    size: 1Gi
eventsRabbitmq:
  persistence:
    size: 1Gi
networkPolicy:
  enabled: true
