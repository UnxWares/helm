apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taiga.fullname" . }}-events
  labels:
    {{- include "taiga.labels" . | nindent 4 }}
    app.kubernetes.io/component: events
spec:
  replicas: {{ .Values.events.replicaCount }}
  selector:
    matchLabels:
      {{- include "taiga.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: events
  template:
    metadata:
      {{- with .Values.events.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "taiga.labels" . | nindent 8 }}
        app.kubernetes.io/component: events
        {{- with .Values.events.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "taiga.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.serviceAccount.automount }}
      securityContext:
        {{- include "taiga.podSecurityContext" (dict "ctx" . "values" .Values.events "component" "events") | nindent 8 }}
      containers:
        - name: events
          securityContext:
            {{- include "taiga.securityContext" (dict "ctx" . "values" .Values.events "component" "events") | nindent 12 }}
          image: {{ include "taiga.image" (dict "ctx" . "image" .Values.events.image "name" "taiga-events") | quote }}
          imagePullPolicy: {{ .Values.events.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
            - name: health
              containerPort: 3023
              protocol: TCP
          env:
            {{- include "taiga.eventsEnv" . | nindent 12 }}
            {{- with .Values.events.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.global.extraEnvFrom .Values.events.extraEnvFrom }}
          envFrom:
            {{- with .Values.global.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.events.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.events.livenessProbe }}
          livenessProbe:
            {{- include "taiga.probe" (dict "probe" . "defaults" $.Values.global.defaultProbes.liveness) | nindent 12 }}
          {{- end }}
          {{- with .Values.events.readinessProbe }}
          readinessProbe:
            {{- include "taiga.probe" (dict "probe" . "defaults" $.Values.global.defaultProbes.readiness) | nindent 12 }}
          {{- end }}
          {{- with (default .Values.global.resources .Values.events.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with (default .Values.global.pod.nodeSelector .Values.events.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.pod.affinity .Values.events.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.pod.tolerations .Values.events.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
