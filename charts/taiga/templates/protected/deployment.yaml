apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taiga.fullname" . }}-protected
  labels:
    {{- include "taiga.labels" . | nindent 4 }}
    app.kubernetes.io/component: protected
spec:
  replicas: {{ .Values.protected.replicaCount }}
  selector:
    matchLabels:
      {{- include "taiga.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: protected
  template:
    metadata:
      {{- with .Values.protected.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "taiga.labels" . | nindent 8 }}
        app.kubernetes.io/component: protected
        {{- with .Values.protected.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "taiga.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.serviceAccount.automount }}
      securityContext:
        {{- include "taiga.podSecurityContext" (dict "ctx" . "values" .Values.protected "component" "protected") | nindent 8 }}
      containers:
        - name: protected
          securityContext:
            {{- include "taiga.securityContext" (dict "ctx" . "values" .Values.protected "component" "protected") | nindent 12 }}
          image: {{ include "taiga.image" (dict "ctx" . "image" .Values.protected.image "name" "taiga-protected") | quote }}
          imagePullPolicy: {{ .Values.protected.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8003
              protocol: TCP
          env:
            {{- include "taiga.protectedEnv" . | nindent 12 }}
            {{- with .Values.protected.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.global.extraEnvFrom .Values.protected.extraEnvFrom }}
          envFrom:
            {{- with .Values.global.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.protected.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.protected.livenessProbe }}
          livenessProbe:
            {{- include "taiga.probe" (dict "probe" . "defaults" $.Values.global.defaultProbes.liveness) | nindent 12 }}
          {{- end }}
          {{- with .Values.protected.readinessProbe }}
          readinessProbe:
            {{- include "taiga.probe" (dict "probe" . "defaults" $.Values.global.defaultProbes.readiness) | nindent 12 }}
          {{- end }}
          {{- with (default .Values.global.resources .Values.protected.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with (default .Values.global.pod.nodeSelector .Values.protected.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.pod.affinity .Values.protected.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.pod.tolerations .Values.protected.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
