{{- include "taiga.validate" . }}
{{- $g := .Values.global }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taiga.secretName" . }}
  labels:
    {{- include "taiga.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not $g.existingSecret }}
  secret-key: {{ include "taiga.generatedSecret" (dict "ctx" $ "key" "secret-key" "value" $g.secretKey "length" 64) | b64enc | quote }}
  {{- end }}
  {{- if and .Values.externalDatabase.enabled (not .Values.externalDatabase.existingSecret) }}
  postgres-password: {{ .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
  {{- if and .Values.db.enabled (not .Values.db.auth.existingSecret) (not $g.existingSecret) }}
  db-password: {{ include "taiga.generatedSecret" (dict "ctx" $ "key" "db-password" "value" .Values.db.auth.password "length" 32) | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.asyncRabbitmq.auth.existingSecret) (not $g.existingSecret) }}
  async-rabbitmq-password: {{ include "taiga.generatedSecret" (dict "ctx" $ "key" "async-rabbitmq-password" "value" .Values.asyncRabbitmq.auth.password "length" 32) | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.eventsRabbitmq.auth.existingSecret) (not $g.existingSecret) }}
  events-rabbitmq-password: {{ include "taiga.generatedSecret" (dict "ctx" $ "key" "events-rabbitmq-password" "value" .Values.eventsRabbitmq.auth.password "length" 32) | b64enc | quote }}
  {{- end }}
  {{- if and .Values.backend.email.password (not .Values.backend.email.existingSecret) }}
  email-password: {{ .Values.backend.email.password | b64enc | quote }}
  {{- end }}
  {{- if and $g.oidc.enabled $g.oidc.clientSecret (not $g.oidc.existingSecret) }}
  oidc-client-secret: {{ $g.oidc.clientSecret | b64enc | quote }}
  {{- end }}
