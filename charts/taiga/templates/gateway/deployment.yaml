apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taiga.fullname" . }}-gateway
  labels:
    {{- include "taiga.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "taiga.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway/configmap.yaml") . | sha256sum }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "taiga.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
        {{- with .Values.gateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with (concat .Values.global.imagePullSecrets .Values.backend.imagePullSecrets | uniq) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "taiga.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.serviceAccount.automount }}
      {{- with (default .Values.global.podSecurityContext .Values.gateway.podSecurityContext) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # The Django static files (admin, API browser) are collected in the backend image: copy them next to nginx.
        - name: copy-static
          {{- with (default .Values.global.securityContext .Values.gateway.securityContext) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "taiga.backImage" (dict "ctx" . "image" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["cp", "-R", "/taiga-back/static/.", "/static/"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: static
              mountPath: /static
      containers:
        - name: gateway
          {{- with (default .Values.global.securityContext .Values.gateway.securityContext) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.gateway.livenessProbe }}
          livenessProbe:
            {{- include "taiga.probe" (dict "probe" . "defaults" $.Values.global.defaultProbes.liveness) | nindent 12 }}
          {{- end }}
          {{- with .Values.gateway.readinessProbe }}
          readinessProbe:
            {{- include "taiga.probe" (dict "probe" . "defaults" $.Values.global.defaultProbes.readiness) | nindent 12 }}
          {{- end }}
          {{- with (default .Values.global.resources .Values.gateway.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            # pid file and temp paths of nginx-unprivileged
            - name: tmp
              mountPath: /tmp
            - name: static
              mountPath: /taiga/static
              readOnly: true
            {{- if .Values.global.persistence.media.enabled }}
            - name: media
              mountPath: /taiga/media
              readOnly: true
            {{- end }}
            {{- with .Values.gateway.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: nginx-config
          configMap:
            name: {{ if .Values.gateway.configMapName }}{{ .Values.gateway.configMapName }}{{ else }}{{ include "taiga.fullname" . }}-gateway{{ end }}
        - name: static
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.global.persistence.media.enabled }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "taiga.mediaClaimName" . }}
        {{- end }}
        {{- with .Values.gateway.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with (default .Values.global.pod.nodeSelector .Values.gateway.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "taiga.affinity" (dict "ctx" . "affinity" (default .Values.global.pod.affinity .Values.gateway.affinity) "media" true)) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.pod.tolerations .Values.gateway.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
