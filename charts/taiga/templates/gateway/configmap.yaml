{{- if not .Values.gateway.configMapName }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taiga.fullname" . }}-gateway
  labels:
    {{- include "taiga.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  default.conf: |
    server {
        listen 80 default_server;

        client_max_body_size 100M;
        charset utf-8;

        # Frontend
        location / {
            proxy_pass http://{{ include "taiga.fullname" . }}-frontend:{{ .Values.frontend.service.port }}/;
            proxy_pass_header Server;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
        }

        # Backend
        location /api/ {
            proxy_pass http://{{ include "taiga.fullname" . }}-backend:{{ .Values.backend.service.port }}/api/;
            proxy_pass_header Server;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
        }

        # Admin
        location /admin/ {
            proxy_pass http://{{ include "taiga.fullname" . }}-backend:{{ .Values.backend.service.port }}/admin/;
            proxy_pass_header Server;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
        }

        # Static files
        location /static/ {
            alias /taiga/static/;
        }

        # Media files
        location /_protected/ {
            internal;
            alias /taiga/media/;
            add_header Content-disposition "attachment";
        }

        # Protected files
        location /media/exports/ {
            proxy_pass http://{{ include "taiga.fullname" . }}-protected:{{ .Values.protected.service.port }}/;
            proxy_pass_header Server;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
        }

        location /media/ {
            proxy_pass http://{{ include "taiga.fullname" . }}-protected:{{ .Values.protected.service.port }}/;
            proxy_pass_header Server;
            proxy_set_header Host $http_host;
            proxy_redirect off;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Scheme $scheme;
        }

        # Events
        location /events {
            proxy_pass http://{{ include "taiga.fullname" . }}-events:{{ .Values.events.service.port }}/events;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }
    }
{{- end }}
