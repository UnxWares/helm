{{- $rmq := .Values.eventsRabbitmq }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "taiga.fullname" . }}-events-rabbitmq
  labels:
    {{- include "taiga.labels" . | nindent 4 }}
    app.kubernetes.io/component: events-rabbitmq
spec:
  serviceName: {{ include "taiga.fullname" . }}-events-rabbitmq
  replicas: {{ $rmq.replicaCount }}
  selector:
    matchLabels:
      {{- include "taiga.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: events-rabbitmq
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/rabbitmq-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with $rmq.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "taiga.labels" . | nindent 8 }}
        app.kubernetes.io/component: events-rabbitmq
        {{- with $rmq.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "taiga.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.serviceAccount.automount }}
      {{- with (default .Values.global.podSecurityContext $rmq.podSecurityContext) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rabbitmq
          {{- with (default .Values.global.securityContext $rmq.securityContext) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ $rmq.image.repository }}:{{ $rmq.image.tag }}"
          imagePullPolicy: {{ $rmq.image.pullPolicy }}
          ports:
            - name: amqp
              containerPort: 5672
              protocol: TCP
            - name: management
              containerPort: 15672
              protocol: TCP
          env:
            - name: RABBITMQ_DEFAULT_USER
              {{- if $rmq.auth.existingSecret }}
              {{- include "taiga.secretRef" (dict "ctx" $ "existing" $rmq.auth.existingSecret "existingKey" $rmq.auth.secretKeys.user) | nindent 14 }}
              {{- else if .Values.global.existingSecret }}
              {{- include "taiga.secretRef" (dict "ctx" $ "globalKey" "RABBITMQ_USER") | nindent 14 }}
              {{- else }}
              value: {{ $rmq.auth.user | quote }}
              {{- end }}
            - name: RABBITMQ_DEFAULT_PASS
              {{- include "taiga.secretRef" (dict "ctx" $ "existing" $rmq.auth.existingSecret "existingKey" $rmq.auth.secretKeys.password "globalKey" "RABBITMQ_PASS" "chartKey" "events-rabbitmq-password") | nindent 14 }}
            - name: RABBITMQ_DEFAULT_VHOST
              {{- if $rmq.auth.existingSecret }}
              {{- include "taiga.secretRef" (dict "ctx" $ "existing" $rmq.auth.existingSecret "existingKey" $rmq.auth.secretKeys.vhost) | nindent 14 }}
              {{- else }}
              value: {{ $rmq.auth.vhost | quote }}
              {{- end }}
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 15
          {{- with (default .Values.global.resources $rmq.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # RabbitMQ 4 cannot start on 3.x data: use a dedicated sub-directory (the old data stays untouched).
            - name: data
              mountPath: /var/lib/rabbitmq
              subPath: rabbitmq-4
            - name: config
              mountPath: /etc/rabbitmq/conf.d/20-taiga.conf
              subPath: 20-taiga.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "taiga.fullname" . }}-rabbitmq
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if and $rmq.persistence.enabled $rmq.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $rmq.persistence.existingClaim }}
        {{- else if not $rmq.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with (default .Values.global.pod.nodeSelector $rmq.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.pod.affinity $rmq.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.pod.tolerations $rmq.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and $rmq.persistence.enabled (not $rmq.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with $rmq.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ $rmq.persistence.accessMode }}
        {{- with $rmq.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $rmq.persistence.size }}
  {{- end }}
