{{- if .Values.async.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "taiga.fullname" . }}-async
  labels:
    {{- include "taiga.labels" . | nindent 4 }}
    app.kubernetes.io/component: async
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "taiga.fullname" . }}-async
  minReplicas: {{ .Values.async.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.async.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.async.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.async.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.async.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.async.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
