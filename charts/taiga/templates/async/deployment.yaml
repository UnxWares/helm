{{- $media := .Values.global.persistence.media }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taiga.fullname" . }}-async
  labels:
    {{- include "taiga.labels" . | nindent 4 }}
    app.kubernetes.io/component: async
spec:
  {{- if not .Values.async.autoscaling.enabled }}
  replicas: {{ .Values.async.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "taiga.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: async
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.async.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "taiga.labels" . | nindent 8 }}
        app.kubernetes.io/component: async
        {{- with .Values.async.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "taiga.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.serviceAccount.automount }}
      {{- with (default .Values.global.podSecurityContext .Values.async.podSecurityContext) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: async
          {{- with (default .Values.global.securityContext .Values.async.securityContext) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "taiga.backImage" (dict "ctx" . "image" .Values.async.image) | quote }}
          imagePullPolicy: {{ .Values.async.image.pullPolicy }}
          {{- with .Values.async.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "taiga.backendEnv" . | nindent 12 }}
            {{- with .Values.async.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.global.extraEnvFrom .Values.async.extraEnvFrom }}
          envFrom:
            {{- with .Values.global.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.async.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with (default .Values.global.resources .Values.async.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Exports and imports are written by the worker: it needs the media volume too.
          volumeMounts:
            {{- if $media.enabled }}
            - name: media
              mountPath: /taiga-back/media
            {{- end }}
            {{- with .Values.async.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if $media.enabled }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "taiga.mediaClaimName" . }}
        {{- end }}
        {{- with .Values.async.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with (default .Values.global.pod.nodeSelector .Values.async.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "taiga.affinity" (dict "ctx" . "affinity" (default .Values.global.pod.affinity .Values.async.affinity) "media" true)) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.pod.tolerations .Values.async.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
