{{- if .Values.db.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taiga.fullname" . }}-db
  labels:
    {{- include "taiga.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "taiga.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: db
  template:
    metadata:
      {{- with .Values.db.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "taiga.labels" . | nindent 8 }}
        app.kubernetes.io/component: db
        {{- with .Values.db.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "taiga.serviceAccountName" . }}
      {{- with (default .Values.global.podSecurityContext .Values.db.podSecurityContext) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          {{- with (default .Values.global.securityContext .Values.db.securityContext) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.db.service.port }}
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.db.auth.database | quote }}
            {{- if .Values.db.auth.existingSecret }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.auth.existingSecret }}
                  key: {{ .Values.db.auth.secretKeys.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.auth.existingSecret }}
                  key: {{ .Values.db.auth.secretKeys.password }}
            {{- else if .Values.global.existingSecret }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.existingSecret }}
                  key: POSTGRES_PASSWORD
            {{- else }}
            - name: POSTGRES_USER
              value: {{ .Values.db.auth.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.db.auth.password | quote }}
            {{- end }}
          {{- if .Values.db.healthcheck.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U {{ .Values.db.auth.user | quote }} -d {{ .Values.db.auth.database | quote }}
            initialDelaySeconds: {{ .Values.db.healthcheck.startPeriod | replace "s" "" | int }}
            periodSeconds: {{ .Values.db.healthcheck.interval | replace "s" "" | int }}
            timeoutSeconds: {{ .Values.db.healthcheck.timeout | replace "s" "" | int }}
            failureThreshold: {{ .Values.db.healthcheck.retries }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U {{ .Values.db.auth.user | quote }} -d {{ .Values.db.auth.database | quote }}
            initialDelaySeconds: {{ .Values.db.healthcheck.startPeriod | replace "s" "" | int }}
            periodSeconds: {{ .Values.db.healthcheck.interval | replace "s" "" | int }}
            timeoutSeconds: {{ .Values.db.healthcheck.timeout | replace "s" "" | int }}
            failureThreshold: {{ .Values.db.healthcheck.retries }}
          {{- end }}
          {{- with (default .Values.global.resources .Values.db.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.db.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ if .Values.db.persistence.existingClaim }}{{ .Values.db.persistence.existingClaim }}{{ else }}{{ include "taiga.fullname" . }}-db{{ end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with (default .Values.global.pod.nodeSelector .Values.db.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.pod.affinity .Values.db.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.pod.tolerations .Values.db.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
