suite: chart Secret
templates:
  - secret.yaml
release:
  name: files
  namespace: storage
tests:
  - it: is kept on uninstall, like the data volume
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: generates a session secret over a kept Secret without data
    set:
      cloudreve.existingSecret: ""
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: files-cloudreve
            namespace: storage
    asserts:
      - matchRegex:
          path: data["session-secret"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{64}$

  - it: generates a 64-character session secret at install
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: files-cloudreve
      - equal:
          path: metadata.namespace
          value: storage
      - equal:
          path: type
          value: Opaque
      - matchRegex:
          path: data["session-secret"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{64}$
      - notExists:
          path: data["db-password"]
      - notExists:
          path: data["redis-password"]

  - it: keeps the session secret already stored in the release Secret at upgrade
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: files-cloudreve
            namespace: storage
          data:
            session-secret: a2VwdC1mcm9tLXRoZS1wcmV2aW91cy1yZWxlYXNl  # kept-from-the-previous-release
    asserts:
      - equal:
          path: data["session-secret"]
          value: kept-from-the-previous-release
          decodeBase64: true

  - it: ignores a Secret of another release
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: other-cloudreve
            namespace: storage
          data:
            session-secret: a2VwdC1mcm9tLXRoZS1wcmV2aW91cy1yZWxlYXNl
    asserts:
      - matchRegex:
          path: data["session-secret"]
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{64}$

  - it: stores the session secret given in the values
    set:
      cloudreve:
        sessionSecret: a-session-secret-given-by-the-user
    asserts:
      - equal:
          path: data["session-secret"]
          value: a-session-secret-given-by-the-user
          decodeBase64: true

  - it: leaves the session secret out when it comes from an existing Secret
    set:
      cloudreve:
        existingSecret: cloudreve-session
    asserts:
      - notExists:
          path: data["session-secret"]

  - it: stores the database password for a server database
    set:
      database:
        type: postgres
        host: db.example.svc
        password: db-pass
    asserts:
      - equal:
          path: data["db-password"]
          value: db-pass
          decodeBase64: true
      - notExists:
          path: data["db-url"]

  - it: stores the database URL when given
    set:
      database:
        type: postgres
        url: postgres://cloudreve:pw@db:5432/cloudreve?sslmode=verify-full
    asserts:
      - equal:
          path: data["db-url"]
          value: postgres://cloudreve:pw@db:5432/cloudreve?sslmode=verify-full
          decodeBase64: true

  - it: stores no database credential with an existing database Secret
    set:
      database:
        type: mysql
        host: db.example.svc
        password: ignored
        url: mysql://ignored
        existingSecret: cloudreve-db
    asserts:
      - notExists:
          path: data["db-password"]
      - notExists:
          path: data["db-url"]

  - it: stores no database credential for SQLite even if a password is set
    set:
      database:
        password: unused
    asserts:
      - notExists:
          path: data["db-password"]

  - it: stores the Redis password when Redis is enabled
    set:
      redis:
        enabled: true
        server: valkey:6379
        password: redis-pass
    asserts:
      - equal:
          path: data["redis-password"]
          value: redis-pass
          decodeBase64: true

  - it: stores no Redis password when Redis is disabled
    set:
      redis:
        enabled: false
        password: redis-pass
    asserts:
      - notExists:
          path: data["redis-password"]

  - it: stores no Redis password with an existing Redis Secret
    set:
      redis:
        enabled: true
        server: valkey:6379
        password: redis-pass
        existingSecret: cloudreve-redis
    asserts:
      - notExists:
          path: data["redis-password"]

  - it: renders no Secret when the whole conf.ini comes from the user
    set:
      confini:
        existingSecret: my-conf-ini
    asserts:
      - hasDocuments:
          count: 0

  - it: uses the namespace override
    set:
      namespaceOverride: elsewhere
    asserts:
      - equal:
          path: metadata.namespace
          value: elsewhere
