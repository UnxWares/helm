{{- include "cloudreve.validate" . }}
{{- if not (include "cloudreve.confiniSecret" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudreve.fullname" . }}
  namespace: {{ include "cloudreve.namespace" . }}
  labels:
    {{- include "cloudreve.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  # Replaces every @@NAME@@ placeholder with the value of the NAME environment variable.
  render.awk: |
    {
      while (match($0, /@@[A-Z_]+@@/)) {
        name = substr($0, RSTART + 2, RLENGTH - 4)
        $0 = substr($0, 1, RSTART - 1) ENVIRON[name] substr($0, RSTART + RLENGTH)
      }
      print
    }
  # Template of conf.ini: the @@VAR@@ placeholders are filled from secret-backed environment
  # variables by the render-config init container, into a memory-backed volume.
  conf.ini.tpl: |
    [System]
    Mode = master
    Listen = :5212
    Debug = false
    SessionSecret = `@@CR_SESSION_SECRET@@`
    {{- with .Values.cloudreve.proxyHeader }}
    ProxyHeader = {{ . }}
    {{- end }}
    LogLevel = {{ .Values.cloudreve.logLevel }}

    [Database]
    Type = {{ .Values.database.type }}
    {{- if eq .Values.database.type "sqlite" }}
    DBFile = /cloudreve/data/cloudreve.db
    {{- else if or .Values.database.url .Values.database.existingSecretKeys.url }}
    DatabaseURL = `@@CR_DB_URL@@`
    {{- else }}
    Host = {{ .Values.database.host }}
    Port = {{ .Values.database.port }}
    User = {{ .Values.database.user }}
    Password = `@@CR_DB_PASSWORD@@`
    Name = {{ .Values.database.name }}
    {{- if has .Values.database.type (list "mysql" "mariadb") }}
    Charset = {{ .Values.database.charset }}
    {{- end }}
    {{- end }}
    {{- if .Values.redis.enabled }}

    [Redis]
    Server = {{ .Values.redis.server }}
    {{- with .Values.redis.user }}
    User = {{ . }}
    {{- end }}
    {{- if or .Values.redis.password .Values.redis.existingSecret }}
    Password = `@@CR_REDIS_PASSWORD@@`
    {{- end }}
    DB = {{ .Values.redis.db }}
    UseTLS = {{ .Values.redis.useTLS }}
    TLSSkipVerify = {{ .Values.redis.tlsSkipVerify }}
    {{- end }}
    {{- range $section, $keys := .Values.cloudreve.config }}

    [{{ $section }}]
    {{- range $key, $value := $keys }}
    {{ $key }} = {{ $value }}
    {{- end }}
    {{- end }}
{{- end }}
