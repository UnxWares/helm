{{- if not (include "cloudreve.confiniSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudreve.secretName" . }}
  namespace: {{ include "cloudreve.namespace" . }}
  labels:
    {{- include "cloudreve.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.cloudreve.existingSecret }}
  session-secret: {{ include "cloudreve.sessionSecret" . | b64enc | quote }}
  {{- end }}
  {{- if and (ne .Values.database.type "sqlite") (not .Values.database.existingSecret) }}
  db-password: {{ .Values.database.password | b64enc | quote }}
  {{- with .Values.database.url }}
  db-url: {{ . | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.redis.enabled .Values.redis.password (not .Values.redis.existingSecret) }}
  redis-password: {{ .Values.redis.password | b64enc | quote }}
  {{- end }}
{{- end }}
