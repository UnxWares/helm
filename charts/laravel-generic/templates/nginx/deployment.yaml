{{- if .Values.workload.nginx.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "laravel-generic.fullname" . }}-nginx
  labels:
    {{- include "laravel-generic.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workload.nginx.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "laravel-generic.fullname" . }}-nginx
  template:
    metadata:
      labels:
        app: {{ include "laravel-generic.fullname" . }}-nginx
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.workload.nginx.image.repository }}:{{ .Values.workload.nginx.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.workload.nginx.service.port }}
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            {{- toYaml .Values.workload.nginx.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "laravel-generic.fullname" . }}-nginx-config
{{- end }}
