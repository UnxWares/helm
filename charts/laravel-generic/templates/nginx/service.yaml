{{- if .Values.workload.nginx.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "laravel-generic.fullname" . }}-nginx
  labels:
    {{- include "laravel-generic.labels" . | nindent 4 }}
spec:
  type: {{ .Values.workload.nginx.service.type }}
  selector:
    app: {{ include "laravel-generic.fullname" . }}-nginx
  ports:
    - port: {{ .Values.workload.nginx.service.port }}
      targetPort: http
      protocol: TCP
      name: http
{{- end }}
