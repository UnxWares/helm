apiVersion: v1
kind: Service
metadata:
  name: {{ include "laravel-generic.fullname" . }}
  labels:
    {{- include "laravel-generic.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # FrankenPHP, or the nginx sidecar with the fpm runtime.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "laravel-generic.componentSelectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
