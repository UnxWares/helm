{{- $data := include "laravel-generic.secretData" . | trim }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "laravel-generic.secretName" . }}
  labels:
    {{- include "laravel-generic.labels" . | nindent 4 }}
  {{- if not (or .Values.laravel.key.value .Values.laravel.key.existingSecret) }}
  annotations:
    # Holds the generated APP_KEY: losing it makes encrypted data unreadable, so it survives
    # helm uninstall (like the PVC) and is reused by a later install of the same release.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- $data | nindent 2 }}
{{- end }}
