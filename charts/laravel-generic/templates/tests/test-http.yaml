apiVersion: v1
kind: Pod
metadata:
  name: {{ include "laravel-generic.fullname" . }}-test-http
  labels:
    {{- include "laravel-generic.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: http
      image: {{ .Values.tests.image | default (include "laravel-generic.image" .Values.workload.nginx.image) | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - wget
        - -q
        - -O
        - /dev/null
        - -T
        - "10"
        - http://{{ include "laravel-generic.fullname" . }}:{{ .Values.service.port }}{{ .Values.tests.path }}
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
