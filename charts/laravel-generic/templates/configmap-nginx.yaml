{{- if include "laravel-generic.fpm" . }}
{{- $nginx := .Values.workload.nginx }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "laravel-generic.fullname" . }}-nginx
  labels:
    {{- include "laravel-generic.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  nginx.conf: |
    # Rendered by the laravel-generic chart: unprivileged nginx with a read-only root filesystem.
    worker_processes {{ $nginx.workerProcesses }};
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" $request_time';
        access_log /dev/stdout main;

        sendfile on;
        tcp_nopush on;
        keepalive_timeout 65;
        server_tokens off;
        client_max_body_size {{ $nginx.clientMaxBodySize }};

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

    {{- if $nginx.config }}
        {{- $nginx.config | nindent 8 }}
    {{- else }}

        server {
            listen {{ $nginx.port }} default_server;
            {{- if $nginx.ipv6 }}
            listen [::]:{{ $nginx.port }} default_server;
            {{- end }}
            server_name _;
            root {{ include "laravel-generic.publicPath" . }};
            index index.php;
            charset utf-8;

            add_header X-Frame-Options "SAMEORIGIN";
            add_header X-Content-Type-Options "nosniff";

            location / {
                try_files $uri $uri/ /index.php?$query_string;
            }

            # Vite assets are fingerprinted: cache them for good.
            location /build/ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options "nosniff";
                access_log off;
                try_files $uri =404;
            }

            location = /favicon.ico { access_log off; log_not_found off; }
            location = /robots.txt  { access_log off; log_not_found off; }

            error_page 404 /index.php;

            location ~ ^/index\.php(/|$) {
                fastcgi_pass 127.0.0.1:{{ .Values.workload.runtime.fpm.port }};
                fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
                include fastcgi_params;
                fastcgi_hide_header X-Powered-By;
            }

            location ~ /\.(?!well-known).* {
                deny all;
            }
        }
    {{- end }}
    }
{{- end }}
