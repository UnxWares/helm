{{- /*
Migrations run before the new pods roll out (pre-install, pre-upgrade). At pre-install the release
resources do not exist yet, so the Job gets its own copy of the secret (deleted once the hook
succeeds), no PVC and no release service account. With SQLite the web pod migrates in an init container.
*/}}
{{- if and .Values.workload.migrations.enabled (not (include "laravel-generic.sqlite" .)) }}
{{- $m := .Values.workload.migrations }}
{{- $secretName := include "laravel-generic.migrationsSecretName" . }}
{{- $data := include "laravel-generic.secretData" . | trim }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "laravel-generic.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
data:
  {{- $data | nindent 2 }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "laravel-generic.fullname" . }}-migrations
  labels:
    {{- include "laravel-generic.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $m.backoffLimit }}
  {{- if include "laravel-generic.isSet" $m.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ $m.activeDeadlineSeconds }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include "laravel-generic.secretChecksum" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "laravel-generic.podLabels" (dict "ctx" . "component" "migrations") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- /* The release service account does not exist yet at pre-install: use it only when it is not created by the chart. */}}
      {{- include "laravel-generic.podCommon" (dict "ctx" . "serviceAccount" (not .Values.serviceAccount.create) "nodeSelector" $m.nodeSelector "tolerations" $m.tolerations "affinity" $m.affinity) | trim | nindent 6 }}
      {{- with (include "laravel-generic.prepareContainer" (dict "ctx" .)) }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        {{- include "laravel-generic.cliContainer" (dict "ctx" . "name" "migrate" "command" $m.command "resources" $m.resources "secretName" $secretName "persistence" false) | nindent 8 }}
      volumes:
        {{- include "laravel-generic.appVolumes" (dict "ctx" . "persistence" false) | nindent 8 }}
{{- end }}
