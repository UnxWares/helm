{{- if .Values.workload.scheduler.enabled }}
{{- $s := .Values.workload.scheduler }}
{{- $podCommon := include "laravel-generic.podCommon" (dict "ctx" . "serviceAccount" true "nodeSelector" $s.nodeSelector "tolerations" $s.tolerations "affinity" $s.affinity "colocate" (include "laravel-generic.singleNodeVolume" .)) | trim }}
{{- $prepare := include "laravel-generic.prepareContainer" (dict "ctx" . "persistence" .Values.persistence.enabled) }}
{{- $container := include "laravel-generic.cliContainer" (dict "ctx" . "name" "scheduler" "command" (ternary $s.command $s.workCommand (eq $s.mode "cronjob")) "resources" $s.resources "secretName" (include "laravel-generic.secretName" .) "persistence" .Values.persistence.enabled) }}
{{- $volumes := include "laravel-generic.appVolumes" (dict "ctx" . "persistence" .Values.persistence.enabled) }}
{{- if eq $s.mode "cronjob" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "laravel-generic.fullname" . }}-scheduler
  labels:
    {{- include "laravel-generic.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  schedule: {{ $s.schedule | quote }}
  concurrencyPolicy: {{ $s.concurrencyPolicy }}
  {{- if include "laravel-generic.isSet" $s.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ $s.startingDeadlineSeconds }}
  {{- end }}
  successfulJobsHistoryLimit: {{ $s.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $s.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        {{- include "laravel-generic.labels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      backoffLimit: {{ $s.backoffLimit }}
      ttlSecondsAfterFinished: {{ $s.ttlSecondsAfterFinished }}
      template:
        metadata:
          annotations:
            checksum/secret: {{ include "laravel-generic.secretChecksum" . }}
            {{- with .Values.podAnnotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          labels:
            {{- include "laravel-generic.podLabels" (dict "ctx" . "component" "scheduler") | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- $podCommon | nindent 10 }}
          {{- with $prepare }}
          initContainers:
            {{- . | nindent 12 }}
          {{- end }}
          containers:
            {{- $container | nindent 12 }}
          volumes:
            {{- $volumes | nindent 12 }}
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "laravel-generic.fullname" . }}-scheduler
  labels:
    {{- include "laravel-generic.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  # schedule:work must run exactly once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "laravel-generic.componentSelectorLabels" (dict "ctx" . "component" "scheduler") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include "laravel-generic.secretChecksum" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "laravel-generic.podLabels" (dict "ctx" . "component" "scheduler") | nindent 8 }}
    spec:
      {{- $podCommon | nindent 6 }}
      {{- with $prepare }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        {{- $container | nindent 8 }}
      volumes:
        {{- $volumes | nindent 8 }}
{{- end }}
{{- end }}
