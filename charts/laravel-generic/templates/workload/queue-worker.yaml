{{- if .Values.workload.queueWorker.enabled }}
{{- $q := .Values.workload.queueWorker }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "laravel-generic.fullname" . }}-queue
  labels:
    {{- include "laravel-generic.labels" . | nindent 4 }}
    app.kubernetes.io/component: queue-worker
spec:
  replicas: {{ $q.replicaCount }}
  selector:
    matchLabels:
      {{- include "laravel-generic.componentSelectorLabels" (dict "ctx" . "component" "queue-worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include "laravel-generic.secretChecksum" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "laravel-generic.podLabels" (dict "ctx" . "component" "queue-worker") | nindent 8 }}
    spec:
      {{- include "laravel-generic.podCommon" (dict "ctx" . "serviceAccount" true "nodeSelector" $q.nodeSelector "tolerations" $q.tolerations "affinity" $q.affinity "colocate" (include "laravel-generic.singleNodeVolume" .)) | trim | nindent 6 }}
      # queue:work finishes the current job on SIGTERM.
      terminationGracePeriodSeconds: {{ $q.terminationGracePeriodSeconds }}
      {{- with (include "laravel-generic.prepareContainer" (dict "ctx" . "persistence" .Values.persistence.enabled)) }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: queue-worker
          image: {{ include "laravel-generic.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with (include "laravel-generic.securityContext" (dict "ctx" .)) }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          command:
            {{- toYaml $q.command | nindent 12 }}
          env:
            {{- include "laravel-generic.env" (dict "ctx" . "secretName" (include "laravel-generic.secretName" .)) | nindent 12 }}
          {{- with (include "laravel-generic.envFrom" .) }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- with $q.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $q.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "laravel-generic.appVolumeMounts" (dict "ctx" . "persistence" .Values.persistence.enabled) | nindent 12 }}
      volumes:
        {{- include "laravel-generic.appVolumes" (dict "ctx" . "persistence" .Values.persistence.enabled) | nindent 8 }}
{{- end }}
