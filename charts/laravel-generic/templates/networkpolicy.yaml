{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "laravel-generic.fullname" . }}
  labels:
    {{- include "laravel-generic.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      {{- include "laravel-generic.componentSelectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.allowedFrom }}
      from:
        # Pods of the release (helm test...) and the allowed peers.
        - podSelector:
            matchLabels:
              {{- include "laravel-generic.selectorLabels" $ | nindent 14 }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Queue workers, scheduler and migrations serve nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "laravel-generic.fullname" . }}-workers
  labels:
    {{- include "laravel-generic.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "laravel-generic.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - queue-worker
          - scheduler
          - migrations
  policyTypes:
    - Ingress
{{- if .Values.networkPolicy.egress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "laravel-generic.fullname" . }}-egress
  labels:
    {{- include "laravel-generic.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "laravel-generic.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Pods of the release (helm test -> web).
    - to:
        - podSelector:
            matchLabels:
              {{- include "laravel-generic.selectorLabels" . | nindent 14 }}
    {{- with .Values.networkPolicy.egress.rules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
