suite: chart Secret, APP_KEY and the copy used by the migrations hook
templates:
  - secret.yaml
  - workload/migrations.yaml
release:
  name: shop
  namespace: shop
values:
  - values/image.yaml
tests:
  - it: generates a base64 APP_KEY of 32 bytes and keeps the Secret on uninstall
    template: secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: shop-laravel-generic
      - equal:
          path: type
          value: Opaque
      # base64 of "base64:" followed by 44 characters (32 random bytes, base64 encoded)
      - matchRegex:
          path: data["app-key"]
          pattern: '^YmFzZTY0O[A-Za-z0-9+/]{59}$'
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: reuses the APP_KEY already stored in the release Secret
    template: secret.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: shop-laravel-generic
            namespace: shop
          data:
            app-key: YmFzZTY0OkFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE9
    asserts:
      - equal:
          path: data["app-key"]
          value: YmFzZTY0OkFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE9
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: gives the migrations hook the same reused APP_KEY as the release Secret
    template: workload/migrations.yaml
    documentSelector:
      path: kind
      value: Secret
    values:
      - values/pgsql.yaml
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: shop-laravel-generic
            namespace: shop
          data:
            app-key: YmFzZTY0OkFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE9
    asserts:
      - equal:
          path: metadata.name
          value: shop-laravel-generic-migrations
      - equal:
          path: data["app-key"]
          value: YmFzZTY0OkFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE9
      - equal:
          path: data["db-password"]
          value: Y2ktZGItcGFzc3dvcmQ=

  - it: stores an explicit APP_KEY without the keep policy
    template: secret.yaml
    set:
      laravel.key.value: "base64:c2hvcC1leHBsaWNpdC1rZXktMDEyMzQ1Njc4OTAxMjM="
    asserts:
      - equal:
          path: data["app-key"]
          value: YmFzZTY0OmMyaHZjQzFsZUhCc2FXTnBkQzFyWlhrdE1ERXlNelExTmpjNE9UQXhNak09
      - notExists:
          path: metadata.annotations

  - it: renders no Secret when APP_KEY comes from an existing Secret and nothing else is stored
    template: secret.yaml
    set:
      laravel.key.existingSecret: shop-app-key
    asserts:
      - hasDocuments:
          count: 0

  - it: stores the other secrets without APP_KEY when APP_KEY comes from an existing Secret
    template: secret.yaml
    set:
      laravel.key.existingSecret: shop-app-key
      laravel.secretEnv:
        STRIPE_SECRET: sk_live_xxx
    asserts:
      - equal:
          path: data
          value:
            STRIPE_SECRET: c2tfbGl2ZV94eHg=
      - notExists:
          path: metadata.annotations

  - it: stores the database, Redis, mail and S3 credentials and secretEnv
    template: secret.yaml
    values:
      - values/pgsql.yaml
    set:
      laravel.redis.enabled: true
      laravel.redis.password: ci-redis-password
      laravel.mail.enabled: true
      laravel.mail.password: ci-mail-password
      laravel.aws.enabled: true
      laravel.aws.access_key_id: ci-access-key
      laravel.aws.secret_access_key: ci-secret-key
      laravel.secretEnv:
        STRIPE_SECRET: sk_live_xxx
    asserts:
      - equal:
          path: data["db-password"]
          value: Y2ktZGItcGFzc3dvcmQ=
      - equal:
          path: data["redis-password"]
          value: Y2ktcmVkaXMtcGFzc3dvcmQ=
      - equal:
          path: data["mail-password"]
          value: Y2ktbWFpbC1wYXNzd29yZA==
      - equal:
          path: data["aws-access-key-id"]
          value: Y2ktYWNjZXNzLWtleQ==
      - equal:
          path: data["aws-secret-access-key"]
          value: Y2ktc2VjcmV0LWtleQ==
      - equal:
          path: data["STRIPE_SECRET"]
          value: c2tfbGl2ZV94eHg=

  - it: does not store a password read from an existing Secret
    template: secret.yaml
    values:
      - values/pgsql.yaml
    set:
      laravel.database.existingSecret: shop-db-app
    asserts:
      - notExists:
          path: data["db-password"]
      - exists:
          path: data["app-key"]

  - it: stores the password when its existingSecret key is emptied
    template: secret.yaml
    values:
      - values/pgsql.yaml
    set:
      laravel.database.existingSecret: shop-db-app
      laravel.database.secretKeys.password: ""
    asserts:
      - equal:
          path: data["db-password"]
          value: Y2ktZGItcGFzc3dvcmQ=

  - it: does not store the database password with SQLite
    template: secret.yaml
    set:
      laravel.database.password: unused
    asserts:
      - notExists:
          path: data["db-password"]

  - it: does not store the credentials of disabled sections
    template: secret.yaml
    set:
      laravel.redis.password: ci-redis-password
      laravel.mail.password: ci-mail-password
      laravel.aws.access_key_id: ci-access-key
    asserts:
      - equal:
          path: data
          value:
            app-key: YmFzZTY0OkFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE9
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: shop-laravel-generic
            namespace: shop
          data:
            app-key: YmFzZTY0OkFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE9

  - it: makes the migrations Secret a pre-install hook deleted once the Job succeeds
    template: workload/migrations.yaml
    documentSelector:
      path: kind
      value: Secret
    values:
      - values/pgsql.yaml
    asserts:
      - equal:
          path: metadata.annotations
          value:
            helm.sh/hook: pre-install,pre-upgrade
            helm.sh/hook-weight: "-10"
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: migrations
