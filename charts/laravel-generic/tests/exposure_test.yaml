suite: Service, Ingress, HTTPRoute, PVC, service account and helm test
templates:
  - service.yaml
  - ingress.yaml
  - httproute.yaml
  - pvc.yaml
  - serviceaccount.yaml
  - tests/test-http.yaml
release:
  name: shop
  namespace: shop
values:
  - values/image.yaml
tests:
  - it: publishes the http port of the web pods only
    template: service.yaml
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 80
              targetPort: http
              protocol: TCP
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: laravel-generic
            app.kubernetes.io/instance: shop
            app.kubernetes.io/component: web

  - it: renders no Ingress and no HTTPRoute by default
    asserts:
      - hasDocuments:
          count: 0
        template: ingress.yaml
      - hasDocuments:
          count: 0
        template: httproute.yaml

  - it: routes the Ingress hosts to the http port of the Service, with TLS (README example)
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.className: nginx
      ingress.annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      ingress.hosts:
        - host: shop.example.com
          paths:
            - path: /
              pathType: Prefix
      ingress.tls:
        - secretName: shop-tls
          hosts:
            - shop.example.com
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt
      - equal:
          path: spec.tls
          value:
            - hosts:
                - shop.example.com
              secretName: shop-tls
      - equal:
          path: spec.rules[0]
          value:
            host: shop.example.com
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: shop-laravel-generic
                      port:
                        name: http

  - it: sends the HTTPRoute rules to the Service port
    template: httproute.yaml
    set:
      httpRoute.enabled: true
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.parentRefs
          value:
            - name: gateway
              sectionName: http
      - equal:
          path: spec.hostnames
          value:
            - chart-example.local
      - equal:
          path: spec.rules[0].backendRefs
          value:
            - name: shop-laravel-generic
              port: 80
              weight: 1
      - equal:
          path: spec.rules[0].matches[0].path
          value:
            type: PathPrefix
            value: /

  - it: keeps the PVC on helm uninstall
    template: pvc.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: spec.accessModes
          value:
            - ReadWriteOnce
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi
      - notExists:
          path: spec.storageClassName

  - it: sets the storage class, or an empty one with "-"
    template: pvc.yaml
    set:
      persistence.storageClass: "-"
    asserts:
      - equal:
          path: spec.storageClassName
          value: ""

  - it: creates no PVC with an existing claim
    template: pvc.yaml
    set:
      persistence.existingClaim: shop-files
    asserts:
      - hasDocuments:
          count: 0

  - it: creates a service account without token and with the given annotations
    template: serviceaccount.yaml
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/shop
    asserts:
      - equal:
          path: metadata.name
          value: shop-laravel-generic
      - equal:
          path: automountServiceAccountToken
          value: false
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789012:role/shop

  - it: creates no service account when serviceAccount.create is false
    template: serviceaccount.yaml
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: requests /up through the Service with wget from the nginx image
    template: tests/test-http.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - equal:
          path: spec.containers[0].image
          value: docker.io/nginxinc/nginx-unprivileged:1.30.6-alpine-slim
      - equal:
          path: spec.containers[0].command
          value: ["wget", "-q", "-O", "/dev/null", "-T", "10", "http://shop-laravel-generic:80/up"]
      - equal:
          path: spec.restartPolicy
          value: Never

  - it: follows tests.image, tests.path and service.port
    template: tests/test-http.yaml
    set:
      tests.image: docker.io/library/busybox:1.37
      tests.path: /health
      service.port: 8080
    asserts:
      - equal:
          path: spec.containers[0].image
          value: docker.io/library/busybox:1.37
      - equal:
          path: spec.containers[0].command[6]
          value: http://shop-laravel-generic:8080/health
